# DisplayXR for Hyprland (Omarchy) -- written by displayxr-hyprland-setup.
# Hyprland 0.53+ window-rule syntax. Re-run displayxr-hyprland-setup after a
# Hyprland upgrade; edit freely, but the setup replaces this file only while
# the "managed" line below is still here.
# displayxr-hyprland-setup: managed
#
# Windows that show a weave must reach the panel pixel for pixel: a border,
# rounded corners, a shadow, blur, dimming, transparency or an open/close
# animation resamples or covers the interlaced image and breaks the 3D.
# DisplayXR = the runtime's own XWayland window (WM_CLASS class),
# displayxr-service = its native Wayland window (app_id).
# Add your own 3D apps' classes to the regex (hyprctl clients shows them).

windowrule = border_size 0, match:class ^(DisplayXR|displayxr-service)$
windowrule = rounding 0, match:class ^(DisplayXR|displayxr-service)$
windowrule = no_shadow on, match:class ^(DisplayXR|displayxr-service)$
windowrule = no_blur on, match:class ^(DisplayXR|displayxr-service)$
windowrule = no_dim on, match:class ^(DisplayXR|displayxr-service)$
windowrule = opaque on, match:class ^(DisplayXR|displayxr-service)$
windowrule = no_anim on, match:class ^(DisplayXR|displayxr-service)$

# Workspace-controller launch hotkey. GNOME's extension grabs it for the
# service; on Hyprland bind it here. List ids with: displayxr-cli workspace list
# bind = SUPER ALT, D, exec, @PREFIX@/bin/displayxr-cli workspace launch <id>
