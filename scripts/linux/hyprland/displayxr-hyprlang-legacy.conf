# DisplayXR for Hyprland -- written by displayxr-hyprland-setup.
# Hyprland 0.48-0.52 window-rule syntax (unverified on hardware). Re-run
# displayxr-hyprland-setup after upgrading Hyprland to 0.53+.
# displayxr-hyprland-setup: managed
#
# See the 0.53+ version of this file for why: a weave must reach the panel
# pixel for pixel.

windowrule = noborder, class:^(DisplayXR|displayxr-service)$
windowrule = rounding 0, class:^(DisplayXR|displayxr-service)$
windowrule = noshadow, class:^(DisplayXR|displayxr-service)$
windowrule = noblur, class:^(DisplayXR|displayxr-service)$
windowrule = nodim, class:^(DisplayXR|displayxr-service)$
windowrule = opaque, class:^(DisplayXR|displayxr-service)$
windowrule = noanim, class:^(DisplayXR|displayxr-service)$

# bind = SUPER ALT, D, exec, @PREFIX@/bin/displayxr-cli workspace launch <id>
