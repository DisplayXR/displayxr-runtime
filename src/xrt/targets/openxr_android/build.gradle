import groovy.xml.XmlUtil

plugins {
    id 'com.android.application'
    id 'kotlin-android'

    id 'com.mikepenz.aboutlibraries.plugin'

    id "de.undercouch.download"

    // Hilt dependency injection
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'

    // Use spotless to format Java and Kotlin code
    id 'com.diffplug.spotless'
}

spotless {
    java {
        target 'src/main/java/**/*.java'
        // apply a specific flavor of google-java-format.
        googleJavaFormat('1.18.1').aosp().reflowLongStrings()
        // fix formatting of type annotations.
        formatAnnotations()
    }

    kotlin {
        target 'src/main/java/**/*.kt'
        // Use ktfmt(https://github.com/facebook/ktfmt) as the default Kotlin formatter.
        ktfmt("$ktfmtVersion").kotlinlangStyle()
    }
}

def parseOpenXRVersion(def fn) {
    def matches = file(fn).readLines().find {
        it.contains('XR_CURRENT_API_VERSION')
    } =~ ~/XR_MAKE_VERSION\(([^)]+)\)/
    def components = matches[0][1].split(',').collect { it.replace(' ', '').trim() }
    String.join('.', components)
}

project.ext.repoRoot = file('../../../../')

project.ext.renameLicense = { String name ->
    def lowerNoExtension = name.toLowerCase().replace(".txt", "")
    def result = lowerNoExtension.replaceAll(~/[\-.]/, "_") + ".txt"
    return result
}

project.ext.filterLicense = { String line ->
    if (line.trim().isEmpty()) {
        return '<br /><br />'
    } else {
        return XmlUtil.escapeXml(line)
    }
}

project.ext.licenseDir = new File(project.buildDir, 'generated/licenses/main/res/raw')

tasks.register('copyLicenses', Copy) {
    from "${rootDir}/LICENSES/"
    include 'BSL-1.0.txt'
    rename(renameLicense)
    into project.licenseDir
    filter(filterLicense)
}

// Grab Eigen if we can't find it on the system.
tasks.register('downloadEigen', Download) {
    src "https://gitlab.com/libeigen/eigen/-/archive/${project.eigenFetchVersion}/eigen-${project.eigenFetchVersion}.tar.gz"
    dest new File(project.buildDir, "intermediates/eigenDownload/eigen-${project.eigenFetchVersion}.tar.gz")
}

def eigenUnpackDir = new File(project.buildDir, 'intermediates/eigen')
tasks.register('unpackEigen', Copy) {
    dependsOn downloadEigen
    from tarTree(downloadEigen.dest)
    into eigenUnpackDir
    // Eigen ships Eigen3Config.cmake.in (template). A normal install
    // step resolves it; we don't run install, so write a minimal
    // header-only config that satisfies find_package(Eigen3 CONFIG).
    doLast {
        def cfg = new File(eigenUnpackDir,
            "eigen-${project.eigenFetchVersion}/cmake/Eigen3Config.cmake")
        cfg.text = '''\
# Header-only Eigen3 config generated by openxr_android build.gradle
# unpackEigen task. Upstream tarball ships only the .in template.
set(EIGEN3_VERSION_STRING "''' + project.eigenFetchVersion + '''")
set(Eigen3_VERSION        "''' + project.eigenFetchVersion + '''")
set(Eigen3_VERSION_STRING "''' + project.eigenFetchVersion + '''")

get_filename_component(_EIGEN3_ROOT "${CMAKE_CURRENT_LIST_DIR}/.." ABSOLUTE)
set(EIGEN3_ROOT_DIR     "${_EIGEN3_ROOT}")
set(EIGEN3_INCLUDE_DIR  "${_EIGEN3_ROOT}")
set(EIGEN3_INCLUDE_DIRS "${_EIGEN3_ROOT}")
set(EIGEN3_FOUND 1)

if(NOT TARGET Eigen3::Eigen)
    add_library(Eigen3::Eigen INTERFACE IMPORTED)
    set_target_properties(Eigen3::Eigen PROPERTIES
        INTERFACE_INCLUDE_DIRECTORIES "${_EIGEN3_ROOT}"
    )
endif()
'''
    }
}

if (!(new File(project.file(project.eigenCMakeDir), "Eigen3Config.cmake")).exists()) {
    println "project.eigenCMakeDir not set or not valid, so downloading Eigen at build time"
    project.ext.eigenCMakeDir = "${eigenUnpackDir}/eigen-${project.eigenFetchVersion}/cmake"
} else {
    println "Using Eigen as specified/detected in project.eigenCMakeDir: ${project.eigenCMakeDir}"
    downloadEigen.enabled = false
    unpackEigen.enabled = false
}

// ***
// Git version handling (#1379)
// ***
//
// Both stamps come from `git describe`, and BOTH have shipped wrong before:
//
//  - #1226 (v2.14.0): a shallow, tagless clone made describe degrade to
//    `--always`, so versionName was a bare SHA and versionCode was NULL.
//    A null versionCode means Android cannot compare versions and an
//    in-place upgrade is impossible. The checkout guards in
//    build-android.yml fixed the fetch; the swallow-everything
//    `catch (ignored) { return null }` that turned it into a silent, shipped
//    failure is fixed HERE.
//
//  - #1379: describe was invoked WITHOUT `--tags`, which considers only
//    ANNOTATED tags. Our release tags are lightweight (`git tag`, see
//    .claude/skills/release/SKILL.md Phase 2.1), so every APK since v2.14.5
//    named itself after the last annotated tag -- v2.14.5 -- while actually
//    being built from a v2.16.x commit.
//
// The two are coupled: adding `--tags` alone would feed the real (two-digit
// minor/patch) numbers into the old "%02d%01d%01d%05d" string format, whose
// %01d fields are MINIMUM widths -- v2.16.12-291 rendered as "02161200291",
// i.e. 2,161,200,291 > Integer.MAX_VALUE (2,147,483,647). parseInt would
// throw, the bare catch would return null, and #1226 would ship again.
// That is also why release tags must stay lightweight OR annotated purely as
// a matter of taste now: the arithmetic below, not the tag type, is what
// keeps the code in range.

// ---------------------------------------------------------------------------
// versionCode scheme (#1379). Positional, NOT string concatenation:
//
//     code = major * 100_000_000        // <= 20   (2 digits, weight 1e8)
//          + minor *   1_000_000        // <= 99   (2 digits, weight 1e6)
//          + patch *      10_000        // <= 99   (2 digits, weight 1e4)
//          + commits                    // <= 9999 (4 digits, weight 1e0)
//
// Every field is strictly narrower than its weight, so the encoding is a
// true positional number: ordering by code == ordering by
// (major, minor, patch, commits) lexicographically. Monotonic forever.
//
// Worked values:
//   v2.14.5-291   (what retail units carry today) = 214_500_291   [legacy format]
//   v2.16.12-291                                  = 216_120_291   > 214_500_291  OK
//   v2.16.14-4                                    = 216_140_004
//   v3.0.0-0                                      = 300_000_000   > any v2.x.y
//   v2.99.99-9999 (worst case in the v2 series)   = 299_999_999   < 300_000_000
//   v20.99.99-9999 (absolute maximum)             = 2_099_999_999 <= 2_147_483_647
//                                                                 and <= Google
//                                                                 Play's 2.1e9 cap
//
// Continuity with the OLD format is the reason for the 1e8/1e6/1e4 weights
// rather than something tidier: installed units report 214_500_291 and Android
// refuses a downgrade, so any new scheme MUST exceed that for v2.16.x. The old
// format's value for v2.M.P is 2_M*10^7-ish; the new one for the same release
// is larger for every M >= 15, and v2.16.x is where we are. Verified above.
//
// LIMIT: major > 20 overflows int. That is ~decades away, and the build fails
// loudly (below) rather than shipping a null. Revisit by moving to a
// major*10^7 packing (dropping a commits digit) if it ever matters.
// ---------------------------------------------------------------------------
def ANDROID_VERSION_CODE_MAX      = 2147483647     // Integer.MAX_VALUE
def ANDROID_VERSION_CODE_PLAY_CAP = 2100000000     // Google Play's ceiling
// The largest versionCode ever shipped under the OLD format (v2.14.5-291).
// Anything we emit must beat it or in-place upgrade breaks exactly once, on
// every retail unit in the field. CI turns this into a hard gate.
def ANDROID_VERSION_CODE_SHIPPED_FLOOR = 214500291

// `git describe --long` output. --long guarantees the -<n>-g<sha> suffix even
// when HEAD *is* the tag, so this shape is not optional.
def gitDescribeLongPattern = ~/v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-(?<commits>\d+)-g(?<hash>[0-9a-f]+)/

// Run git, failing the build loudly on a non-zero exit or empty output.
// There is deliberately no catch-and-return-null here: see #1226.
def gitOrDie = { List<String> args, String what ->
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def result
    try {
        result = exec {
            commandLine args
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
            workingDir rootDir
        }
    } catch (Exception e) {
        throw new GradleException(
            "openxr_android: cannot determine ${what} -- failed to run `${args.join(' ')}`: ${e.message}. " +
            "The APK version stamps are derived from git and MUST NOT be guessed (#1226).")
    }
    def out = stdout.toString().trim()
    if (result.exitValue != 0 || out.isEmpty()) {
        throw new GradleException(
            "openxr_android: cannot determine ${what} -- `${args.join(' ')}` exited ${result.exitValue}: " +
            "${stderr.toString().trim()}\n" +
            "This usually means the clone has no v* tags (a shallow or --no-tags fetch). " +
            "Run `git fetch --tags` (CI: actions/checkout with fetch-depth: 0 + fetch-tags: true). " +
            "Refusing to build an APK with a missing/guessed versionCode -- that is #1226.")
    }
    return out
}

// versionCode, from `git describe --tags --long`.
def getVersionCode = { ->
    def longOutput = gitOrDie(
        ['git', 'describe', '--tags', '--long', '--match', 'v[0-9]*'],
        'the Android versionCode')

    def matcher = longOutput =~ gitDescribeLongPattern
    if (!matcher.matches()) {
        throw new GradleException(
            "openxr_android: `git describe --tags --long --match 'v[0-9]*'` returned '${longOutput}', " +
            "which is not a vMAJOR.MINOR.PATCH-<commits>-g<sha>. Cannot derive a versionCode (#1379).")
    }

    int major   = Integer.parseInt(matcher.group('major'))
    int minor   = Integer.parseInt(matcher.group('minor'))
    int patch   = Integer.parseInt(matcher.group('patch'))
    int commits = Integer.parseInt(matcher.group('commits'))

    // Field-width guards. Each field must stay strictly narrower than its
    // weight or the positional encoding collapses and monotonicity is lost --
    // a silently WRONG code is worse than no build.
    if (minor > 99 || patch > 99 || commits > 9999 || major > 20) {
        throw new GradleException(
            "openxr_android: version ${major}.${minor}.${patch}+${commits} does not fit the versionCode " +
            "encoding (major<=20, minor<=99, patch<=99, commits<=9999) -- see the scheme comment in " +
            "src/xrt/targets/openxr_android/build.gradle (#1379). Refusing to emit a non-monotonic code.")
    }

    long code = (long) major * 100000000L + (long) minor * 1000000L + (long) patch * 10000L + (long) commits
    if (code > ANDROID_VERSION_CODE_MAX) {
        throw new GradleException(
            "openxr_android: computed versionCode ${code} exceeds Integer.MAX_VALUE (${ANDROID_VERSION_CODE_MAX}) " +
            "for ${longOutput}. This is exactly the overflow that made getVersionCode() return null in #1226/#1379.")
    }
    if (code > ANDROID_VERSION_CODE_PLAY_CAP) {
        logger.warn("openxr_android: versionCode ${code} exceeds Google Play's ${ANDROID_VERSION_CODE_PLAY_CAP} ceiling.")
    }
    if (code <= ANDROID_VERSION_CODE_SHIPPED_FLOOR) {
        // Not fatal here (an archaeology build of a pre-v2.15 branch is a
        // legitimate thing to do), but it must never reach a release: CI's
        // "Inspect APK" step turns this into an error.
        logger.warn("openxr_android: versionCode ${code} is NOT above the highest code already shipped " +
                    "(${ANDROID_VERSION_CODE_SHIPPED_FLOOR}, v2.14.5-291). Installed units would refuse this as a " +
                    "downgrade. Do not release this build (#1379).")
    }
    return (int) code
}

// versionName, from `git describe --tags --dirty`.
// Deliberately NOT --long: on the tag itself this yields a clean 'vX.Y.Z',
// and 'vX.Y.Z-<n>-g<sha>' only once you are past it. --dirty appends
// '-dirty' for an uncommitted tree, which is worth seeing on a dev pad.
def getVersionString = { ->
    return gitOrDie(
        ['git', 'describe', '--tags', '--dirty', '--match', 'v[0-9]*'],
        'the Android versionName')
}


// Pass -PsharedStl=true on the gradle command line to build with the shared runtime library.
// This has potential compatibility issues and should only be used if you're consuming another
// library that exposes a C++ interface.
project.ext.stl = "c++_static"
if (project.hasProperty("sharedStl") && project.getProperty("sharedStl")) {
    project.ext.stl = "c++_shared"
    println "Using SHARED C++ standard library"
}

// CNSDK Java glue for BOTH flavors (#510 M2 out-of-process, #1037 in-process).
// When the Leia CNSDK plug-in (libdxrp050_leia_cnsdk.so) loads the on-device
// LeiaSR core impl, it does so through a DexClassLoader whose parent comes from
// the Context it is handed, so the com.leia.* glue classes must be resolvable
// from the RUNTIME APK:
//   - outOfProcess: the plug-in runs in the runtime SERVICE process, so this
//     APK's own classloader serves them directly (#510 M2).
//   - inProcess: the plug-in runs in the APP's process and the app carries no
//     vendor AAR (ADR-025's requirement, ADR-036 D2/D5) — the loader hands the
//     plug-in a Context created with createPackageContext(<runtime pkg>, …)
//     whose getClassLoader() is THIS APK's (target_plugin_loader.c, #1037).
// Either way the glue ships here, never in the app.
// Resolve sdk-<ver>.aar from `cnsdk.dir` (local.properties) or -PcnsdkDir; if
// unset, the runtime builds CNSDK-free (sim_display fallback), matching the
// cube's opt-in pattern + ADR-019 (no vendor SDK in default/CI builds — the
// build-android.yml `libleiaSDK` guard asserts it). The .aar is the SOLE source
// of the CNSDK native runtime (libleiaCore-loader.so + libleiaSDK-jni.so) for
// this APK; only the Leia plug-in itself (libdxrp050_leia_cnsdk.so) lives in
// jniLibs.
def resolveCnsdkDir = {
    def fromProp = project.findProperty('cnsdkDir') ?: project.findProperty('cnsdk.dir')
    if (fromProp) {
        def f = new File(fromProp as String)
        return (f.isAbsolute() ? f : new File(rootProject.projectDir, fromProp as String)).absolutePath
    }
    def lp = new File(rootProject.projectDir, 'local.properties')
    if (lp.exists()) {
        def props = new Properties()
        lp.withReader('UTF-8') { props.load(it) }
        def d = props.getProperty('cnsdk.dir')
        if (d) {
            def f = new File(d)
            return (f.isAbsolute() ? f : new File(rootProject.projectDir, d)).absolutePath
        }
    }
    return null
}
def cnsdkDir = resolveCnsdkDir()
def cnsdkVersionFile = cnsdkDir ? new File("${cnsdkDir}/VERSION.txt") : null
def cnsdkVersion = (cnsdkVersionFile?.exists()) ? cnsdkVersionFile.text.trim() : null
def cnsdkAar = (cnsdkDir && cnsdkVersion) ? new File("${cnsdkDir}/android/sdk-${cnsdkVersion}.aar") : null
def hasCnsdk = cnsdkAar?.exists()
// Which BUILD of that version (x.y.z+<n>.<sha>): identification only, never gated
// (the loader .so carries no build metadata to assert against). Two builds of one
// dotted version stamp identical CNSDK_LOADER_VERSIONs -- this is what tells them
// apart. CI passes -PcnsdkBuild from the drop directory / release zip name; a
// local drop extracted to a bare "cnsdk-android-x.y.z" has no build info -> 'unknown'.
def cnsdkBuild = project.findProperty('cnsdkBuild') ?: (
    (cnsdkDir && (new File(cnsdkDir).name =~ /\d+\.\d+\.\d+\+\S+/)) ? (new File(cnsdkDir).name - ~/^cnsdk-android-/) : 'unknown')
println "openxr_android: runtime-hosted CNSDK Java glue ${hasCnsdk ? "ENABLED (${cnsdkAar})" : 'disabled (sim_display path)'}"

android {
    compileSdk project.sharedCompileSdk
    buildToolsVersion = buildToolsVersion

    ndkVersion "${ndk_version}"

    defaultConfig {
        // #1031 flavor merge: ONE applicationId. `.out_of_process` is kept as
        // the merged id deliberately — it is what every installed demo already
        // declares first in its `<queries>` and hands to createPackageContext
        // (displayxr-demo-*/android/.../MainActivity.kt), what the Khronos
        // broker rows resolve to, and what is installed on every dev pad — so
        // the merged APK upgrades in place with zero client churn. The
        // suffix is now a historical name, not a deployment mode.
        applicationId 'org.freedesktop.monado.openxr_runtime.out_of_process'
        minSdkVersion project.sharedMinSdk
        targetSdkVersion project.sharedTargetSdk

        resValue "string", "app_name", "DisplayXR"

        versionCode = getVersionCode()
        versionName = getVersionString()

        println versionName
        println versionCode

        resValue "string", "monado_lib_version", "${versionName}"

        // Stamp the bundled CNSDK loader version into the manifest so the pair
        // is auditable ON DEVICE with one `dumpsys package` -- without unpacking
        // the APK (#1357: loader 0.10.62 beside a 0.10.63 plug-in shipped green
        // twice because nothing on the device said which loader it carried).
        // Read from the drop's VERSION.txt: the .aar in that same drop is the
        // SOLE source of libleiaCore-loader.so, so it describes the loader.
        // "none" = built CNSDK-free (sim_display path). CI asserts this value
        // equals the string the loader .so itself reports.
        manifestPlaceholders = [cnsdkLoaderVersion: cnsdkVersion ?: 'none',
                                cnsdkLoaderBuild:   cnsdkVersion ? cnsdkBuild : 'none']

        resValue "string", "library_openxrheaders_libraryVersion", parseOpenXRVersion("${rootDir}/src/external/openxr_includes/openxr/openxr.h")

        externalNativeBuild {
            cmake {
                arguments "-DEigen3_DIR=${project.eigenCMakeDir}",
                    "-DANDROID_PLATFORM=${project.sharedMinSdk}",
                    "-DANDROID_STL=${project.stl}",
                    "-DANDROID_ARM_NEON=TRUE"

            }
            if (project.pythonBinary != null) {
                println "Path to Python 3 explicitly specified: ${project.pythonBinary}"
                cmake.arguments "-DPYTHON_EXECUTABLE=${project.pythonBinary}"
            }

            cmake.arguments "-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH"

            // #1031 flavor merge — the two switches that make ONE APK serve
            // both deployments. SERVICE=ON builds libdisplayxr-service.so and
            // turns on the IPC client; HYBRID_MODE=ON makes the runtime .so
            // carry the in-process native compositor *as well* and choose per
            // process at xrt_instance_create (in-process is the default).
            cmake.arguments "-DXRT_FEATURE_SERVICE=ON",
                "-DXRT_FEATURE_HYBRID_MODE=ON"

            // drv_sim_display_plugin: the vendor-neutral fallback DP. CMake
            // emits libdxrp200_sim_display.so; gradle packages it into
            // jniLibs/<abi>/ where convention-driven discovery finds it at
            // probe order 200 (#496).
            // displayxr-diag: the dashboard's JNI query bridge (#558). Its
            // name doesn't match the libdxrp<NNN>_ plug-in convention, so
            // discovery never mistakes it for a DP.
            // displayxr-service: the service .so hosted by MonadoService and
            // the MonadoServiceSlotN satellites.
            cmake.targets "openxr_displayxr", "displayxr-service",
                "drv_sim_display_plugin", "displayxr-diag"

            // Cross-building Android on a host that has a system cJSON
            // (e.g. macOS `brew install cjson`, Linux `libcjson-dev`) leaks the
            // host dylib/.so into the aarch64 link via FIND_ROOT_PATH_MODE=BOTH
            // above (ld.lld: "unknown file type"). Pass -PdxrForceVendoredCjson
            // to force the bundled cJSON. CI hosts have no system cJSON, so the
            // default path is unchanged there. Issue #496.
            if (project.hasProperty('dxrForceVendoredCjson')) {
                cmake.arguments "-DCMAKE_DISABLE_FIND_PACKAGE_cJSON=ON"
            }

            // Dev override: build the Kooima math (displayxr-common) from a local
            // checkout instead of the pinned GIT_TAG, for iterating on the shared
            // core (e.g. #521). Pass -PdxrCommonSrc=/abs/path/to/displayxr-common.
            // CMake's FetchContent honors FETCHCONTENT_SOURCE_DIR_<name> to swap
            // the fetched source for a local dir. No effect when unset.
            if (project.hasProperty('dxrCommonSrc')) {
                cmake.arguments "-DFETCHCONTENT_SOURCE_DIR_DISPLAYXR_COMMON=${project.dxrCommonSrc}"
            }
        }

        // Be sure to copy over licenses formatted as required.
        preBuild.dependsOn(copyLicenses)

        // We also need the unpacked Eigen
        preBuild.dependsOn(unpackEigen)

        //noinspection ChromeOsAbiSupport
        ndk { abiFilters 'arm64-v8a' }
        packagingOptions {
            jniLibs {
                exclude 'lib/arm64-v8a/libleiaSDK.so'
            }
        }

        // TODO: conditional
        packagingOptions {
            doNotStrip '**/*.so'

            jniLibs {
                keepDebugSymbols += "**/*.so"
            }
        }

        ndk {
            debugSymbolLevel 'FULL'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Gradle plugin produces proguard-android-optimize.txt from @Keep annotations
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "${rootDir}/CMakeLists.txt"
            version "${cmake_version}"
        }
    }

    // FLAVOR MERGE (#1031). There is no `deployment` flavor dimension any
    // more: the two mutually-exclusive `inProcess` / `outOfProcess` APKs are
    // now ONE hybrid runtime APK, mirroring Windows (one DisplayXRClient.dll
    // that hosts both the in-process native compositor and the IPC client and
    // picks per process at xrCreateInstance).
    //
    // Why the flavors had to die rather than coexist: both declared the same
    // `org.khronos.openxr.runtime_broker` ContentProvider authority, so only
    // one could ever be installed — which meant an Arch-A in-process app and
    // an Arch-C satellite / weave present-owner could never run on the same
    // device at the same time (ADR-036's D2+D3 coexistence blocker).
    //
    // The merged build turns BOTH switches on:
    //   XRT_FEATURE_SERVICE=ON     -> libdisplayxr-service.so (satellite slots,
    //                                 SlotBroker, MonadoService) + IPC client
    //   XRT_FEATURE_HYBRID_MODE=ON -> openxr_displayxr.so links the in-process
    //                                 native compositor AND the IPC client, and
    //                                 target.c selects between them at
    //                                 xrt_instance_create (see u_sandbox.c /
    //                                 android_app_mode.cpp for the rules).
    // In-process is the DEFAULT; an app opts into IPC per process.
    hilt {
        enableAggregatingTask = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    namespace 'org.freedesktop.monado.openxr_runtime'
    lint {
        fatal 'StopShip'
    }
    buildFeatures {
        buildConfig true
    }
}

androidComponents {
    onVariants(selector().withBuildType("debug")) {
        packaging.jniLibs.keepDebugSymbols.add("**")
    }
}

aboutLibraries {
    // Full license text for license IDs mentioned here
    // will be included, even if no detected dependency uses them.
    additionalLicenses = [
        "mit",
        "mpl_2_0",
        "bsl_1_0"
    ]
}

dependencies {
    // #1031: unconditional now. The merged APK always carries the service +
    // slot broker Java side; an in-process app simply never binds it.
    implementation project(':src:xrt:ipc')
    implementation project(':src:xrt:auxiliary')
    implementation project(':src:xrt:targets:android_common')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.constraintlayout:constraintlayout:$androidxConstraintLayoutVersion"
    implementation "com.google.android.material:material:$materialVersion"

    // Dependencies related only to AboutLibraries
    implementation "com.mikepenz:aboutlibraries-core:${latestAboutLibsRelease}"
    implementation "com.mikepenz:aboutlibraries:${latestAboutLibsRelease}"
    implementation "androidx.cardview:cardview:$androidxCardViewVersion"
    implementation "androidx.recyclerview:recyclerview:$androidxRecyclerViewVersion"


    // for Hilt dependency injection
    implementation "com.google.dagger:hilt-android:$hiltVersion"
    kapt "com.google.dagger:hilt-compiler:$hiltVersion"

    // CNSDK Java glue (com.leia.* classes), when cnsdk.dir is set — see the
    // block above build.gradle's `android {}` for why BOTH flavors carry it.
    // The .aar's native .so are excluded in defaultConfig.packagingOptions
    // above (#510 M2), which applies to both flavors, so the ADR-019 CI guard
    // ("no libleiaSDK*.so in the runtime APK") holds either way.
    if (hasCnsdk) {
        // #1031: one variant, so one dependency. It serves BOTH consumers —
        // the plug-in running in the runtime service process (#510 M2) and
        // the plug-in running in the APP's process, which reaches these
        // classes through createPackageContext(<runtime pkg>) (#1037 /
        // ADR-036 D2) — exactly as this APK already hosts
        // org.freedesktop.monado.ipc.Client for the IPC client.
        implementation files(cnsdkAar)
        implementation "androidx.annotation:annotation:$androidxAnnotationVersion"
    }
}

// For signing of release binaries - env var must contain an absolute path
// CI always does this.
def keystorePropertiesFilename = System.getenv("MONADO_KEYSTORE_PROPERTIES")
if (keystorePropertiesFilename) {
    def keystorePropertiesFile = file("${keystorePropertiesFilename}")
    if (keystorePropertiesFile.exists()) {
        println("Signing release artifacts for monado")
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        android.signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file("${project.repoRoot}/" + keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
        android.buildTypes.release.signingConfig android.signingConfigs.release
    }
}

// Org-standard release signing (#1212). Parallel to the Monado-inherited
// properties-file mechanism above, NOT a replacement — that one resolves
// storeFile relative to ${project.repoRoot}, so it cannot take the absolute
// $RUNNER_TEMP path CI decodes the keystore to.
//
// This is the same env-driven shape every displayxr-demo-* repo already uses:
// CI decodes ANDROID_KEYSTORE_BASE64 to a file and exports
// ANDROID_KEYSTORE_FILE. The double guard (the null check INSIDE the config,
// and the conditional signingConfig assignment) is what makes a keyless build
// — a fork PR, or any contributor — emit an UNSIGNED release APK rather than
// failing. CI then refuses to attach an unsigned APK to a release.
def dxrKeystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
if (dxrKeystoreFile != null && !dxrKeystoreFile.isEmpty() && file(dxrKeystoreFile).exists()) {
    println("openxr_android: release signing ENABLED (ANDROID_KEYSTORE_FILE)")
    android.signingConfigs {
        release {
            storeFile file(dxrKeystoreFile)
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
} else {
    println("openxr_android: release signing disabled (no ANDROID_KEYSTORE_FILE) — release APK will be UNSIGNED")
}

// CNSDK AAR is no longer included here — the Leia CNSDK plug-in repo
// (displayxr-leia-plugin) builds libdxrp050_leia_cnsdk.so and bundles
// the CNSDK runtime; that .so is dropped into this APK's jniLibs/<ABI>/
// (POC mode) or shipped in a separate vendor APK (v2, runtime #310).
