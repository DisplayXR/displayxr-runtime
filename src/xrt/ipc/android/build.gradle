plugins {
    id 'com.android.library'
    id 'kotlin-android'

    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'

    id 'com.diffplug.spotless'
}

// ---------------------------------------------------------------- satellite slots
//
// N pre-declared, non-isolated compositor processes (ADR-036 D3, #1031). Each is a
// MonadoService subclass with its own android:process, so binding it spins up a
// separate runtime process that runs the ordinary out-of-process compositor for
// exactly one client. Default 4 — enough for desktop-style windowing on a tablet
// panel; each costs ~30-60 MB plus one GPU context.
project.ext.satelliteSlotCount =
    (project.findProperty('dxrSatelliteSlots') ?: '4') as int
project.ext.satelliteSlotGenDir =
    new File(project.buildDir, 'generated/dxr-satellite-slots/java')

def satelliteSlotPackageDir =
    new File(project.satelliteSlotGenDir, 'org/freedesktop/monado/ipc')

tasks.register('generateSatelliteSlots') {
    description = 'Generate the MonadoServiceSlotN classes from dxrSatelliteSlots.'
    def count = project.satelliteSlotCount
    def outDir = satelliteSlotPackageDir
    inputs.property('count', count)
    outputs.dir(project.satelliteSlotGenDir)
    doLast {
        outDir.mkdirs()
        def sb = new StringBuilder()
        sb << """// Copyright 2026, Leia Inc.
// SPDX-License-Identifier: BSL-1.0
//
// GENERATED by :src:xrt:ipc:generateSatelliteSlots from dxrSatelliteSlots=${count}.
// Do not edit; edit the count in src/xrt/ipc/android/build.gradle.
package org.freedesktop.monado.ipc

/**
 * The pre-declared satellite compositor processes (ADR-036 D3, #1031).
 *
 * Each slot is declared in the library manifest with its own `android:process=":dxrN"`, so binding
 * it starts a *separate* runtime process that runs the ordinary out-of-process compositor for
 * exactly one client: one `comp_multi`, one `android_globals` surface, one display processor, one
 * vendor core. Process isolation is what makes the runtime's process-global singletons harmless.
 *
 * The slots are **non-isolated** on purpose: an `android:isolatedProcess` service cannot reach
 * SurfaceFlinger or gralloc, so it could never present.
 *
 * Which slot a client gets is decided by [SlotBroker] in the main process, never by the client.
 */
object MonadoServiceSlots {
    /** Number of pre-declared satellite slots; matches the manifest declarations. */
    const val COUNT = ${count}

    const val CLASS_NAME_PREFIX = "org.freedesktop.monado.ipc.MonadoServiceSlot"

    @JvmStatic fun classNameFor(slot: Int): String = CLASS_NAME_PREFIX + slot
}
"""
        for (int i = 0; i < count; i++) {
            sb << """
/** Satellite compositor slot ${i} — process `:dxr${i}`. @see MonadoServiceSlots */
class MonadoServiceSlot${i} : MonadoService() {
    override val slotIndex: Int
        get() = ${i}
}
"""
        }
        new File(outDir, 'MonadoServiceSlots.kt').text = sb.toString()
    }
}

tasks.register('checkSatelliteSlotManifest') {
    description = 'Fail the build if AndroidManifest.xml and dxrSatelliteSlots disagree.'
    def count = project.satelliteSlotCount
    def manifest = file('src/main/AndroidManifest.xml')
    inputs.property('count', count)
    inputs.file(manifest)
    outputs.upToDateWhen { false }
    doLast {
        def text = manifest.text
        def declared = (text =~ /android:name="org\.freedesktop\.monado\.ipc\.MonadoServiceSlot(\d+)"/)
            .collect { it[1] as int }.sort()
        def expected = (0..<count).toList()
        if (declared != expected) {
            throw new GradleException(
                "AndroidManifest.xml declares satellite slots ${declared} but dxrSatelliteSlots=${count} " +
                "expects ${expected}. Add/remove the <service android:name=\".MonadoServiceSlotN\" " +
                "android:process=\":dxrN\"/> entries to match.")
        }
        expected.each { i ->
            if (!(text =~ /MonadoServiceSlot${i}"[\s\S]{0,400}?android:process=":dxr${i}"/)) {
                throw new GradleException(
                    "MonadoServiceSlot${i} in AndroidManifest.xml is missing android:process=\":dxr${i}\".")
            }
        }
    }
}

android {
    compileSdk project.sharedCompileSdk
    buildToolsVersion = buildToolsVersion


    defaultConfig {
        // needed for ASharedMemory, etc.
        minSdkVersion 26
        targetSdkVersion project.sharedTargetSdk

        def defaultServiceLibName = "displayxr-service"
        def serviceLibName = project.hasProperty("serviceLibName") ?
            project.serviceLibName : defaultServiceLibName
        if (serviceLibName == null || serviceLibName.length() == 0) {
            serviceLibName = defaultServiceLibName
        }

        // Single point of truth for these names.
        def serviceAction = "org.freedesktop.monado.ipc.CONNECT"
        def shutdownAction = "org.freedesktop.monado.ipc.SHUTDOWN"
        manifestPlaceholders = [
                serviceActionName : serviceAction,
                shutdownActionName: shutdownAction
        ]
        buildConfigField("String", "SERVICE_ACTION", "\"${serviceAction}\"")
        buildConfigField("String", "SHUTDOWN_ACTION", "\"${shutdownAction}\"")
        buildConfigField("Long", "WATCHDOG_TIMEOUT_MILLISECONDS", "1500L")
        buildConfigField("String", "SERVICE_LIB_NAME", "\"${serviceLibName}\"")

        // Satellite compositor slots (ADR-036 D3, #1031). SINGLE SOURCE OF TRUTH:
        // this number generates the MonadoServiceSlotN classes below and is
        // checked against the manifest by checkSatelliteSlotManifest. To raise
        // it: bump dxrSatelliteSlots (here or -PdxrSatelliteSlots=N), add the
        // matching <service android:process=":dxrN"/> entries to
        // src/main/AndroidManifest.xml, and the check task will tell you if the
        // two disagree.
        buildConfigField("int", "SATELLITE_SLOT_COUNT", "${project.satelliteSlotCount}")
    }

    buildTypes {
        release {
            minifyEnabled false
            // Gradle plugin produces proguard-android-optimize.txt from @Keep annotations
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
    sourceSets {
        main {
            java.srcDirs += project.satelliteSlotGenDir
        }
    }

    namespace 'org.freedesktop.monado.ipc'
    lint {
        fatal 'StopShip'
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
}

dependencies {
    implementation project(':src:xrt:auxiliary')
    implementation "androidx.annotation:annotation:$androidxAnnotationVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"

    // for Hilt dependency injection
    api "com.google.dagger:hilt-android:$hiltVersion"
    kapt "com.google.dagger:hilt-compiler:$hiltVersion"
}

spotless {
    java {
        target 'src/main/java/**/*.java'
        // apply a specific flavor of google-java-format.
        googleJavaFormat('1.18.1').aosp().reflowLongStrings()
        // fix formatting of type annotations.
        formatAnnotations()
    }

    kotlin {
        target 'src/main/java/**/*.kt'
        // Use ktfmt(https://github.com/facebook/ktfmt) as the default Kotlin formatter.
        ktfmt("$ktfmtVersion").kotlinlangStyle()
    }
}

// preBuild is what every variant's compile chain hangs off, so the generated
// sources exist before Kotlin runs and the manifest check gates every build.
afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn 'generateSatelliteSlots', 'checkSatelliteSlotManifest'
    }
}
