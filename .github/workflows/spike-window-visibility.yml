# SPIKE (not a required check, branch-scoped): can CI catch a permanently
# invisible window?
#
# The bug class: a cloaked window passes every "did it start" check. Process
# alive, log emitted, HWND present, IsWindowVisible() TRUE. That shipped twice --
# plug-in #256 in v2.13.0, then again in v2.16.0 when an early DWM cloak had no
# un-cloak on the no-runtime path (no runtime => no session => no overlay to
# un-cloak => cloaked, parked, invisible; hit on both of a tester's machines
# within an hour). `DWMWA_CLOAKED` appears nowhere in the runtime tree, so the
# window predicate the codebase already uses cannot see it.
#
# This job answers two questions and nothing else:
#   Q1  Can a GitHub-hosted windows runner host a top-level window and read DWM
#       cloak state at all? (The load-bearing unknown -- the runner agent runs as
#       a service.)
#   Q2  Does the gate DISCRIMINATE? It must pass a plainly visible window and
#       FAIL the known-bad ones. A gate that cannot fail on a deliberately broken
#       input proves nothing, which is exactly the lesson of this bug class.
#
# The job is green only if every arm's verdict matches what it is SUPPOSED to be,
# and only if the `not_cloaked` arm was actually ENFORCED rather than skipped --
# the same belt-and-braces the runtime self-test applies to its input-provider
# check ("a silently-skipped path would pass the exit code").
name: spike-window-visibility

on:
  push:
    branches: [spike/ci-window-visibility-gate]
  workflow_dispatch:

jobs:
  visibility-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report what the runner can host
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "OS            : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "SESSIONNAME   : '$env:SESSIONNAME'"
          Write-Host "UserInteractive: $([System.Environment]::UserInteractive)"
          Write-Host "monitors      : $(@([System.Windows.Forms.Screen]::AllScreens).Count)"
          $dwm = Get-Process -Name dwm -ErrorAction SilentlyContinue
          Write-Host "dwm.exe       : $(if ($dwm) { "running (pid $($dwm.Id -join ','))" } else { 'NOT RUNNING' })"

      # Each arm runs in its own powershell.exe so a wedged message pump cannot
      # take the others with it. Verdicts land as JSON and are asserted below.
      - name: Run the six arms
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path verdicts | Out-Null
          foreach ($m in @('normal','cloak','minimize','offscreen','runtime_present','no_runtime')) {
            Write-Host "=============== $m ==============="
            & powershell -ExecutionPolicy Bypass -NoProfile -File scripts\test\window_visibility_check.ps1 `
                -Mode $m -SettleMs 1500 -Json "verdicts\$m.json" | Out-Null
            Write-Host "  exit=$LASTEXITCODE"
            if (Test-Path "verdicts\$m.json") {
              $v = Get-Content "verdicts\$m.json" -Raw | ConvertFrom-Json
              Write-Host ("  PROCESS presentable={0} ({1}/{2} windows)" -f $v.presentable, $v.windows_presentable, $v.windows_total)
              foreach ($w in $v.windows) {
                Write-Host ("    {0} {1,-22} presentable={2} failed=[{3}]" -f $w.hwnd, $w.title, $w.presentable, ($w.failed -join ','))
              }
            } else {
              Write-Host "::warning::no verdict written for $m"
            }
          }
          # The arms EXPECT non-zero exits (three of the four are known-bad
          # windows), so this step must not adopt the last one's code. Whether
          # those codes are the RIGHT ones is the next step's whole job.
          exit 0

      - name: Assert the gate discriminates
        shell: pwsh
        run: |
          # What each arm MUST conclude. The load-bearing pair is
          # runtime_present vs no_runtime: they differ by exactly the thing that
          # broke, so a gate that cannot tell them apart proves nothing.
          #
          # Note runtime_present MUST PASS with its main window cloaked. Cloaking
          # the engine window is the shipping design; a gate that rejected it would
          # be rejecting the feature, not catching a bug.
          $expect = @{
            normal          = @{ presentable = $true;  mustFailArm = $null }
            cloak           = @{ presentable = $false; mustFailArm = 'not_cloaked' }
            minimize        = @{ presentable = $false; mustFailArm = 'not_minimised' }
            offscreen       = @{ presentable = $false; mustFailArm = 'rect_on_a_monitor' }
            runtime_present = @{ presentable = $true;  mustFailArm = $null }
            no_runtime      = @{ presentable = $false; mustFailArm = 'not_cloaked' }
          }

          $fail = 0
          foreach ($m in $expect.Keys | Sort-Object) {
            $p = "verdicts\$m.json"
            if (-not (Test-Path $p)) { Write-Host "::error::$m produced no verdict."; $fail = 1; continue }
            $v = Get-Content $p -Raw | ConvertFrom-Json
            $e = $expect[$m]

            if ($v.presentable -ne $e.presentable) {
              Write-Host "::error::$m -- PROCESS presentable=$($v.presentable), expected $($e.presentable) ($($v.windows_presentable)/$($v.windows_total) windows)."
              $fail = 1
            } else {
              Write-Host "PASS: $m -- process presentable=$($v.presentable) as expected ($($v.windows_presentable)/$($v.windows_total) windows)."
            }

            # The arm that matters must have actually RUN. A skipped check passes
            # an exit code while proving nothing -- which is this whole bug class.
            if (-not $v.not_cloaked_enforced) {
              Write-Host "::error::$m -- the not_cloaked arm was SKIPPED on this runner. The gate proves nothing here."
              $fail = 1
            }

            if ($e.mustFailArm) {
              $hit = @($v.windows | ForEach-Object { $_.failed } | Where-Object { $_ -eq $e.mustFailArm })
              if ($hit.Count -eq 0) {
                Write-Host "::error::$m -- no window failed on '$($e.mustFailArm)'. The gate is blind to the reason."
                $fail = 1
              } else {
                Write-Host "      caught by '$($e.mustFailArm)'."
              }
            }
          }

          # The discriminating pair, stated on its own: same cloak, and the only
          # difference is whether an overlay exists to be seen instead.
          $rp = Get-Content "verdicts\runtime_present.json" -Raw | ConvertFrom-Json
          $nr = Get-Content "verdicts\no_runtime.json" -Raw | ConvertFrom-Json
          Write-Host ""
          Write-Host "--- the discriminating pair ---"
          Write-Host ("runtime_present : presentable={0} ({1}/{2} windows) <- main window IS cloaked, and that is correct" -f $rp.presentable, $rp.windows_presentable, $rp.windows_total)
          Write-Host ("no_runtime      : presentable={0} ({1}/{2} windows) <- THE BUG" -f $nr.presentable, $nr.windows_presentable, $nr.windows_total)
          if ($rp.presentable -and -not $nr.presentable) {
            Write-Host "The gate SEPARATES them. It would have caught the v2.16.0 regression without rejecting the feature."
          } else {
            Write-Host "::error::the gate does NOT separate the shipping design from the regression."
            $fail = 1
          }

          # Q1, stated separately so a runner limitation reads as a runner
          # limitation and not as a passing gate.
          $cl = (Get-Content "verdicts\cloak.json" -Raw | ConvertFrom-Json)
          Write-Host ""
          Write-Host "--- feasibility ---"
          Write-Host "monitors on runner : $($cl.environment.monitors)"
          Write-Host "DwmSetWindowAttribute(DWMWA_CLOAK) hr : $($cl.environment.cloak_set_hr)"
          Write-Host "not_cloaked enforced on this runner   : $($cl.not_cloaked_enforced)"

          if ($fail -ne 0) { Write-Host "::error::visibility gate did not discriminate correctly."; exit 1 }
          Write-Host ""
          Write-Host "ALL ARMS CORRECT -- a cloaked/minimised/parked window is catchable in CI."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visibility-verdicts
          path: verdicts/
