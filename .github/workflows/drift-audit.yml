name: drift-audit

# Cross-repo drift audit (epic #691 / child #695). Runs scripts/drift_audit.py
# against the whole org via the `gh` CLI: FetchContent pins vs latest tags,
# displayxr-common pin spread, vendored-spec staleness, the openxr_includes
# API-version matrix, the demo three-pins rule, and prose version drift.
#
# Weekly (and on demand) so the whole #691 class of drift can't silently
# recur between audits.
#
# TOKEN: reading private org repos (displayxr-shell-pvt) and opening issues on
# *other* repos both need more than the default GITHUB_TOKEN. Set an org-scoped
# PAT as the `DRIFT_AUDIT_TOKEN` secret. Without it READS degrade to
# "could not fetch … skipped" notes rather than failing.
#
# WRITES used to degrade far worse than that. `DRIFT_AUDIT_TOKEN` has never
# been set, so this ran on GITHUB_TOKEN, which cannot open an issue on a
# sibling repo -- and emit_issue printed "opened new issue on …" without
# checking, while main() returned 0 unconditionally in emit mode. Result:
# every weekly run from 2026-07-06 to 2026-08-24 reported success having filed
# nothing, and real drift (a displayxr-common pin spread, a stale vendored
# spec) accumulated unseen behind a green check.
#
# Now: emission failure is printed with the real gh error, the run annotates a
# ::warning::, and the findings still land as ONE aggregate issue on this repo
# (a workflow token can always write to its own repo). The job fails only if
# the findings reached nobody at all. Setting DRIFT_AUDIT_TOKEN -- or granting
# the displayxr-publish-bot App the `issues` permission it currently lacks
# entirely -- restores per-repo issues.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      emit_issues:
        description: 'Open/update issues on offending repos (else dry-run)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-audit
  cancel-in-progress: false

jobs:
  drift-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run drift audit
        env:
          # Prefer the org-scoped PAT; fall back to the default token.
          GH_TOKEN: ${{ secrets.DRIFT_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # schedule -> emit issues; manual dispatch honours the input.
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event.inputs.emit_issues }}" = "true" ]; then
            python3 scripts/drift_audit.py --emit-issues
          else
            python3 scripts/drift_audit.py --dry-run
          fi
