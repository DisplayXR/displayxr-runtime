name: Build Windows

on:
  # Public-repo CI policy: fire freely. CI is free for public repos on
  # GitHub-hosted runners, so we optimize for contributor experience
  # rather than minute-burn:
  # - Drafts run CI too. Contributors get fast feedback without the
  #   Ready-for-review handshake.
  # - Push to main fires the workflow as a sanity check (catches the
  #   rare admin-bypass merge that lands red).
  # - Doc-only PRs are detected by DetectChanges (`docs_only` output);
  #   the heavy steps skip when true, but the workflow still fires and
  #   Runtime still reports a status so branch protection's required-
  #   status-check on `Runtime` is satisfied. Saves wall-clock time +
  #   keeps logs clean even if not money.
  # - Rapid pushes to a PR cancel the in-progress run; only the latest
  #   commit's CI completes (concurrency group below).
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request: {}

# Cancel any in-progress run for the same PR (or branch) when a new
# push comes in. Only the latest commit's CI completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      test_apps_changed: ${{ steps.filter.outputs.test_apps }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full clone — the diff below uses pull_request.base.sha,
          # which can be older than the merge commit's first parent
          # (PR base lags main after a main push). Shallow clones miss
          # those refs and the diff fails with "fatal: bad object".
          # This job only does git plumbing, so the clone is cheap.
          fetch-depth: 0
      - id: filter
        run: |
          # Tag pushes are releases. Test apps are a *compile check* gated on
          # test_apps/ changes — they're no longer packaged into artifacts or
          # attached to releases, so there's nothing to build on a tag. Force
          # docs_only=false (Runtime + installer must build) but leave
          # test_apps=false so the per-app compile jobs stay skipped on tags.
          # github.event.before is all-zeros on tag pushes, so the diff-based
          # path below would miss this case.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "test_apps=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Detected tag push — forcing docs_only=false, test_apps_changed=false"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # test_apps_changed: any test_apps/ files modified. (Demos live in
          # their own displayxr-demo-* repos now — no demos/ tree to watch.)
          if echo "$CHANGED" | grep -qE '^test_apps/'; then
            echo "test_apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_apps=false" >> "$GITHUB_OUTPUT"
          fi
          # docs_only: every changed file matches doc / boilerplate patterns.
          # When true, Runtime (and downstream test-app jobs) still RUN — to
          # report a status for branch protection — but skip their heavy
          # steps via per-step `if:`.
          # An EMPTY diff also counts as docs_only: the only zero-file pushes
          # to main are /release's empty "Release vX.Y.Z" marker commits, and
          # their real build runs on the tag push (forced docs_only=false
          # above). A bad BASE object can't masquerade as an empty diff — the
          # step runs under bash -e, so a failed `git diff` fails the job.
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected test_apps_changed=$(grep ^test_apps= "$GITHUB_OUTPUT" | cut -d= -f2) docs_only=$(grep ^docs_only= "$GITHUB_OUTPUT" | cut -d= -f2)"

  Runtime:
    # Always runs on PRs (drafts included) and main pushes so it can
    # report a status check; heavy steps below skip when DetectChanges
    # flagged the PR as docs_only. Free CI for public repos.
    needs: DetectChanges
    runs-on: windows-2022

    env:
      GH_TOKEN: ${{ github.token }}
      DOCS_ONLY: ${{ needs.DetectChanges.outputs.docs_only }}

    steps:

      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true
          # History + tags: cmake/DisplayXRVersion.cmake versions the build from
          # `git describe` (#1790). A shallow clone cannot reach the last vX.Y.Z
          # tag from a main/PR commit, which is how a main build came to report
          # "v1.6.0 '0967ae7d'" and the Unity plug-in picked UNORM swapchains.
          fetch-depth: 0

      - name: Doc-only PR — skipping heavy build steps
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "DetectChanges flagged docs_only=true; the steps below skip and the Runtime job reports a success status without running the full Windows build."

      # No vendor SDK fetch — the runtime DLL holds zero vendor identifiers
      # in its link line (ADR-019). Vendor drv_* implementations ship from
      # separate repos as plug-in DLLs (see DisplayXR/displayxr-leia-plugin
      # and docs/guides/vendor-plugin-onboarding.md).

      # vcpkg binary cache (#1773). Without one, every run rebuilds every port
      # from source and re-downloads every upstream archive, so any upstream
      # host outage (SourceForge vs pthreads, 2026-10) is a hard CI stop.
      # run-vcpkg@v11 defaults VCPKG_BINARY_SOURCES to `x-gha`, a backend
      # vcpkg has removed (it only logs a warning), so nothing was cached.
      # run-vcpkg leaves an already-set VCPKG_BINARY_SOURCES alone, so set a
      # `files` provider here and persist it with actions/cache.
      #
      # vcpkg keys each package by its own ABI hash (port files, triplet,
      # compiler, deps), so a stale entry can never be used for the wrong
      # build. The cache key only decides what gets saved: vcpkg commit +
      # triplet + runner image (compiler) + manifest/overlay hash. A miss
      # falls back to the newest entry for the same vcpkg commit + triplet
      # (restore-keys), and every package whose ABI still matches is reused.
      - name: Configure vcpkg binary cache
        id: vcpkg-bincache
        if: needs.DetectChanges.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_BINARY_SOURCES=clear;files,$dir,readwrite"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dir=$dir"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "image=$env:ImageOS-$env:ImageVersion"

      - name: Restore vcpkg binary cache
        id: vcpkg-bincache-restore
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vcpkg-bincache.outputs.dir }}
          key: vcpkg-bin-x64-windows-5d90b0d5-${{ steps.vcpkg-bincache.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}
          restore-keys: |
            vcpkg-bin-x64-windows-5d90b0d5-

      - name: Restore from cache and setup vcpkg executable and data files.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '5d90b0d5d0317336e65662f2bf0d671b0902c632'
          vcpkgJsonGlob: 'vcpkg.json'

      # No Vulkan SDK download. The build only needs the loader + headers
      # (find_package(Vulkan) -> Vulkan::Vulkan) and glslangValidator (SPIR-V.cmake),
      # all supplied by vcpkg (vulkan-loader, vulkan-headers, glslang in vcpkg.json).
      # The old humbletim/install-vulkan-sdk step pinned a LunarG version whose
      # installer URL ages out (404 -> curl error 22 on a cold cache); dropping it
      # removes that whole class of failure.

      - name: Provision glslangValidator from vcpkg onto PATH
        if: needs.DetectChanges.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          # SPIR-V.cmake calls find_program(glslangValidator), which the LunarG
          # SDK used to satisfy via PATH. vcpkg's glslang ships the same tool
          # (vcpkg_copy_tools -> <root>/x64-windows/tools/glslang/), but the
          # toolchain only installs it *during* Generate, after which nothing
          # has put its dir on PATH. Eagerly materialize the manifest deps here,
          # locate the tool, and prepend its directory to PATH before Generate.
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          $tool = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Include glslangValidator.exe,glslang.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '[\\/]tools[\\/]' } | Select-Object -First 1
          if (-not $tool) { throw "glslang tool not found under the vcpkg install tree" }
          Add-Content -Path $env:GITHUB_PATH -Value $tool.Directory.FullName
          Write-Host "glslang tool on PATH: $($tool.FullName)"

      - if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenXR loader
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          # src/xrt/targets/openxr/CMakeLists.txt installs openxr_loader.dll
          # into the runtime tree for downstream consumers (displayxr-shell,
          # third-party workspace apps), gated on OpenXR_ROOT. Without this
          # download that install rule is skipped and the installer ships
          # without the loader.
          $openxrVersion = "1.1.63"
          $openxrUrl = "https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-$openxrVersion/openxr_loader_windows-$openxrVersion.zip"
          Invoke-WebRequest -Uri $openxrUrl -OutFile openxr_loader.zip
          Expand-Archive -Path openxr_loader.zip -DestinationPath openxr_sdk -Force

      - name: Generate
        id: generate
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_FEATURES=gui `
            -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON `
            -DCMAKE_INSTALL_PREFIX=_package `
            -DXRT_BUILD_INSTALLER=ON `
            -DXRT_FEATURE_SERVICE=ON `
            -DXRT_FEATURE_HYBRID_MODE=ON `
            -DOpenXR_ROOT="${{ github.workspace }}/openxr_sdk" `
            -DBUILD_NUM="${{ github.run_number }}"

      # Save right after the last vcpkg install (Generate adds the `gui`
      # feature's ports), not at job end, so a later compile or test failure
      # still keeps the packages. Only after a successful Generate, so a
      # half-installed set is never stored under the exact key (an exact hit
      # skips the save, so it would never be completed). An exact-key hit
      # already holds everything.
      - name: Save vcpkg binary cache
        if: always() && steps.generate.outcome == 'success' && steps.vcpkg-bincache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-bincache.outputs.dir }}
          key: ${{ steps.vcpkg-bincache-restore.outputs.cache-primary-key }}

      - name: Build
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build build --config Release --target install

      # ADR-019 / issues #256 & #263 — the runtime DLL must hold zero
      # vendor identifiers in its link line. drv_leia lives in its own
      # repo (DisplayXR/displayxr-leia-plugin) post-#263 and the runtime
      # tree has no SR source at all. DisplayXRClient.dll should
      # import nothing matching `SimulatedReality*`. This step is a
      # permanent tripwire: catches accidental re-introduction of a
      # vendor static-link path or a new transitive dep dragging the
      # SR libs back in — at PR time, before any artifact ships.
      - name: Assert runtime DLL has zero vendor identifiers
        if: needs.DetectChanges.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $dll = "_package/bin/DisplayXRClient.dll"
          if (-not (Test-Path $dll)) {
            Write-Host "::error::$dll missing — runtime build did not produce expected artifact."
            exit 1
          }
          $sr = & dumpbin /imports $dll 2>&1 | Select-String -Pattern "SimulatedReality"
          if ($sr) {
            Write-Host "::error::ADR-019 regression — DisplayXRClient.dll has SimulatedReality static imports:"
            $sr | ForEach-Object { Write-Host "  $_" }
            Write-Host "Fix: drop the offending drv_leia / SR library link from the runtime DLL's link line. Vendor code belongs in the DisplayXR-LeiaSR.dll plug-in (see docs/adr/ADR-019-vendor-plugin-aux-boundary.md)."
            exit 1
          }
          Write-Host "PASS: runtime DLL has zero SimulatedReality imports (ADR-019 §2.1 holds)."
          # ADR-054 N4: the trunk is more than the runtime DLL. The service and
          # the CLI host every class loader too, and a vendor or a reference
          # component (sim_display, sim_input, sim_conversion, the Ultraleap
          # provider and its LeapC.dll) must reach them only through a loader,
          # never through the import table or the link line. Two views, both
          # asserted: what each binary imports (dumpbin /dependents) and what
          # each binary's link edge named (the Release LINK_LIBRARIES in the
          # Ninja Multi-Config impl file), because a static library drags in no
          # import and shows only on the link line.
          $trunk = @("_package/bin/DisplayXRClient.dll", "_package/bin/displayxr-service.exe", "_package/bin/displayxr-cli.exe")
          $forbiddenDeps = "SimulatedReality|LeapC|DisplayXR-Sim|DisplayXR-Ultraleap|DisplayXR-LeiaSR|DimencoWeaving"
          $forbiddenLibs = "drv_sim_display\.lib|drv_leia|drv_ultraleap|SimulatedReality|LeapC|drv_sim_input|drv_sim_conversion|drv_sim_tracking"
          $ninjaFile = "build/CMakeFiles/impl-Release.ninja"
          if (-not (Test-Path $ninjaFile)) {
            Write-Host "::error::$ninjaFile missing — the guard cannot see the Release link edges."
            exit 1
          }
          $ninja = Get-Content $ninjaFile -Raw
          foreach ($bin in $trunk) {
            if (-not (Test-Path $bin)) {
              Write-Host "::error::$bin missing — build did not produce expected artifact."
              exit 1
            }
            $deps = & dumpbin /dependents $bin 2>&1 | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() }
            $bad = $deps | Where-Object { $_ -match $forbiddenDeps }
            if ($bad) {
              Write-Host "::error::ADR-054 §1 regression — $bin imports a component or vendor DLL: $($bad -join ', ')"
              exit 1
            }
            $leaf = [System.IO.Path]::GetFileName($bin)
            # The edge header is `build <dir>\Release\<leaf>[ <more outputs>]: <rule> ...`,
            # followed by its indented variables up to the next blank line. The
            # file is CRLF on Windows, so the blank line is `\r?\n\r?\n`.
            $m = [regex]::Match($ninja, "(?ms)^build [^\n]*?\\Release\\$([regex]::Escape($leaf))[ :][^\n]*\n(.*?)\r?\n\r?\n")
            if (-not $m.Success) {
              Write-Host "::error::could not find the $leaf link edge in $ninjaFile — the guard cannot see its link line."
              exit 1
            }
            $linkLine = ($m.Groups[1].Value -split "`n" | Where-Object { $_ -match 'LINK_LIBRARIES' }) -join ' '
            if ($linkLine.Length -eq 0) {
              Write-Host "::error::the $leaf link edge has no LINK_LIBRARIES line — the guard cannot see its link line."
              exit 1
            }
            $badLibs = ($linkLine -split ' ' | Where-Object { $_ -match $forbiddenLibs } | Sort-Object -Unique)
            if ($badLibs) {
              Write-Host "::error::ADR-054 §1 regression — $leaf links a component or vendor library: $($badLibs -join ', ')"
              exit 1
            }
            Write-Host "PASS: $leaf imports no component/vendor DLL and links no drv_*/vendor library."
          }
          # Also assert that the plug-in DLL we expect IS shipped — guards
          # against a CMake regression that silently drops the plug-in.
          $plugin = "_package/bin/plugins/DisplayXR-SimDisplay.dll"
          if (-not (Test-Path $plugin)) {
            Write-Host "::error::$plugin missing — sim-display plug-in did not build."
            exit 1
          }
          $exports = & dumpbin /exports $plugin 2>&1 | Select-String -Pattern "xrtPluginNegotiate"
          if (-not $exports) {
            Write-Host "::error::$plugin missing xrtPluginNegotiate export (ADR-019 contract — exactly one symbol)."
            exit 1
          }
          Write-Host "PASS: sim-display plug-in built and exports xrtPluginNegotiate."
          # Same guard for the input-provider plug-in (ADR-034 / #823).
          $inputPlugin = "_package/bin/plugins/DisplayXR-SimInput.dll"
          if (-not (Test-Path $inputPlugin)) {
            Write-Host "::error::$inputPlugin missing — sim-input provider did not build."
            exit 1
          }
          $inputExports = & dumpbin /exports $inputPlugin 2>&1 | Select-String -Pattern "xrtInputPluginNegotiate"
          if (-not $inputExports) {
            Write-Host "::error::$inputPlugin missing xrtInputPluginNegotiate export (ADR-034 contract — exactly one symbol)."
            exit 1
          }
          Write-Host "PASS: sim-input provider built and exports xrtInputPluginNegotiate."
          # And the conversion-provider reference (ADR-053 / #2002; required
          # since ADR-054 §2.3: every class ships a reference implementation).
          $convPlugin = "_package/bin/plugins/DisplayXR-SimConversion.dll"
          if (-not (Test-Path $convPlugin)) {
            Write-Host "::error::$convPlugin missing — sim-conversion provider did not build."
            exit 1
          }
          $convExports = & dumpbin /exports $convPlugin 2>&1 | Select-String -Pattern "xrtConversionPluginNegotiate"
          if (-not $convExports) {
            Write-Host "::error::$convPlugin missing xrtConversionPluginNegotiate export (ADR-053 contract — exactly one symbol)."
            exit 1
          }
          Write-Host "PASS: sim-conversion provider built and exports xrtConversionPluginNegotiate."

      # Unit tests. `tests/` has carried ~20 Catch2 suites that CI BUILT and never
      # RAN -- `grep -rn ctest .github/workflows/` returned nothing before this
      # step, so every invariant pinned in there was pinned on developer boxes
      # only. Hardware-free by construction (the suites own no graphics types), so
      # this costs seconds and is the only place some fixes CAN be covered: the
      # app-level zones arm cannot run on a hosted runner at all (no Vulkan ICD is
      # registered; the sole adapter is "Microsoft Hyper-V Video").
      - name: Unit tests (ctest)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $bd = if (Test-Path build) { "build" } else { "_build" }
          if (-not (Test-Path $bd)) {
            Write-Host "::error::no build dir -- cannot run ctest."
            exit 1
          }
          # -C matches the multi-config generator; --output-on-failure so a red
          # check names the assertion instead of just a count.
          # tests_oxr_view_space (#1370) needs a registered display processor;
          # it SKIPs here and is re-run for real in the self-test step below,
          # after sim-display is registered.
          ctest --test-dir $bd -C Release --output-on-failure --no-tests=error -E tests_oxr_view_space
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::unit tests failed."
            exit 1
          }

      # First runtime EXECUTION smoke test in CI. Every other job only builds.
      # `displayxr-cli selftest` creates an instance + system devices headlessly
      # (no compositor, no GPU, no window), discovers the display processor via
      # the REAL registry path, and validates the display info the plug-in
      # reports. Its exit code is the gate. This isolates plug-in discovery /
      # ABI / display-info failures from compositor+GPU ones and catches the
      # ABI-drift class of bugs (cf. ADR-020) at PR time.
      - name: Headless self-test (displayxr-cli selftest)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $cli = "_package/bin/displayxr-cli.exe"
          if (-not (Test-Path $cli)) {
            Write-Host "::error::$cli missing — CLI did not build."
            exit 1
          }
          $plugin = (Resolve-Path "_package/bin/plugins/DisplayXR-SimDisplay.dll").Path
          # Windows plug-in discovery is registry-only (no env override), so
          # register the just-built sim-display plug-in exactly as the runtime
          # installer would. GitHub runners run as admin — the HKLM write needs
          # no elevation prompt. Cleaned up in the finally block.
          $key = "HKLM\Software\DisplayXR\DisplayProcessors\sim-display"
          reg add $key /v Binary /t REG_SZ /d "$plugin" /f | Out-Null
          reg add $key /v ProbeOrder /t REG_DWORD /d 200 /f | Out-Null
          reg add $key /v DisplayName /t REG_SZ /d "Simulated 3D Display" /f | Out-Null
          # ADR-034 / #823: also register the sim-input provider so the
          # self-test exercises the input-provider path — discovery, builder
          # arbitration (a PRESENT provider claims left/right over qwerty), and
          # the role/profile assertions all run hardware-free.
          $inputPlugin = (Resolve-Path "_package/bin/plugins/DisplayXR-SimInput.dll").Path
          $inputKey = "HKLM\Software\DisplayXR\InputProviders\sim-input"
          reg add $inputKey /v Binary /t REG_SZ /d "$inputPlugin" /f | Out-Null
          reg add $inputKey /v ProbeOrder /t REG_DWORD /d 200 /f | Out-Null
          reg add $inputKey /v DisplayName /t REG_SZ /d "DisplayXR Sim Input" /f | Out-Null
          # ADR-053 / #1999: register the sim conversion provider too, exactly as
          # `register_dev_plugin.bat conv sim` does (ProbeOrder 250, FALLBACK
          # band; Version written last). The DLL is mandatory since #2002
          # landed (the vendor-identifier step above already fails on its
          # absence); ADR-054 §2.3 makes a shipped reference part of what a
          # class IS, so a missing one is a build regression, not a skip.
          $convKey = "HKLM\Software\DisplayXR\ConversionProviders\sim-conversion"
          $convPlugin = (Resolve-Path "_package/bin/plugins/DisplayXR-SimConversion.dll").Path
          reg add $convKey /v Binary /t REG_SZ /d "$convPlugin" /f | Out-Null
          reg add $convKey /v ProbeOrder /t REG_DWORD /d 250 /f | Out-Null
          reg add $convKey /v DisplayName /t REG_SZ /d "DisplayXR Sim Conversion" /f | Out-Null
          # #2006: the sim provider's probe declines unless setting ENABLE = 1
          # (spec §7.2: "CI registers sim-conversion with ENABLE = 1"); without
          # it the selftest lists the row but never validates a descriptor.
          reg add "$convKey\Settings" /v ENABLE /t REG_SZ /d "1" /f | Out-Null
          reg add $convKey /v Version /t REG_SZ /d "ci" /f | Out-Null
          $convRegistered = $true
          Write-Host "Registered sim-conversion provider: $convPlugin"
          # ADR-054 N4b PR B: the provenance gate ENFORCES by default on Windows and
          # this runner is elevated (the dev override is refused there), so allowlist
          # the three just-built, unsigned DLLs the way the runtime installer /
          # register_dev_plugin.bat do. Rows removed in the finally block.
          $allowRoot = "HKLM\Software\DisplayXR\Trust\Allowlist"
          $allowlisted = @()
          foreach ($dll in @($plugin, $inputPlugin, $convPlugin)) {
            $h = (Get-FileHash -Path $dll -Algorithm SHA256).Hash.ToLower()
            reg add $allowRoot /v $h /t REG_SZ /d "ci $(Split-Path $dll -Leaf)" /f | Out-Null
            $allowlisted += $h
          }
          Write-Host "Allowlisted $($allowlisted.Count) plug-in digest(s) (ADR-054 N4b)."
          # Registration is no longer enough: since ADR-034 Amendment 1
          # sim-input's probe() declines unless DXR_SIM_INPUT is set, so that a
          # stray registration on a dev box can't put synthetic controllers in
          # front of a user. CI *wants* the simulated provider, so it opts in
          # explicitly — and that keeps this gate meaningful, because the
          # provider then reports PRESENT and must actually claim the roles.
          $env:DXR_SIM_INPUT = "1"
          try {
            & $cli selftest
            $code = $LASTEXITCODE

            # #1370: with a display processor registered, the OpenXR-level
            # view-space acceptance test can run for real (it SKIPped in the
            # ctest pass above). xrLocateViews must honour the requested base
            # space on the legacy and the rig path; a SKIP here is a FAILURE
            # (the environment is exactly what it needs).
            if ($code -eq 0) {
              $bd = if (Test-Path build) { "build" } else { "_build" }
              $vsOut = (& ctest --test-dir $bd -C Release -V --no-tests=error -R tests_oxr_view_space 2>&1 | Out-String)
              $vsCode = $LASTEXITCODE
              Write-Host $vsOut
              if ($vsCode -ne 0) {
                Write-Host "::error::tests_oxr_view_space failed (exit $vsCode) - xrLocateViews does not honour the base space (#1370)."
                $code = $vsCode
              } elseif ($vsOut -cmatch "SKIPPED:") {
                Write-Host "::error::tests_oxr_view_space SKIPped with sim-display registered - the headless runtime did not come up (#1370). (Catch2 prints SKIPPED: for an explicit skip; matched case-sensitively so the runtime's own 'skipping ...' INFO lines cannot trip it.)"
                $code = 1
              } else {
                Write-Host "PASS: tests_oxr_view_space (#1370 base-space gate)."
              }
            }

            # Belt-and-braces (#823): the input check must have actually
            # EVALUATED (a silently-skipped input path would pass the exit
            # code). Parse the JSON verdict for the input_providers row.
            if ($code -eq 0) {
              $rawSelf = (& $cli selftest --json 2>$null | Out-String)
              $s = $rawSelf.IndexOf('{'); $e = $rawSelf.LastIndexOf('}')
              if ($s -lt 0 -or $e -le $s) {
                Write-Host "::error::selftest --json emitted no JSON object."
                $code = 1
              } else {
                $selfObj = $rawSelf.Substring($s, $e - $s + 1) | ConvertFrom-Json
                $inputCheck = $selfObj.checks | Where-Object { $_.name -eq "input_providers" }
                if (-not $inputCheck -or -not $inputCheck.ok -or $inputCheck.detail -notmatch "provider 'sim-input'") {
                  Write-Host "::error::input-provider check missing/failed/skipped with sim-input registered (#823). Detail: $($inputCheck.detail)"
                  $code = 1
                } else {
                  Write-Host "PASS: input-provider gate — $($inputCheck.detail)"
                }
                # ADR-053 / #2006: with sim-conversion registered, the
                # conversion_providers check must have SEEN it (enumerate ->
                # negotiate -> describe, no model load). Same guard as the
                # registration above.
                # TODO(#2002): drop the $convRegistered guard once the sim
                # provider always builds -- then count >= 1 is unconditional.
                if ($convRegistered) {
                  $convCount = $selfObj.conversion_providers.count
                  if ($null -eq $convCount -or [int]$convCount -lt 1) {
                    Write-Host "::error::conversion_providers.count is '$convCount' with sim-conversion registered (#2006)."
                    $code = 1
                  } else {
                    Write-Host "PASS: conversion-provider gate - count $convCount"
                  }
                }
              }
            }

            # ADR-034 Amendment 4 (#1380): the RIG (navigation) role, hardware-free.
            # sim-input creates its scripted navigation device only behind a
            # SECOND opt-in, so the leg above leaves the rig on the qwerty floor
            # and the role ships untested. One extra invocation with the nav
            # knobs on covers the whole walk: the arbiter must hand
            # `xrt_system_roles::rig` to that device, the composed HEAD pose
            # must actually move (a role that resolves over a frozen head is the
            # regression an index-only assertion cannot see), and the 400 ms
            # scripted recenter must land the rig back on rig_initial.
            if ($code -eq 0) {
              $env:DXR_SIM_INPUT_NAV = "1"
              $env:DXR_SIM_INPUT_NAV_RECENTER_MS = "400"
              try {
                $rawRig = (& $cli selftest --json 2>$null | Out-String)
                $rigExit = $LASTEXITCODE
                $rs = $rawRig.IndexOf('{'); $re = $rawRig.LastIndexOf('}')
                if ($rigExit -ne 0 -or $rs -lt 0 -or $re -le $rs) {
                  Write-Host "::error::selftest with the sim navigation device failed (exit $rigExit) or emitted no JSON object (#1380)."
                  $code = if ($rigExit -ne 0) { $rigExit } else { 1 }
                } else {
                  $rigObj = $rawRig.Substring($rs, $re - $rs + 1) | ConvertFrom-Json
                  $rigCheck = $rigObj.checks | Where-Object { $_.name -eq "rig_role" }
                  if (-not $rigCheck -or -not $rigCheck.ok -or $rigCheck.detail -notmatch "Sim navigation") {
                    Write-Host "::error::rig-role check missing/failed/skipped with DXR_SIM_INPUT_NAV=1 (#1380). Detail: $($rigCheck.detail)"
                    $code = 1
                  } else {
                    Write-Host "PASS: rig-role gate - $($rigCheck.detail)"
                  }
                }
              } finally {
                Remove-Item Env:\DXR_SIM_INPUT_NAV -ErrorAction SilentlyContinue
                Remove-Item Env:\DXR_SIM_INPUT_NAV_RECENTER_MS -ErrorAction SilentlyContinue
              }
            }

            # Phase 3a (#387): exercise the per-display claim/resolution path.
            # `selftest` uses target_instance_no_comp, which does NOT build the
            # registry; `displays --claims` loads the plug-in(s), enumerates EDID,
            # and runs target_plugin_resolve_displays. With sim-display registered
            # it claims every enumerated monitor at FALLBACK, so every monitor must
            # resolve → claimed_count == monitor_count (trivially 0 == 0 on a
            # headless runner with no EDID monitors; non-trivial on a real panel).
            # Robust JSON extraction: drop stderr logs, slice first '{'..last '}'.
            if ($code -eq 0) {
              $raw = (& $cli displays --claims --json 2>$null | Out-String)
              $claimsCode = $LASTEXITCODE
              if ($claimsCode -ne 0) {
                Write-Host "::error::displayxr-cli displays --claims exited $claimsCode."
                $code = $claimsCode
              } else {
                $s = $raw.IndexOf('{'); $e = $raw.LastIndexOf('}')
                if ($s -lt 0 -or $e -le $s) {
                  Write-Host "::error::displays --claims emitted no JSON object. Output: $raw"
                  $code = 1
                } else {
                  $obj = $raw.Substring($s, $e - $s + 1) | ConvertFrom-Json
                  $mon = [int]$obj.monitor_count
                  $clm = [int]$obj.claimed_count
                  if ($clm -ne $mon) {
                    Write-Host "::error::displays --claims: only $clm/$mon monitor(s) resolved to a plug-in — sim-display must claim every monitor (FALLBACK). Registry resolution path regression (#387/#69)."
                    $code = 1
                  } else {
                    Write-Host "PASS: displays --claims resolved $clm/$mon monitor(s) (registry resolution path)."
                  }
                }
              }
            }
          } finally {
            reg delete $key /f | Out-Null
            reg delete $inputKey /f | Out-Null
            if ($convRegistered) { reg delete $convKey /f | Out-Null }
            foreach ($h in $allowlisted) { reg delete $allowRoot /v $h /f 2>$null | Out-Null }
            Remove-Item Env:\DXR_SIM_INPUT -ErrorAction SilentlyContinue
          }
          if ($code -ne 0) {
            Write-Host "::error::displayxr-cli headless gate failed (exit $code) — the runtime could not discover a display processor, reported invalid display info, or the per-display claim resolution was inconsistent. See the output above."
            exit $code
          }
          Write-Host "PASS: headless self-test + per-display claim resolution succeeded."

      # ADR-054 N4 — per-class conformance. The self-test above proves each
      # class's reference component is discovered and selected. This step
      # proves the loader CONTRACT around it, class by class, with the same
      # hardware-free registrations: Enabled=0 falls back (§2.5/§2.6),
      # Preferred wins (§2.6), and an ABI-major-mismatched component is
      # rejected and fallen through — never dispatched (§2.1, ADR-020 rule 3).
      # The ABI fixtures are the test-only stub modules the unit tests build
      # (tests_conversion_loader_stub_*_abi.dll), registered by path exactly as
      # a vendor plug-in would be; they live in the build tree, which the #952
      # guard refuses by design, so the documented dev override is set for
      # this step only. Rows are HKLM (the runner is admin) and are removed in
      # the finally block. Every verdict is read from `selftest --json` fields,
      # never from log text. Enabled=0-falls-back and Preferred-wins are
      # asserted for all three classes: DP `Enabled` + the per-user HKCU overlay
      # (#2049, N3b) and the input `PreferredPlugin` row (N3a verb, #2048) were
      # the last two cells to land.
      # Provenance (N4b, PR B): the gate ENFORCES by default on Windows and the
      # runner is elevated, so every unsigned binary this step registers is
      # allowlisted up front (fixtures included, so cell 4 tests the ABI gate,
      # not the provenance gate); cell 1b takes sim-display's row away to prove
      # the refusal, then the `Trust\Enforce = 0` opt-out, then re-allowlists.
      - name: Per-class conformance (ADR-054 N4)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $cli = "_package/bin/displayxr-cli.exe"
          $simDp   = (Resolve-Path "_package/bin/plugins/DisplayXR-SimDisplay.dll").Path
          $simIn   = (Resolve-Path "_package/bin/plugins/DisplayXR-SimInput.dll").Path
          $simConv = (Resolve-Path "_package/bin/plugins/DisplayXR-SimConversion.dll").Path
          $simTr   = (Resolve-Path "_package/bin/plugins/DisplayXR-SimTracking.dll").Path
          $stubDir = if (Test-Path "build/tests/Release") { "build/tests/Release" } else { "build/tests" }
          $fxDp   = (Resolve-Path "$stubDir/tests_conversion_loader_stub_dp_abi.dll").Path
          $fxIn   = (Resolve-Path "$stubDir/tests_conversion_loader_stub_input_abi.dll").Path
          $fxConv = (Resolve-Path "$stubDir/tests_conversion_loader_stub_abi.dll").Path
          $fxTr   = (Resolve-Path "$stubDir/tests_conversion_loader_stub_tracking_abi.dll").Path
          $dpRoot = "HKLM\Software\DisplayXR\DisplayProcessors"
          $inRoot = "HKLM\Software\DisplayXR\InputProviders"
          $cvRoot = "HKLM\Software\DisplayXR\ConversionProviders"
          $trRoot = "HKLM\Software\DisplayXR\TrackingProviders"

          function Reg-Row($root, $id, $bin, $order) {
            reg add "$root\$id" /v Binary /t REG_SZ /d "$bin" /f | Out-Null
            reg add "$root\$id" /v ProbeOrder /t REG_DWORD /d $order /f | Out-Null
            reg add "$root\$id" /v DisplayName /t REG_SZ /d "$id" /f | Out-Null
          }
          function Selftest-Json {
            $raw = (& $cli selftest --json 2>$null | Out-String)
            $script:lastExit = $LASTEXITCODE
            $s = $raw.IndexOf('{'); $e = $raw.LastIndexOf('}')
            if ($s -lt 0 -or $e -le $s) { throw "selftest --json emitted no JSON object (exit $script:lastExit)" }
            return ($raw.Substring($s, $e - $s + 1) | ConvertFrom-Json)
          }
          function Cli-Json([string[]]$verb) {
            $raw = (& $cli @verb --json 2>$null | Out-String)
            $s = $raw.IndexOf('{'); $e = $raw.LastIndexOf('}')
            if ($s -lt 0 -or $e -le $s) { throw "$($verb -join ' ') --json emitted no JSON object" }
            return ($raw.Substring($s, $e - $s + 1) | ConvertFrom-Json)
          }
          function Plugin($o, $id)  { $o.plugins | Where-Object { $_.id -eq $id } | Select-Object -First 1 }
          function ConvRow($o, $id) { $o.conversion_providers.providers | Where-Object { $_.id -eq $id } | Select-Object -First 1 }
          function Check($o, $name) { $o.checks | Where-Object { $_.name -eq $name } | Select-Object -First 1 }
          $script:fails = @()
          function Expect($cond, $msg) {
            if ($cond) { Write-Host "PASS: $msg" } else { Write-Host "::error::FAIL: $msg"; $script:fails += $msg }
          }

          $env:DXR_SIM_INPUT = "1"
          $env:DXR_ALLOW_DEV_PLUGIN_PATHS = "1"
          $allowRoot = "HKLM\Software\DisplayXR\Trust\Allowlist"
          $trustKey = "HKLM\Software\DisplayXR\Trust"
          $hashes = @{}
          foreach ($b in @($simDp, $simIn, $simConv, $simTr, $fxDp, $fxIn, $fxConv, $fxTr)) {
            $hashes[$b] = (Get-FileHash -Path $b -Algorithm SHA256).Hash.ToLower()
          }
          $enforceSet = $false
          try {
            foreach ($b in $hashes.Keys) { reg add $allowRoot /v $hashes[$b] /t REG_SZ /d "ci $(Split-Path $b -Leaf)" /f | Out-Null }
            Reg-Row $dpRoot "sim-display" $simDp 200
            Reg-Row $inRoot "sim-input" $simIn 200
            Reg-Row $cvRoot "sim-conversion" $simConv 250
            reg add "$cvRoot\sim-conversion\Settings" /v ENABLE /t REG_SZ /d "1" /f | Out-Null

            # 1. The reference component is selected, per class.
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "baseline: selftest exit 0 (got $lastExit)"
            Expect ((Plugin $o "sim-display").load_result -eq "ACTIVE") "DP: sim-display is ACTIVE"
            Expect ($o.input_providers.active_id -eq "sim-input") "input: sim-input is the active provider"
            Expect ((ConvRow $o "sim-conversion").load -eq "NEGOTIATED") "conversion: sim-conversion NEGOTIATED"

            # 1b. Provenance (ADR-054 N4b), ENFORCING by default since PR B. The
            # baseline above ran with every binary allowlisted. Take sim-display's
            # row away: it is unsigned and this runner is elevated (dev override
            # refused), so the gate must REFUSE it before LoadLibrary — load_result
            # UNTRUSTED, verdict unverified naming the elevation and the exact
            # allowlist row — and the self-test fails for want of a DP.
            reg delete $allowRoot /v $hashes[$simDp] /f | Out-Null
            $o = Selftest-Json
            Expect ($lastExit -ne 0) "provenance: an unsigned, unlisted DP is refused and the self-test fails (exit $lastExit)"
            $sd = Plugin $o "sim-display"
            Expect ($sd.load_result -eq "UNTRUSTED") "provenance: sim-display recorded as UNTRUSTED (got '$($sd.load_result)')"
            Expect ($sd.provenance -eq "unverified") "provenance: the refused binary reads unverified (got '$($sd.provenance)')"
            Expect ($sd.provenance_reason -match "elevated") "provenance: the dev override is refused on an elevated host ($($sd.provenance_reason))"
            Expect ($sd.provenance_reason -match $hashes[$simDp]) "provenance: the reason names the allowlist row to write"
            # The one-release escape hatch: Trust\Enforce = 0 puts the gate back in
            # audit mode — same binary, still unverified, but loaded.
            reg add $trustKey /v Enforce /t REG_DWORD /d 0 /f | Out-Null
            $enforceSet = $true
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "provenance: Enforce=0 opt-out loads it again (exit $lastExit)"
            Expect ((Plugin $o "sim-display").load_result -eq "ACTIVE") "provenance: audit mode -> sim-display ACTIVE"
            Expect ((Plugin $o "sim-display").provenance -eq "unverified") "provenance: audit mode still reports unverified"
            reg delete $trustKey /v Enforce /f | Out-Null
            $enforceSet = $false
            # Allowlist it again the way register_dev_plugin.bat / the installer do:
            # enforcing, and the same binary reads "allowlisted".
            reg add $allowRoot /v $hashes[$simDp] /t REG_SZ /d "ci sim-display" /f | Out-Null
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "provenance: selftest exit 0 after allowlisting (got $lastExit)"
            Expect ((Plugin $o "sim-display").provenance -eq "allowlisted") "provenance: allowlisted sim-display reads allowlisted"
            # Same gate, the other two classes: rows removed, sim-input is REFUSED and
            # counted apart from load failures (the verdict names the gate), and
            # sim-conversion reads UNTRUSTED. Both rows restored after.
            reg delete $allowRoot /v $hashes[$simIn] /f | Out-Null
            reg delete $allowRoot /v $hashes[$simConv] /f | Out-Null
            $o = Selftest-Json
            Expect (([int]$o.input_providers.scan_untrusted -eq 1) -and (-not $o.input_providers.active)) "provenance: unlisted sim-input is refused and counted as untrusted (untrusted=$($o.input_providers.scan_untrusted) active=$($o.input_providers.active))"
            Expect ((Check $o "input_providers").detail -match "provenance gate") "provenance: the input verdict names the gate ($((Check $o 'input_providers').detail))"
            Expect ((ConvRow $o "sim-conversion").load -eq "UNTRUSTED") "provenance: unlisted sim-conversion reads UNTRUSTED (got '$((ConvRow $o 'sim-conversion').load)')"
            reg add $allowRoot /v $hashes[$simIn] /t REG_SZ /d "ci sim-input" /f | Out-Null
            reg add $allowRoot /v $hashes[$simConv] /t REG_SZ /d "ci sim-conversion" /f | Out-Null

            # 2. Enabled=0 falls back (input, conversion, DP). The DP cell (N3b, #2049)
            # disables sim-display with a second row of the same DLL (sim-display-alt,
            # 210) left enabled: the disabled row reads DISABLED (never tried), the alt
            # row is ACTIVE, and selftest names the skipped row by registration id —
            # a disabled plug-in is the user's choice, never a failure.
            Reg-Row $dpRoot "sim-display-alt" $simDp 210
            reg add "$dpRoot\sim-display" /v Enabled /t REG_DWORD /d 0 /f | Out-Null
            reg add "$inRoot\sim-input" /v Enabled /t REG_DWORD /d 0 /f | Out-Null
            reg add "$cvRoot\sim-conversion" /v Enabled /t REG_DWORD /d 0 /f | Out-Null
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "Enabled=0: selftest still exit 0 (got $lastExit)"
            Expect (([int]$o.input_providers.enabled -eq 0) -and (-not $o.input_providers.active)) "input: Enabled=0 -> nothing loaded, qwerty keeps the hand roles"
            Expect ((Check $o "input_providers").ok) "input: the input_providers check stays ok on a disabled row"
            Expect (((ConvRow $o "sim-conversion").load -eq "DISABLED") -and ([int]$o.conversion_providers.negotiated -eq 0)) "conversion: Enabled=0 -> DISABLED, nothing negotiated"
            Expect ((Plugin $o "sim-display").load_result -eq "DISABLED") "DP: Enabled=0 (machine) -> sim-display recorded DISABLED, never tried"
            Expect ((Plugin $o "sim-display-alt").load_result -eq "ACTIVE") "DP: fell back to sim-display-alt"
            Expect ($o.display_processor.active_id -eq "sim-display-alt") "DP: display_processor.active_id names the winning ROW (got '$($o.display_processor.active_id)')"
            Expect (@($o.display_processor.skipped_disabled) -contains "sim-display") "DP: display_processor.skipped_disabled names sim-display"
            reg delete "$inRoot\sim-input" /v Enabled /f | Out-Null
            reg delete "$cvRoot\sim-conversion" /v Enabled /f | Out-Null
            reg delete "$dpRoot\sim-display" /v Enabled /f | Out-Null

            # 2b. The per-user overlay (N3b): what `dp disable` writes (HKCU, no admin)
            # wins over an enabled HKLM row, `dp list --json` reads it back as
            # enabled_source "user" and moves '*', and selftest falls back the same
            # way. An unregistered id is refused (no orphan per-user row).
            & $cli dp disable sim-display | Out-Null
            Expect ($LASTEXITCODE -eq 0) "DP: 'dp disable sim-display' exit 0 (got $LASTEXITCODE)"
            $dl = Cli-Json @("dp", "list")
            $row = $dl.plugins | Where-Object { $_.id -eq "sim-display" } | Select-Object -First 1
            Expect ((-not $row.enabled) -and ($row.enabled_source -eq "user")) "DP: dp list reads sim-display Enabled=no (user) (got enabled=$($row.enabled) source='$($row.enabled_source)')"
            Expect ((($dl.plugins | Where-Object { $_.active }).id) -eq "sim-display-alt") "DP: '*' (active) moves to sim-display-alt"
            Expect ($null -ne $row.provenance) "DP: dp list --json carries provenance (got '$($row.provenance)')"
            $o = Selftest-Json
            Expect (($lastExit -eq 0) -and ((Plugin $o "sim-display-alt").load_result -eq "ACTIVE") -and ((Plugin $o "sim-display").load_result -eq "DISABLED")) "DP: Enabled=0 (user) -> selftest falls back to sim-display-alt"
            & $cli dp enable sim-display | Out-Null
            Expect ($LASTEXITCODE -eq 0) "DP: 'dp enable sim-display' exit 0 (got $LASTEXITCODE)"
            & $cli dp disable no-such-plugin | Out-Null
            Expect ($LASTEXITCODE -ne 0) "DP: 'dp disable' of an unregistered id is refused"
            reg delete "HKCU\Software\DisplayXR\DisplayProcessors\sim-display" /f | Out-Null
            $o = Selftest-Json
            Expect (($lastExit -eq 0) -and ((Plugin $o "sim-display").load_result -eq "ACTIVE")) "DP: with the overlay removed sim-display is ACTIVE again"
            reg delete "$dpRoot\sim-display-alt" /f | Out-Null

            # 3. Preferred wins (DP: PreferredPlugin hoists a worse-ranked plug-in).
            Reg-Row $dpRoot "sim-display-alt" $simDp 210
            reg add $dpRoot /v PreferredPlugin /t REG_SZ /d "sim-display-alt" /f | Out-Null
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "Preferred: selftest exit 0 (got $lastExit)"
            Expect ((Plugin $o "sim-display-alt").load_result -eq "ACTIVE") "DP: PreferredPlugin=sim-display-alt wins over ProbeOrder"
            Expect ((Plugin $o "sim-display").load_result -eq "NOT_ATTEMPTED") "DP: the better-ranked sim-display was not even tried"
            reg delete $dpRoot /v PreferredPlugin /f | Out-Null
            reg delete "$dpRoot\sim-display-alt" /f | Out-Null

            # 3b. Preferred wins (conversion): `PreferredProvider\<task>` = sim-conversion for
            # a task where the built-in dp-lift row outranks it by ProbeOrder (150 vs 250).
            # Read from the headless `conv list --json` selection, the same pass the
            # conversion core runs; the task is picked from the data so the assertion
            # does not depend on which capabilities the sim provider happens to ship.
            function ConvList-Json {
              $raw = (& $cli conv list --json 2>$null | Out-String)
              $s = $raw.IndexOf('{'); $e = $raw.LastIndexOf('}')
              if ($s -lt 0 -or $e -le $s) { throw "conv list --json emitted no JSON object" }
              return ($raw.Substring($s, $e - $s + 1) | ConvertFrom-Json)
            }
            function ConvRowList { return ConvList-Json }
            function ConvListRow($o, $id) { $o.providers | Where-Object { $_.id -eq $id } | Select-Object -First 1 }
            $cl = ConvList-Json
            $behind = $cl.tasks | Where-Object { $_.provider -eq "sim-conversion" -and -not $_.selected } | Select-Object -First 1
            Expect ($null -ne $behind) "conversion: sim-conversion offers a task where it is ranked behind the selection (rows: $(($cl.tasks | ForEach-Object { $_.task + ':' + $_.provider + ':' + $_.selected }) -join ', '))"
            if ($null -ne $behind) {
              $convTask = $behind.task
              reg add "$cvRoot\PreferredProvider" /v $convTask /t REG_SZ /d "sim-conversion" /f | Out-Null
              $cl = ConvList-Json
              $sel = $cl.tasks | Where-Object { $_.task -eq $convTask -and $_.selected } | Select-Object -First 1
              Expect ($sel.provider -eq "sim-conversion") "conversion: PreferredProvider\$convTask=sim-conversion is selected over ProbeOrder (got '$($sel.provider)')"
              reg delete "$cvRoot\PreferredProvider" /v $convTask /f | Out-Null
            }

            # 3c. Preferred wins (input): a second row of the same DLL (sim-input-alt,
            # 210) is ranked first by `PreferredPlugin` although sim-input (200)
            # outranks it by ProbeOrder. One DLL, two rows, one iface->id — so the
            # ranked list is by REGISTRATION id, and the hand roles stay held.
            Reg-Row $inRoot "sim-input-alt" $simIn 210
            reg add $inRoot /v PreferredPlugin /t REG_SZ /d "sim-input-alt" /f | Out-Null
            $il = Cli-Json @("input", "list")
            $alt = $il.providers | Where-Object { $_.id -eq "sim-input-alt" } | Select-Object -First 1
            Expect (($il.preferred -eq "sim-input-alt") -and $alt.preferred -and $alt.active) "input: input list predicts the preferred row first"
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "input Preferred: selftest exit 0 (got $lastExit)"
            Expect ((@($o.input_providers.ranked).Count -eq 2) -and (@($o.input_providers.ranked)[0] -eq "sim-input-alt")) "input: PreferredPlugin=sim-input-alt is ranked first (ranked: $(@($o.input_providers.ranked) -join ', '))"
            Expect ($o.input_providers.active -and (Check $o "input_providers").ok) "input: the preferred row holds the hand roles"
            reg delete $inRoot /v PreferredPlugin /f | Out-Null
            reg delete "$inRoot\sim-input-alt" /f | Out-Null

            # 3e. The EmulatedControllers gate (ADR-054 N7, #2143): class policy under
            # the InputProviders root — `InputProviders\Policy\EmulatedControllers`,
            # HKCU over HKLM, HKCU hidden by Policy\Lock. 0 = the qwerty left/right
            # pair is not published (the qwerty head stays); sim-input, resident,
            # still holds the hands. Every verdict is a selftest --json field: the
            # gate's {value, source} and the device list, never log text. HKLM is
            # restored in the finally block.
            function QwertyPair($o) { @($o.input_providers.devices | Where-Object { $_.str -match '^Qwerty (Left|Right) Controller$' }).Count }
            function Gate($o) { "$($o.input_providers.emulated_controllers.value)/$($o.input_providers.emulated_controllers.source)/pair=$(QwertyPair $o)" }
            $o = Selftest-Json
            Expect (([int]$o.input_providers.emulated_controllers.value -eq 1) -and ($o.input_providers.emulated_controllers.source -eq "default") -and ((QwertyPair $o) -eq 2)) "emulated: absent reads value=1 source=default with the qwerty pair present (got $(Gate $o))"
            reg add "$inRoot\Policy" /v EmulatedControllers /t REG_DWORD /d 0 /f | Out-Null
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "emulated: selftest exit 0 with the gate off (got $lastExit)"
            Expect (([int]$o.input_providers.emulated_controllers.value -eq 0) -and ($o.input_providers.emulated_controllers.source -eq "machine") -and ((QwertyPair $o) -eq 0)) "emulated: HKLM 0 reads value=0 source=machine and no qwerty left/right in the device list (got $(Gate $o))"
            Expect (@($o.input_providers.devices | Where-Object { $_.str -eq 'Qwerty HMD' }).Count -eq 1) "emulated: the qwerty head (look-around) stays"
            Expect ($o.input_providers.active -and (Check $o "input_providers").ok) "emulated: sim-input still holds the hand roles with the gate off"
            # The per-user overlay (what `input emulated on` writes, no admin): HKCU 1
            # beats HKLM 0 — unless Policy\Lock = 1, which hides the user tier.
            reg add "HKCU\Software\DisplayXR\InputProviders\Policy" /v EmulatedControllers /t REG_DWORD /d 1 /f | Out-Null
            $o = Selftest-Json
            Expect (([int]$o.input_providers.emulated_controllers.value -eq 1) -and ($o.input_providers.emulated_controllers.source -eq "user") -and ((QwertyPair $o) -eq 2)) "emulated: HKCU 1 over HKLM 0 reads value=1 source=user, pair back (got $(Gate $o))"
            reg add "$inRoot\Policy" /v Lock /t REG_DWORD /d 1 /f | Out-Null
            $o = Selftest-Json
            Expect (([int]$o.input_providers.emulated_controllers.value -eq 0) -and ($o.input_providers.emulated_controllers.source -eq "machine") -and ((QwertyPair $o) -eq 0)) "emulated: Policy\Lock hides the per-user value (got $(Gate $o))"
            reg delete "$inRoot\Policy" /v Lock /f | Out-Null
            reg delete "HKCU\Software\DisplayXR\InputProviders\Policy" /v EmulatedControllers /f | Out-Null
            # `input list --json` carries the same {value, source}; `input emulated` is the verb that writes it.
            $il = Cli-Json @("input", "list")
            Expect (([int]$il.emulated_controllers.value -eq 0) -and ($il.emulated_controllers.source -eq "machine")) "emulated: input list --json carries {value, source} (got $($il.emulated_controllers.value)/$($il.emulated_controllers.source))"
            & $cli input emulated on --machine | Out-Null
            Expect ($LASTEXITCODE -eq 0) "emulated: 'input emulated on --machine' exit 0 (got $LASTEXITCODE)"
            $o = Selftest-Json
            Expect (([int]$o.input_providers.emulated_controllers.value -eq 1) -and ($o.input_providers.emulated_controllers.source -eq "machine") -and ((QwertyPair $o) -eq 2)) "emulated: the verb wrote 1 and the pair is back (got $(Gate $o))"
            reg delete "$inRoot\Policy" /v EmulatedControllers /f | Out-Null
            $o = Selftest-Json
            Expect (([int]$o.input_providers.emulated_controllers.value -eq 1) -and ($o.input_providers.emulated_controllers.source -eq "default") -and ((QwertyPair $o) -eq 2)) "emulated: deleted -> back to value=1 source=default with the pair present (got $(Gate $o))"

            # 3d. The one options contract (ADR-054 decision 7, N3c, #2050), on the
            # conversion class: without its ENABLE setting sim-conversion declines its
            # probe; `conv set` writes the per-user HKCU Settings\ENABLE (no admin), the
            # headless `conv list` then negotiates it and `conv options` reads the value
            # back as source=user; DXR_CONV_SIM_CONVERSION_ENABLE=0 in the environment
            # beats the store (source=environment, declined again); `conv unset` reverts.
            # The HKLM Settings\ENABLE registered above is removed for the cell and
            # restored after it, since the cells below rely on it. The DP class is
            # checked through its declaration: `dp options sim-display` lists TRACKING,
            # read from the plug-in's describe_settings through the new host slot.
            reg delete "$cvRoot\sim-conversion\Settings" /v ENABLE /f | Out-Null
            $cl = ConvRowList
            Expect ((ConvListRow $cl "sim-conversion").load -ne "NEGOTIATED") "options: without ENABLE sim-conversion is not NEGOTIATED (got '$((ConvListRow $cl "sim-conversion").load)')"
            & $cli conv set sim-conversion ENABLE 1 | Out-Null
            Expect ($LASTEXITCODE -eq 0) "options: 'conv set sim-conversion ENABLE 1' exit 0 (got $LASTEXITCODE)"
            $co = Cli-Json @("conv", "options", "sim-conversion")
            $en = $co.settings | Where-Object { $_.key -eq "ENABLE" } | Select-Object -First 1
            Expect (($null -ne $en) -and $en.declared -and ($en.value -eq "1") -and ($en.source -eq "user")) "options: conv options reads ENABLE=1 (user), declared by the provider (got value='$($en.value)' source='$($en.source)' declared=$($en.declared))"
            $cl = ConvRowList
            Expect ((ConvListRow $cl "sim-conversion").load -eq "NEGOTIATED") "options: per-user ENABLE=1 -> sim-conversion NEGOTIATED (got '$((ConvListRow $cl "sim-conversion").load)')"
            $env:DXR_CONV_SIM_CONVERSION_ENABLE = "0"
            $co = Cli-Json @("conv", "options", "sim-conversion")
            $en = $co.settings | Where-Object { $_.key -eq "ENABLE" } | Select-Object -First 1
            Expect (($en.value -eq "0") -and ($en.source -eq "environment")) "options: DXR_CONV_SIM_CONVERSION_ENABLE=0 beats the store (got value='$($en.value)' source='$($en.source)')"
            $cl = ConvRowList
            Expect ((ConvListRow $cl "sim-conversion").load -ne "NEGOTIATED") "options: with the env override sim-conversion declines again (got '$((ConvListRow $cl "sim-conversion").load)')"
            Remove-Item Env:\DXR_CONV_SIM_CONVERSION_ENABLE -ErrorAction SilentlyContinue
            & $cli conv unset sim-conversion ENABLE | Out-Null
            Expect ($LASTEXITCODE -eq 0) "options: 'conv unset sim-conversion ENABLE' exit 0 (got $LASTEXITCODE)"
            $co = Cli-Json @("conv", "options", "sim-conversion")
            $en = $co.settings | Where-Object { $_.key -eq "ENABLE" } | Select-Object -First 1
            Expect ($en.source -eq "absent") "options: after unset ENABLE is absent (got source='$($en.source)')"
            & $cli conv set no-such-provider ENABLE 1 | Out-Null
            Expect ($LASTEXITCODE -ne 0) "options: 'conv set' of an unregistered id is refused"
            reg add "$cvRoot\sim-conversion\Settings" /v ENABLE /t REG_SZ /d "1" /f | Out-Null
            $co = Cli-Json @("conv", "options", "sim-conversion")
            $en = $co.settings | Where-Object { $_.key -eq "ENABLE" } | Select-Object -First 1
            Expect (($en.value -eq "1") -and ($en.source -eq "machine")) "options: the restored HKLM Settings\ENABLE reads as source=machine (got value='$($en.value)' source='$($en.source)')"
            $do = Cli-Json @("dp", "options", "sim-display")
            $tr = $do.settings | Where-Object { $_.key -eq "TRACKING" } | Select-Object -First 1
            Expect (($null -ne $tr) -and $tr.declared -and ($tr.type -eq "bool")) "options: 'dp options sim-display' lists TRACKING from the plug-in's describe_settings (got declared=$($tr.declared) type='$($tr.type)')"
            $io = Cli-Json @("input", "options", "sim-input")
            $ie = $io.settings | Where-Object { $_.key -eq "ENABLE" } | Select-Object -First 1
            Expect (($null -ne $ie) -and $ie.declared) "options: 'input options sim-input' lists ENABLE from the provider's describe_settings"

            # 4. ABI-major mismatch, per class: rejected, never dispatched, fallen through.
            Reg-Row $dpRoot "abi-fixture-dp" $fxDp 10
            Reg-Row $inRoot "abi-fixture-input" $fxIn 10
            Reg-Row $cvRoot "abi-fixture-conv" $fxConv 10
            $o = Selftest-Json
            # The DP gate fails the self-test ON PURPOSE here: a better-ranked DP
            # that could not load is a misconfiguration (#1212) — and it must say
            # why. The other two classes fall through and stay green.
            Expect ($lastExit -ne 0) "DP: a better-ranked ABI-mismatched DP fails the self-test (exit $lastExit)"
            $vdp = Check $o "vendor_dp"
            Expect ((-not $vdp.ok) -and ($vdp.detail -match "ABI")) "DP: vendor_dp names the ABI mismatch ($($vdp.detail))"
            Expect ((Plugin $o "abi-fixture-dp").load_result -eq "ABI_MISMATCH") "DP: fixture recorded as ABI_MISMATCH"
            Expect ((Plugin $o "abi-fixture-dp").provenance -eq "allowlisted") "provenance: the fixture is allowlisted, so the ABI gate (not the provenance gate) is what rejected it"
            Expect ((Plugin $o "sim-display").load_result -eq "ACTIVE") "DP: fell through to sim-display"
            Expect (([int]$o.input_providers.scan_failed -eq 1) -and ($o.input_providers.active_id -eq "sim-input")) "input: fixture counted failed-to-load, sim-input still active"
            Expect ((Check $o "input_providers").ok) "input: the input_providers check stays ok (fall-through is not a fault)"
            Expect ((ConvRow $o "abi-fixture-conv").load -eq "ABI_MISMATCH") "conversion: fixture recorded as ABI_MISMATCH"
            Expect ((ConvRow $o "sim-conversion").load -eq "NEGOTIATED") "conversion: fell through to sim-conversion"
            Expect ((Check $o "conversion_providers").ok) "conversion: the conversion_providers check stays ok"

            # 5. The viewer-tracking class (ADR-054 N6 Part 2), the same four cells.
            # sim-tracking declines unless its ENABLE setting is on (machine row
            # here); sim-display declares EXTERNAL_OK and does not track, so the
            # selected provider IS the primary screen's viewer source.
            Reg-Row $trRoot "sim-tracking" $simTr 200
            reg add "$trRoot\sim-tracking\Settings" /v ENABLE /t REG_SZ /d "1" /f | Out-Null
            function Tr($o) { "active=$($o.tracking_providers.active_id) source=$($o.tracking_providers.viewer_source) ranked=$(@($o.tracking_providers.ranked) -join ',') failed=$($o.tracking_providers.scan_failed)" }
            $o = Selftest-Json
            Expect ($lastExit -eq 0) "tracking: selftest exit 0 with sim-tracking registered (got $lastExit)"
            Expect (($o.tracking_providers.active_id -eq "sim-tracking") -and ($o.tracking_providers.viewer_source -eq "provider:sim-tracking")) "tracking: sim-tracking selected and is the viewer source ($(Tr $o))"
            Expect ($o.tracking_providers.display_viewer_policy -eq "EXTERNAL_OK") "tracking: sim-display declares EXTERNAL_OK (got '$($o.tracking_providers.display_viewer_policy)')"
            Expect ([int]$o.tracking_providers.composed_eye_tracking_modes -eq 3) "tracking: composed advertisement MANAGED|MANUAL (got $($o.tracking_providers.composed_eye_tracking_modes))"
            # 5a. Enabled=0 falls back: no provider -> the nominal viewer, never a fault.
            reg add "$trRoot\sim-tracking" /v Enabled /t REG_DWORD /d 0 /f | Out-Null
            $o = Selftest-Json
            Expect (($lastExit -eq 0) -and ($o.tracking_providers.active_id -eq "") -and ($o.tracking_providers.viewer_source -eq "nominal")) "tracking: Enabled=0 -> nominal viewer, selftest still exit 0 ($(Tr $o))"
            reg delete "$trRoot\sim-tracking" /v Enabled /f | Out-Null
            # 5b. Preferred wins: a second row of the same DLL at 210, preferred.
            Reg-Row $trRoot "sim-tracking-alt" $simTr 210
            reg add "$trRoot\sim-tracking-alt\Settings" /v ENABLE /t REG_SZ /d "1" /f | Out-Null
            reg add $trRoot /v PreferredPlugin /t REG_SZ /d "sim-tracking-alt" /f | Out-Null
            $o = Selftest-Json
            Expect ((@($o.tracking_providers.ranked)[0] -eq "sim-tracking-alt") -and ($o.tracking_providers.viewer_source -eq "provider:sim-tracking-alt")) "tracking: PreferredPlugin=sim-tracking-alt is ranked first and serves the screen ($(Tr $o))"
            $tl = Cli-Json @("tracking", "list")
            Expect ((($tl.providers | Where-Object { $_.first }).id) -eq "sim-tracking-alt") "tracking: tracking list predicts the preferred row first"
            reg delete $trRoot /v PreferredPlugin /f | Out-Null
            reg delete "$trRoot\sim-tracking-alt" /f | Out-Null
            # 5c. ABI-major mismatch: rejected, counted failed-to-load, fallen through.
            Reg-Row $trRoot "abi-fixture-tracking" $fxTr 10
            $o = Selftest-Json
            Expect (([int]$o.tracking_providers.scan_failed -eq 1) -and ($o.tracking_providers.active_id -eq "sim-tracking")) "tracking: ABI fixture rejected, sim-tracking still selected ($(Tr $o))"
            # 5d. A display that tracks always wins: sim-display's dev TRACKING toggle.
            reg delete "$trRoot\abi-fixture-tracking" /f | Out-Null
            $env:DXR_DP_SIM_DISPLAY_TRACKING = "1"
            $o = Selftest-Json
            Expect ($o.tracking_providers.viewer_source -eq "dp") "tracking: a tracking display beats the provider ($(Tr $o))"
            Remove-Item Env:\DXR_DP_SIM_DISPLAY_TRACKING -ErrorAction SilentlyContinue
          } finally {
            foreach ($k in @("$dpRoot\sim-display", "$dpRoot\sim-display-alt", "$dpRoot\abi-fixture-dp",
                             "$inRoot\sim-input", "$inRoot\sim-input-alt", "$inRoot\abi-fixture-input",
                             "$cvRoot\sim-conversion", "$cvRoot\abi-fixture-conv",
                             "HKCU\Software\DisplayXR\DisplayProcessors\sim-display",
                             "HKCU\Software\DisplayXR\ConversionProviders\sim-conversion",
                             "$inRoot\Policy", "HKCU\Software\DisplayXR\InputProviders\Policy",
                             "$trRoot\sim-tracking", "$trRoot\sim-tracking-alt", "$trRoot\abi-fixture-tracking")) {
              reg delete $k /f 2>$null | Out-Null
            }
            reg delete $dpRoot /v PreferredPlugin /f 2>$null | Out-Null
            reg delete $inRoot /v PreferredPlugin /f 2>$null | Out-Null
            reg delete $trRoot /v PreferredPlugin /f 2>$null | Out-Null
            Remove-Item Env:\DXR_DP_SIM_DISPLAY_TRACKING -ErrorAction SilentlyContinue
            foreach ($b in $hashes.Keys) { reg delete $allowRoot /v $hashes[$b] /f 2>$null | Out-Null }
            if ($enforceSet) { reg delete $trustKey /v Enforce /f 2>$null | Out-Null }
            reg delete "$cvRoot\PreferredProvider" /f 2>$null | Out-Null
            Remove-Item Env:\DXR_SIM_INPUT -ErrorAction SilentlyContinue
            Remove-Item Env:\DXR_ALLOW_DEV_PLUGIN_PATHS -ErrorAction SilentlyContinue
          }
          if ($script:fails.Count -gt 0) {
            Write-Host "::error::per-class conformance (ADR-054 N4): $($script:fails.Count) assertion(s) failed — see FAIL lines above."
            exit 1
          }
          Write-Host "PASS: per-class conformance (ADR-054 N4) — selected / Enabled=0 falls back / Preferred wins / EmulatedControllers gate / ABI mismatch rejected and fallen through."
          # Explicit: the pwsh step otherwise exits with the LAST native command's
          # code, and the finally block's best-effort `reg delete` of an
          # already-removed value legitimately returns 1.
          exit 0

      # The DisplayXR Dashboard (src/dashboard, Avalonia/.NET) is published into
      # _package/bin before the installer is packed, so the installer ships it.
      # Soft: a dashboard failure must not block the runtime installer (the
      # Dashboard job below is where it fails loudly).
      - name: Setup .NET (dashboard)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish DisplayXR Dashboard into the package
        if: needs.DetectChanges.outputs.docs_only != 'true'
        continue-on-error: true
        shell: pwsh
        run: >-
          dotnet publish src/dashboard/DisplayXR.Dashboard/DisplayXR.Dashboard.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false -p:EnableCompressionInSingleFile=true
          -o _package/bin --nologo

      - name: Build Installer
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build build --config Release --target installer

      # #1790: the runtime reports the checkout's version and the installer is
      # named after it -- exactly the tag on a v* push (what /release uploads
      # over), the last release + describe suffix on anything else. Checked from
      # the artifacts (displayxr-cli info prints the runtimeVersion number and
      # the runtimeName tag), against an expectation re-derived from git.
      - name: Runtime + installer carry the checkout's version (#1790)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        shell: bash
        run: |
          shopt -s nullglob
          exes=(_package/DisplayXRSetup-*.exe)
          [ "${#exes[@]}" -eq 1 ] || { echo "::error::expected exactly one installer, found: ${exes[*]:-none}"; exit 1; }
          ./scripts/check_runtime_version.sh --build-dir build \
            --cli _package/bin/displayxr-cli.exe \
            --binary _package/bin/DisplayXRClient.dll \
            --package "${exes[0]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: needs.DetectChanges.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        id: artifact-upload-step
        with:
          retention-days: 3
          name: DisplayXR
          if-no-files-found: error
          path: _package

      - name: Upload installer
        uses: actions/upload-artifact@v6
        if: needs.DetectChanges.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        id: installer-upload-step
        with:
          retention-days: 3
          name: DisplayXR-Installer
          if-no-files-found: error
          path: _package/DisplayXRSetup-*.exe

      # Attach the Windows installer to the v* GitHub release (#290).
      # First workflow to complete on the tag creates the release; the
      # macOS BuildInstaller appends its .pkg. Filename is
      # DisplayXRSetup-X.Y.Z.exe from the NSI's OutFile — version only, NO
      # build number, so the signed installer the release skill uploads has
      # the SAME name as CI's and --clobber replaces it in place. Stamping
      # the run number here would make the two names differ, and the release
      # would ship a signed AND an unsigned installer side by side.
      - name: Attach Windows installer to GitHub release on tag
        if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: _package/DisplayXRSetup-*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # No OneDrive upload: reviewers use the upload-artifact steps above; release
      # assets attach to the GitHub Release on tag (the single distribution point).

  # The DisplayXR Dashboard (src/dashboard): an Avalonia / .NET renderer over
  # displayxr-cli (ADR-051 D4). Tests + a self-contained single-file publish,
  # uploaded as an artifact. Not a required check; doc-only PRs skip the work.
  Dashboard:
    needs: DetectChanges
    runs-on: windows-2022
    steps:
      - name: Doc-only PR — skipping the dashboard build
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "DetectChanges flagged docs_only=true; nothing to build."

      - name: Checkout repository
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/checkout@v5

      - name: Setup .NET
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: dotnet test src/dashboard/DisplayXR.Dashboard.sln -c Release --nologo

      - name: Publish displayxr-dashboard.exe
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: >-
          dotnet publish src/dashboard/DisplayXR.Dashboard/DisplayXR.Dashboard.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishTrimmed=false -p:EnableCompressionInSingleFile=true
          -o dashboard-out --nologo

      - name: Upload dashboard
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          retention-days: 7
          name: DisplayXR-Dashboard
          if-no-files-found: error
          path: dashboard-out/displayxr-dashboard.exe

  # All Windows test apps, built in one shot through the globbing aggregator
  # (test_apps/CMakeLists.txt discovers every <class>/<app>/CMakeLists.txt and
  # gates on the dir-name suffix). This replaced ~15 hand-maintained per-app jobs
  # whose paths silently drifted from disk (#692) — a new app is now picked up
  # automatically, so it can never be CI-orphaned.
  TestApps:
    if: needs.DetectChanges.outputs.test_apps_changed == 'true'
    runs-on: windows-2022
    needs: [Runtime, DetectChanges]

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # No Vulkan SDK download. The vk test apps (cube_handle_vk_win /
      # cube_zones_vk_win) find_package(Vulkan) -> Vulkan::Vulkan from vcpkg's
      # vulkan-loader + vulkan-headers (test_apps/vcpkg.json); they embed
      # pre-built SPIR-V so no glslangValidator is needed. Every other app uses
      # system SDKs. Avoids the aging LunarG URL that 404s on a cold cache.
      - name: Restore from cache and setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '5d90b0d5d0317336e65662f2bf0d671b0902c632'
          vcpkgJsonGlob: 'test_apps/vcpkg.json'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install OpenXR loader
        run: |
          $openxrVersion = "1.1.63"
          $openxrUrl = "https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-$openxrVersion/openxr_loader_windows-$openxrVersion.zip"
          Invoke-WebRequest -Uri $openxrUrl -OutFile openxr_loader.zip
          Expand-Archive -Path openxr_loader.zip -DestinationPath openxr_sdk -Force

      - name: Build all test apps (aggregate)
        run: |
          cmake -S test_apps -B test_apps/build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DOpenXR_ROOT="${{ github.workspace }}/openxr_sdk"
          cmake --build test_apps/build

      - name: Copy OpenXR loader beside the exes
        run: |
          $loaderDll = Get-ChildItem -Path openxr_sdk -Recurse -Filter "openxr_loader.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $loaderDll) { $loaderDll = Get-ChildItem -Path openxr_sdk -Recurse -Filter "openxr_loader.dll" | Select-Object -First 1 }
          if ($loaderDll) { Copy-Item $loaderDll.FullName -Destination test_apps/build/bin/ }

      - name: Verify built apps
        run: |
          $bin = "test_apps/build/bin"
          $exes = Get-ChildItem "$bin/*.exe"
          Write-Host "=== $($exes.Count) test-app exe(s) built ==="
          $exes | ForEach-Object { Write-Host "  $($_.Name)" }
          if ($exes.Count -lt 20) { throw "Expected >=20 Windows test apps, got $($exes.Count)" }
          # Spot-check one binary's architecture + deps.
          $exe = "$bin/cube_handle_d3d11_win.exe"
          dumpbin /headers $exe | Select-String -Pattern "machine \(|File Type:"
          dumpbin /dependents $exe

  # On a v* tag push, after Runtime proves the build works end-to-end,
  # observe the new tag in versions.json so the dev orchestrator
  # (scripts/setup-displayxr.{sh,bat}) starts installing this release.
  # Sibling repos use .github/workflows/versions-bump.yml
  # via repository_dispatch for their fields; this job is the runtime's
  # own field-self-bump. See docs/specs/runtime/versions-json-autobump.md.
  #
  # The ABI gate prevents shipping a runtime that breaks the currently-
  # pinned leia_plugin (same class of incident as v1.5.2 vs leia v1.0.5
  # → ADR-020). If ABIs mismatch, we skip the runtime bump and open a
  # tracking issue in the leia repo — the next compatible leia tag will
  # come in via versions-bump.yml and clear the path.
  BumpVersionsJsonOnTag:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'DisplayXR/displayxr-runtime' }}
    needs: [Runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DISPLAYXR_APP_ID }}
          private-key: ${{ secrets.DISPLAYXR_APP_PRIVATE_KEY }}
          owner: DisplayXR
          repositories: |
            displayxr-runtime
            displayxr-installer
            displayxr-leia-plugin
            displayxr-website

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Read current leia_plugin pin
        id: leia
        run: |
          PIN=$(python3 -c 'import json; print(json.load(open("versions.json"))["leia_plugin"])')
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"

      - name: ABI assertion against currently-pinned leia_plugin
        id: abi
        run: |
          set +e
          python3 scripts/check_plugin_abi.py --leia-tag "${{ steps.leia.outputs.pin }}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Open ABI-mismatch issue on leia repo
        if: steps.abi.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TITLE="ABI mismatch: leia ${{ steps.leia.outputs.pin }} cannot load runtime ${{ github.ref_name }}"
          BODY=$(cat <<EOF
          Auto-opened by [\`build-windows.yml\`](https://github.com/DisplayXR/displayxr-runtime/actions/runs/${{ github.run_id }}) when runtime tagged \`${{ github.ref_name }}\`.

          The new runtime's \`XRT_PLUGIN_API_VERSION_CURRENT\` (in \`src/xrt/include/xrt/xrt_plugin.h\`) does not match the ABI version the currently-pinned leia plug-in (\`${{ steps.leia.outputs.pin }}\`) was built against.

          The loader would reject this combination at \`xrCreateInstance\` (ADR-020 rule 3), so the runtime's \`versions.json[runtime]\` was **not** bumped. Dev-orchestrator users stay on the previous known-good bundle.

          **To unblock:** rebuild the leia plug-in against runtime \`${{ github.ref_name }}\` (bump \`DXR_RUNTIME_GIT_TAG\` in this repo's \`CMakeLists.txt\`), tag a new release. The leia release's \`versions-bump\` dispatch will then bump leia first; the next runtime tag (or a manual workflow_dispatch on \`versions-bump.yml\` with \`field=runtime\`) will catch up the runtime field.
          EOF
          )
          # Surface the by-design skip BEFORE any fallible gh call so the
          # annotation always lands even if issue/label plumbing fails (#453).
          echo "::warning::Skipped versions.json[runtime] bump — ABI mismatch; opening tracking issue in displayxr-leia-plugin."

          # Ensure the labels exist (idempotent; --force updates in place).
          # Best-effort: label problems must never fail the gate (#453 —
          # 'abi-mismatch' missing on the target repo hard-failed the
          # v1.13.0 run AFTER the issue was already created).
          gh label create abi-mismatch --repo DisplayXR/displayxr-leia-plugin \
            --description "Plug-in ABI does not match the runtime's XRT_PLUGIN_API_VERSION_CURRENT" \
            --color B60205 --force || true
          gh label create automated --repo DisplayXR/displayxr-leia-plugin \
            --description "Opened by a DisplayXR workflow" \
            --color 0E8A16 --force || true

          EXISTING=$(gh issue list --repo DisplayXR/displayxr-leia-plugin \
                       --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo DisplayXR/displayxr-leia-plugin --body "$BODY"
          else
            # Create WITHOUT --label (gh creates the issue and only then
            # attaches labels, so a label failure used to abort the job with
            # the issue already open — #453). Attach labels best-effort after.
            NEW_URL=$(gh issue create --repo DisplayXR/displayxr-leia-plugin \
              --title "$TITLE" --body "$BODY")
            gh issue edit "$NEW_URL" --repo DisplayXR/displayxr-leia-plugin \
              --add-label "abi-mismatch" --add-label "automated" || true
          fi

      - name: Bump versions.json[runtime]
        if: steps.abi.outputs.rc == '0'
        run: |
          python3 - <<'PY'
          import os, re, sys
          path = "versions.json"
          tag  = os.environ["GITHUB_REF_NAME"]
          text = open(path).read()
          # Regex-on-value rewrite preserves the file's existing column
          # alignment / whitespace so the bot's commits don't churn the diff
          # (see versions-bump.yml for the matching rationale).
          pat = re.compile(r'(?m)^(\s*"runtime":\s*")[^"]*(")')
          hits = pat.findall(text)
          if len(hits) != 1:
              sys.exit(f"expected 1 'runtime' occurrence in versions.json, found {len(hits)}")
          new_text = pat.sub(lambda m: m.group(1) + tag + m.group(2), text, count=1)
          if new_text == text:
              print(f"versions.json[runtime] already == {tag}; nothing to do")
              open(".bump-noop", "w").close()
          else:
              print(f"versions.json[runtime] → {tag}")
              open(path, "w").write(new_text)
          PY

      - name: Commit and push
        if: steps.abi.outputs.rc == '0' && hashFiles('.bump-noop') == ''
        run: |
          git config user.name  "displayxr-publish-bot[bot]"
          git config user.email "displayxr-publish-bot@users.noreply.github.com"
          git add versions.json
          git commit -m "chore(versions): bump runtime → ${GITHUB_REF_NAME}

          Auto-bumped by build-windows.yml on tag push.
          [skip ci]"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)

      # Mirror versions.json to displayxr-installer so the meta-installer
      # bundle composition tracks the runtime self-bump. Schema is identical
      # (see versions-bump.yml's mirror step for rationale). Shared, idempotent
      # implementation in scripts/mirror_versions_json.sh — one copy for this
      # path, versions-bump.yml, and versions-mirror.yml.
      - name: Mirror versions.json to displayxr-installer
        if: steps.abi.outputs.rc == '0' && hashFiles('.bump-noop') == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/mirror_versions_json.sh \
            "chore(versions): mirror runtime → ${GITHUB_REF_NAME} from displayxr-runtime" \
            "Auto-synced from displayxr-runtime/versions.json by build-windows.yml on tag push.
          [skip ci]"

      # Nudge the project website to re-pull org data after a runtime release,
      # mirroring the same step in versions-bump.yml. Non-fatal — a website
      # hiccup must never fail the runtime's self-bump. See docs/org-sync.md
      # in displayxr-website.
      - name: Notify website to resync
        if: steps.abi.outputs.rc == '0' && hashFiles('.bump-noop') == ''
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: DisplayXR/displayxr-website
          event-type: org-changed
          client-payload: |
            {
              "field":       "runtime",
              "tag":         "${{ github.ref_name }}",
              "source_repo": "DisplayXR/displayxr-runtime"
            }
