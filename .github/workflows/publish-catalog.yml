name: Publish component catalog

# Builds, signs and publishes the DisplayXR component catalog (#2703, epic #2702):
#   https://updates.displayxr.org/catalog/v1/stable.json (+ .sig)
# the signed index dxr-get reads to fetch the runtime / Leia plug-in / browser
# on demand. Spec: docs/specs/runtime/component-catalog.md.
#
# Where it lands. updates.displayxr.org is GitHub Pages for DisplayXR/displayxr-browser,
# deployed by that repo's pages.yml, which publishes the `feed/` directory as the
# site root (feed/feed.json -> /feed.json). So the catalog is committed to
# `feed/catalog/v1/` there. The commit deliberately does NOT carry [skip ci]: the
# Pages deploy is a push-triggered workflow in that repo, and [skip ci] would
# suppress it, leaving the committed catalog unpublished.
#
# Triggers:
#   - push to main touching versions.json (a pin edited by hand in a PR);
#   - workflow_run after "Bump versions.json" — sibling bumps commit with [skip ci],
#     which creates no push run, so the push trigger alone would miss them;
#   - workflow_dispatch — also sent by build-windows.yml's BumpVersionsJsonOnTag after
#     the runtime's own versions.json bump (a bot push with [skip ci], which neither
#     trigger above sees), by /release after it swaps in the signed installer, and by
#     this workflow's `recheck` job (below);
#   - weekly schedule — re-signs before the 30-day expiry.
#
# A pin whose asset is not (yet) Authenticode-signed by an allowed signer is not
# listed; the generator then carries forward the previously published, verified
# windows block for that component (--previous), so a release in mid-signing never
# makes a component unfetchable. The bump usually lands minutes BEFORE the signed
# asset replaces the unsigned CI one (#2758), so while any pin is not listed
# (`gen_catalog.py pending`), the `recheck` job waits RECHECK_MINUTES and dispatches
# this workflow again, at most RECHECK_MAX times in a row (`attempt` counts them).
#
# Windows runner: the Authenticode check is Get-AuthenticodeSignature.
#
# Schema 2 (ADR-064, catalog/v2/stable.json) is OFF by default. It is generated,
# signed with the same key and published next to schema 1 only when the
# repository variable DXR_PUBLISH_CATALOG_V2 is "true", or a manual run ticks
# `publish_v2`. Merging this file therefore publishes nothing new.
#
# Schema 1 never depends on schema 2:
#   - schema 2 is derived in the SAME generator run (same serial, same assets),
#     and asking for it does not change one byte of the schema-1 document
#     (pinned by scripts/tests/test_gen_catalog.py);
#   - if that run fails, the step falls back to the unchanged schema-1-only
#     command, so a schema-2 defect cannot stop the schema-1 publish;
#   - the schema-2 check is `continue-on-error`, and the commit step copies the
#     v2 files only when that check passed. Otherwise the previously published
#     v2 document (if any) stays as it is until a later run replaces it.

on:
  push:
    branches: [main]
    paths:
      - versions.json
      - scripts/gen_catalog.py
      - .github/workflows/publish-catalog.yml
  workflow_run:
    workflows: ["Bump versions.json"]
    types: [completed]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      publish_v2:
        description: 'Also generate, sign and publish catalog/v2/stable.json (schema 2, ADR-064)'
        type: boolean
        default: false
      attempt:
        description: 'Re-check number after a pin that was not listed yet (set by the recheck job; leave 0)'
        type: string
        default: '0'

permissions:
  contents: read

env:
  # "true" turns the schema-2 publish on. See the header.
  PUBLISH_V2: ${{ vars.DXR_PUBLISH_CATALOG_V2 == 'true' || inputs.publish_v2 == true }}
  # A signed asset normally replaces the CI one within minutes of the bump; these
  # cover a signing run that waits for the runner for up to about two hours.
  RECHECK_MINUTES: 15
  RECHECK_MAX: 8

jobs:
  publish:
    if: >-
      github.repository == 'DisplayXR/displayxr-runtime' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: windows-latest
    # On the job, not the workflow, so a recheck waiting out its delay never holds
    # the group. Never cancel mid-publish; queue. A later run regenerates from
    # current main anyway.
    concurrency:
      group: publish-catalog
      cancel-in-progress: false
    outputs:
      pending: ${{ steps.pending.outputs.names }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DISPLAYXR_APP_ID }}
          private-key: ${{ secrets.DISPLAYXR_APP_PRIVATE_KEY }}
          owner: DisplayXR
          # displayxr-browser: the Pages repo written to.
          # displayxr-browser-pvt: read-only use — the browser installer's declared
          # MIN_RUNTIME_VERSION (requires.runtime) lives in the private source repo.
          # displayxr-shell-pvt: read-only use — the Shell installer's declared
          # runtime floor (schema 2). Without it the read is a 404 and the Shell
          # item is not listed.
          repositories: |
            displayxr-browser
            displayxr-browser-pvt
            displayxr-shell-pvt

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          # Current tip, so concurrent runs converge on the same pins.
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: python -m pip install --quiet cryptography

      - name: Generate + sign catalog
        id: generate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DXR_CATALOG_ED25519_KEY: ${{ secrets.DXR_CATALOG_ED25519_KEY }}
        run: |
          set -euo pipefail
          # The schema-1 command, unchanged; "$@" adds --out-v2 when schema 2 is on.
          generate() {
            python scripts/gen_catalog.py generate \
              --out out \
              --download-dir "$RUNNER_TEMP/catalog-dl" \
              --previous https://updates.displayxr.org/catalog/v1/stable.json "$@"
          }
          v2_generated=false
          if [ "$PUBLISH_V2" = "true" ]; then
            if generate --out-v2 out-v2; then
              v2_generated=true
            else
              # Whatever broke, schema 1 must not depend on it: start over with
              # the schema-1-only command. If THAT fails, the job fails as before.
              echo "::warning::schema-2 catalog generation failed; publishing schema 1 alone"
              rm -rf out out-v2
              generate
            fi
          else
            generate
          fi
          echo "v2_generated=$v2_generated" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        run: |
          python scripts/gen_catalog.py verify out/stable.json
          echo '### Catalog' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;c=json.load(open('out/stable.json'));print(json.dumps({k:{'recommended':v['recommended'],'windows':v.get('windows',{}).get('version'),'requires':v.get('requires')} for k,v in c['components'].items()},indent=1))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Pins not listed yet
        id: pending
        run: |
          set -euo pipefail
          names=$(python scripts/gen_catalog.py pending out/stable.json | tr -d '\r' | paste -sd' ' -)
          echo "names=$names" >> "$GITHUB_OUTPUT"
          if [ -n "$names" ]; then
            echo "::notice::not listed at their pin yet (unsigned or missing asset): $names"
          fi

      - name: Verify schema-2 catalog
        id: v2
        if: steps.generate.outputs.v2_generated == 'true'
        # Never fails the job: a schema-2 document that does not check out is
        # simply not published, and schema 1 goes out as always.
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/gen_catalog.py verify out-v2/stable.json
          # Same run, same serial (spec: component-catalog.md, Compatibility with schema 1).
          python -c "import json,sys;a=json.load(open('out/stable.json'));b=json.load(open('out-v2/stable.json'));sys.exit(0 if b.get('schema')==2 and a['serial']==b['serial'] and a['expires']==b['expires'] else 'schema-2 document does not match the schema-1 run')"
          echo '### Catalog, schema 2' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;c=json.load(open('out-v2/stable.json'));print(json.dumps([{'id':i['id'],'class':i['class'],'version':i['version'],'windows':i.get('assets',{}).get('windows-x64',{}).get('version')} for i in c['items']],indent=1))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Commit to displayxr-browser (Pages)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          V2_READY: ${{ steps.v2.outputs.ok }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short=9 HEAD)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/DisplayXR/displayxr-browser.git" pages
          mkdir -p pages/feed/catalog/v1
          cp out/stable.json out/stable.json.sig pages/feed/catalog/v1/
          if [ "${V2_READY:-}" = "true" ]; then
            mkdir -p pages/feed/catalog/v2
            cp out-v2/stable.json out-v2/stable.json.sig pages/feed/catalog/v2/
          fi
          cd pages
          # Byte-exact: the signature covers these bytes, so no EOL conversion.
          git config core.autocrlf false
          git config user.name  "displayxr-publish-bot[bot]"
          git config user.email "displayxr-publish-bot@users.noreply.github.com"
          git add feed/catalog/v1/stable.json feed/catalog/v1/stable.json.sig
          if [ "${V2_READY:-}" = "true" ]; then
            git add feed/catalog/v2/stable.json feed/catalog/v2/stable.json.sig
          fi
          if git diff --cached --quiet; then
            echo "catalog unchanged"; exit 0
          fi
          git commit -m "chore(catalog): publish component catalog from displayxr-runtime@${SHA}" \
                     -m "Generated by displayxr-runtime publish-catalog.yml (${GITHUB_EVENT_NAME}). Spec: displayxr-runtime/docs/specs/runtime/component-catalog.md."
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  # A pin that was not listable (#2758): look again later, after the signing flow has
  # had time to replace the unsigned CI asset. Runs on ubuntu outside the publish
  # group; only the dispatched run publishes. Skipped once nothing is pending.
  recheck:
    needs: publish
    if: needs.publish.outputs.pending != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wait, then dispatch this workflow again
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '0' }}
          PENDING: ${{ needs.publish.outputs.pending }}
          V2_INPUT: ${{ inputs.publish_v2 == true }}
        run: |
          set -euo pipefail
          case "$ATTEMPT" in ''|*[!0-9]*) ATTEMPT=0 ;; esac
          if [ "$ATTEMPT" -ge "$RECHECK_MAX" ]; then
            echo "::warning::still not listed after $ATTEMPT re-checks: $PENDING. The weekly run, or a manual dispatch once the signed asset is up, picks it up."
            exit 0
          fi
          sleep $((RECHECK_MINUTES * 60))
          gh workflow run publish-catalog.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f attempt=$((ATTEMPT + 1)) -f publish_v2="$V2_INPUT"
          echo "dispatched re-check $((ATTEMPT + 1))/$RECHECK_MAX for: $PENDING"
