name: Bump versions.json

# Receives repository_dispatch events from sibling repos when they ship a
# new release. The sender (shell-pvt, leia-plugin, mcp, demo-*) calls
# this workflow with `event_type=versions-bump` and a client_payload of:
#
#   {
#     "field":       "shell" | "leia_plugin" | "conversion_open" | "leia_conversion" |
#                    "ultraleap" | "tracking_open" | "mcp_tools" | "browser" | "<name>_demo",
#     "tag":         "v1.2.3"   (the browser field also still accepts the
#                                retiring "preview-0.1.16" shape)
#     "source_repo": "DisplayXR/displayxr-<repo>"
#   }
#
# This workflow:
#   1. Reads versions.json from main.
#   2. For leia_plugin only: runs scripts/check_plugin_abi.py first. If
#      the sibling's ABI doesn't match the runtime's, the bump is skipped
#      and a tracking issue is opened in displayxr-leia-plugin asking for
#      a rebuild. For leia_conversion, ultraleap and tracking_open: the same
#      check against the ABI(s) those providers negotiate (conversion / input /
#      viewer-tracking AND input, the last read from the provider's vendored
#      headers at the tag); a mismatch fails this run red and bumps nothing.
#      Other fields skip the ABI gate.
#   3. Writes the new tag into versions.json (scripts/apply_versions_bump.py).
#      A field that is not in the file is refused, except a component that
#      has no release yet (FIRST_RELEASE_FIELDS in that script; ultraleap and
#      tracking_open today): its first release's dispatch ADDS the field. See versions-json-autobump.md,
#      "A component with no release yet".
#   4. Direct-commits to main via the displayxr-publish-bot GitHub App.
#
# Why direct commit (not PR): "released = tested" is the working
# contract — a tagged sibling release is treated as compat-validated.
# The ABI gate above is the one structural exception that component CI
# provably can't check (see ADR-020 + the v1.0.5 vs v1.5.2 incident).
#
# Manual override / re-run: `workflow_dispatch` accepts the same inputs
# so you can bump fields by hand without a sibling release event.

on:
  repository_dispatch:
    types: [versions-bump]
  workflow_dispatch:
    inputs:
      field:
        description: 'versions.json field (e.g. shell, leia_plugin, mcp_tools, demos.gaussiansplat)'
        required: true
      tag:
        description: 'Tag to pin (e.g. v1.2.3)'
        required: true
      source_repo:
        description: 'Source repo (e.g. DisplayXR/displayxr-shell-pvt)'
        required: false
        default: 'manual-dispatch'

permissions:
  contents: read

concurrency:
  # Serialize bumps so two siblings racing the same minute don't
  # clobber each other on versions.json.
  group: versions-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'DisplayXR/displayxr-runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FIELD="${{ github.event.client_payload.field }}"
            TAG="${{ github.event.client_payload.tag }}"
            SRC="${{ github.event.client_payload.source_repo }}"
          else
            FIELD="${{ inputs.field }}"
            TAG="${{ inputs.tag }}"
            SRC="${{ inputs.source_repo }}"
          fi
          if [ -z "$FIELD" ] || [ -z "$TAG" ]; then
            echo "::error::field and tag are required (got field='$FIELD' tag='$TAG')"
            exit 1
          fi
          # Tag shape is per-field. Every component ships `vX.Y.Z`; the browser
          # is validated separately only because it is the ONE component whose
          # tags ever carried a non-`v` prefix (`preview-X.Y.Z`) — and that
          # channel is retiring (browser-pvt#120, David 2026-09-11: vX.Y.Z from
          # v1.0.0). Nothing downstream parses the prefix: the pin is passed to
          # `gh release download` verbatim, and the only consumer of the update
          # feed (the start page's version-check) compares the Chromium build
          # and ignores the channel entirely. So the browser case accepts BOTH
          # shapes for the duration of the transition — `preview-*` so the
          # existing history and any in-flight preview release keep bumping,
          # `vX.Y.Z` so the v1.0.0 cut-over needs no second edit here. Drop the
          # `preview-` alternative once no preview release can still dispatch.
          case "$FIELD" in
            # preview-* takes 3 or 4 parts: the channel ended on preview-0.1.x,
            # but the early builds were Chromium-versioned
            # (preview-150.0.7871.129). vX.Y.Z is exactly 3, as everywhere else.
            browser) TAG_RE='^(preview-[0-9]+(\.[0-9]+){2,3}|v[0-9]+\.[0-9]+\.[0-9]+)$'
                     TAG_SHAPE='vX.Y.Z (preview-X.Y.Z accepted during the channel transition)' ;;
            *)       TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'        ; TAG_SHAPE='vX.Y.Z' ;;
          esac
          if [[ ! "$TAG" =~ $TAG_RE ]]; then
            echo "::error::tag '$TAG' is not $TAG_SHAPE (required for field '$FIELD')"
            exit 1
          fi
          echo "field=$FIELD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "src=$SRC"     >> "$GITHUB_OUTPUT"

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DISPLAYXR_APP_ID }}
          private-key: ${{ secrets.DISPLAYXR_APP_PRIVATE_KEY }}
          owner: DisplayXR
          # Bumping versions.json here + mirror there; issue-opening on
          # ABI fail in leia repo; org-changed dispatch to the website.
          repositories: |
            displayxr-runtime
            displayxr-installer
            displayxr-leia-plugin
            displayxr-website

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: ABI assertion (leia_plugin only)
        id: abi
        if: steps.inputs.outputs.field == 'leia_plugin'
        run: |
          set +e
          python3 scripts/check_plugin_abi.py --leia-tag "${{ steps.inputs.outputs.tag }}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # rc 2 (or anything but 0/1) = the gate could not run (network, a
      # missing tag): not a mismatch. Fail the job loudly and open NO issue —
      # a false ABI-mismatch issue plus a green, silently skipped bump is
      # worse than a red run someone re-runs (#2610).
      - name: ABI gate could not run
        if: steps.inputs.outputs.field == 'leia_plugin' && steps.abi.outputs.rc != '0' && steps.abi.outputs.rc != '1'
        run: |
          echo "::error::check_plugin_abi.py could not run (rc=${{ steps.abi.outputs.rc }}): versions.json was NOT bumped and no ABI-mismatch issue was opened. See the step log above; re-run this workflow once the cause is fixed."
          exit 1

      - name: Open ABI-mismatch issue on leia repo
        if: steps.inputs.outputs.field == 'leia_plugin' && steps.abi.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TITLE="ABI mismatch: leia ${{ steps.inputs.outputs.tag }} cannot load current runtime"
          BODY=$(cat <<EOF
          Auto-opened by [\`versions-bump.yml\`](https://github.com/DisplayXR/displayxr-runtime/actions/runs/${{ github.run_id }}) when ${{ steps.inputs.outputs.src }} fired a \`versions-bump\` event for tag \`${{ steps.inputs.outputs.tag }}\`.

          The runtime's \`XRT_PLUGIN_API_VERSION_CURRENT\` (in \`src/xrt/include/xrt/xrt_plugin.h\` on \`displayxr-runtime@main\`) does not match the ABI version the leia plug-in at this tag was built against (\`DXR_RUNTIME_GIT_TAG\` in this repo's \`CMakeLists.txt\`).

          The loader would reject this combination at \`xrCreateInstance\` (ADR-020 rule 3), so the runtime's \`versions.json\` was **not** bumped. Dev-orchestrator users stay on the previous known-good bundle.

          **To unblock:** rebuild against the current runtime headers (bump \`DXR_RUNTIME_GIT_TAG\` in \`CMakeLists.txt\` to the current runtime \`versions.json[runtime]\`), tag a new release. The next tag's auto-dispatch will retry the bump.
          EOF
          )
          # Surface the by-design skip BEFORE any fallible gh call so the
          # annotation always lands even if issue/label plumbing fails (#453).
          echo "::warning::Skipped versions.json bump — ABI mismatch; opening tracking issue in displayxr-leia-plugin."

          # Ensure the labels exist (idempotent; --force updates in place).
          # Best-effort: label problems must never fail the gate (#453).
          gh label create abi-mismatch --repo DisplayXR/displayxr-leia-plugin \
            --description "Plug-in ABI does not match the runtime's XRT_PLUGIN_API_VERSION_CURRENT" \
            --color B60205 --force || true
          gh label create automated --repo DisplayXR/displayxr-leia-plugin \
            --description "Opened by a DisplayXR workflow" \
            --color 0E8A16 --force || true

          # If an open issue with this title already exists, comment instead of duplicating.
          EXISTING=$(gh issue list --repo DisplayXR/displayxr-leia-plugin \
                       --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo DisplayXR/displayxr-leia-plugin --body "$BODY"
          else
            # Create WITHOUT --label (gh creates the issue and only then
            # attaches labels, so a label failure used to abort the job with
            # the issue already open — #453). Attach labels best-effort after.
            NEW_URL=$(gh issue create --repo DisplayXR/displayxr-leia-plugin \
              --title "$TITLE" --body "$BODY")
            gh issue edit "$NEW_URL" --repo DisplayXR/displayxr-leia-plugin \
              --add-label "abi-mismatch" --add-label "automated" || true
          fi
          exit 0

      # Providers that ship from their own repo and negotiate a plug-in ABI other
      # than the display one (ADR-053 conversion, ADR-034 input, ADR-054 N6
      # viewer tracking; tracking_open negotiates two and both must match). Same question
      # as the leia_plugin gate, asked of that ABI. Any non-zero result fails
      # this run and bumps nothing: rc 1 is a real mismatch (the loader would
      # reject the provider), rc 2 means the check could not run. No issue is
      # opened: the publish bot's token is not scoped to these repos, and
      # widening it to a repo the App is not installed on would break every bump.
      - name: ABI assertion (leia_conversion, ultraleap, tracking_open)
        id: provider_abi
        if: steps.inputs.outputs.field == 'leia_conversion' || steps.inputs.outputs.field == 'ultraleap' || steps.inputs.outputs.field == 'tracking_open'
        env:
          FIELD: ${{ steps.inputs.outputs.field }}
          TAG:   ${{ steps.inputs.outputs.tag }}
        run: |
          set +e
          python3 scripts/check_plugin_abi.py --component "$FIELD" --tag "$TAG" | tee abi.out
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "1" ]; then
            echo "::error::$FIELD $TAG negotiates a plug-in ABI major the runtime on main does not: versions.json was NOT bumped. Rebuild the provider against the current runtime headers and tag a new release."
            exit 1
          elif [ "$rc" != "0" ]; then
            echo "::error::check_plugin_abi.py could not run for $FIELD $TAG (rc=$rc): versions.json was NOT bumped. Re-run this workflow once the cause is fixed."
            exit 1
          fi
          # The Ultraleap provider hands the runtime raw struct xrt_device, which
          # the input ABI major does not cover (ADR-063), so a build is only
          # known-good on the runtime release it was built at. The pin is still
          # recorded: the catalog item carries that exact runtime range and
          # the provider's installer refuses another runtime. Say so here.
          if [ "$FIELD" = "ultraleap" ]; then
            PIN=$(sed -n 's/^runtime_pin=//p' abi.out | head -1)
            RT=$(python3 -c "import json; print(json.load(open('versions.json'))['runtime'])")
            if [ -n "$PIN" ] && [ "$PIN" != "$RT" ]; then
              echo "::warning::ultraleap $TAG was built at runtime $PIN; versions.json pins runtime $RT. The pin is recorded, but that build only installs on runtime $PIN (ADR-063)."
            fi
          fi
          rm -f abi.out

      - name: Apply bump
        if: steps.inputs.outputs.field != 'leia_plugin' || steps.abi.outputs.rc == '0'
        run: |
          python3 scripts/apply_versions_bump.py --field "$FIELD" --tag "$TAG" | tee bump.out
          # Touch a sentinel so the next steps skip the commit when nothing changed.
          if grep -q '^NOOP' bump.out; then touch .bump-noop; fi
          rm -f bump.out
        env:
          FIELD: ${{ steps.inputs.outputs.field }}
          TAG:   ${{ steps.inputs.outputs.tag }}

      - name: Commit and push
        if: hashFiles('.bump-noop') == '' && (steps.inputs.outputs.field != 'leia_plugin' || steps.abi.outputs.rc == '0')
        run: |
          git config user.name  "displayxr-publish-bot[bot]"
          git config user.email "displayxr-publish-bot@users.noreply.github.com"
          git add versions.json
          git commit -m "chore(versions): bump ${{ steps.inputs.outputs.field }} → ${{ steps.inputs.outputs.tag }}

          Auto-bumped by versions-bump.yml in response to ${{ steps.inputs.outputs.src }}.
          [skip ci]"
          # Retry once if main moved underneath us — concurrency group serializes
          # event-handler races, but a human push to main during the run is still possible.
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)

      # Mirror versions.json byte-for-byte into displayxr-installer so the
      # meta-installer's bundle composition stays in lockstep with the dev
      # orchestrator's pin matrix. The two files share an identical schema
      # (flat field names matching runtime's components.sh asset table); this
      # is just a `cp` followed by commit, no schema translation needed.
      # Installer's main is unprotected (no ruleset), so the bot's push lands
      # directly. publish-bundle.yml asserts the two files stay in sync as a
      # belt-and-braces drift guard.
      #
      # The logic lives in scripts/mirror_versions_json.sh so that this path,
      # build-windows.yml's runtime self-bump, and versions-mirror.yml (any
      # push to main touching the file) all mirror through ONE implementation.
      # It is idempotent: already-matching means no commit, exit 0.
      - name: Mirror versions.json to displayxr-installer
        if: hashFiles('.bump-noop') == '' && (steps.inputs.outputs.field != 'leia_plugin' || steps.abi.outputs.rc == '0')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/mirror_versions_json.sh \
            "chore(versions): mirror ${{ steps.inputs.outputs.field }} → ${{ steps.inputs.outputs.tag }} from displayxr-runtime" \
            "Auto-synced from displayxr-runtime/versions.json by versions-bump.yml.
          See displayxr-runtime/docs/specs/runtime/versions-json-autobump.md.
          [skip ci]"

      # Nudge the project website to re-pull org data (versions, demos, repos)
      # so displayxr.org reflects the new release within ~1 min instead of
      # waiting for its daily cron. The website's sync-org.yml regenerates and
      # direct-commits to its main; it ignores the payload but we send it for
      # log context. Non-fatal: a website hiccup must never fail a version bump.
      - name: Notify website to resync
        if: hashFiles('.bump-noop') == '' && (steps.inputs.outputs.field != 'leia_plugin' || steps.abi.outputs.rc == '0')
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: DisplayXR/displayxr-website
          event-type: org-changed
          client-payload: |
            {
              "field":       "${{ steps.inputs.outputs.field }}",
              "tag":         "${{ steps.inputs.outputs.tag }}",
              "source_repo": "${{ steps.inputs.outputs.src }}"
            }
