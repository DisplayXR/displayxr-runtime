name: Publish Extension Headers

# Auto-publishes XR_DXR_*.h headers to DisplayXR/displayxr-extensions
# whenever they change on main. Authenticates via the DisplayXR Publish
# Bot GitHub App (see org secrets DISPLAYXR_APP_ID + DISPLAYXR_APP_PRIVATE_KEY).

on:
  push:
    branches: [main]
    paths:
      - 'src/external/openxr_includes/openxr/XR_DXR_*.h'
      - 'docs/specs/extensions/index.json'
      - 'docs/specs/extensions/*.md'
      - 'scripts/gen_extensions_index.py'
      - '.github/workflows/publish-extensions.yml'
  workflow_dispatch: {}

jobs:
  publish-headers:
    if: github.repository == 'DisplayXR/displayxr-runtime'
    runs-on: ubuntu-latest

    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DISPLAYXR_APP_ID }}
          private-key: ${{ secrets.DISPLAYXR_APP_PRIVATE_KEY }}
          owner: DisplayXR
          repositories: displayxr-extensions

      - name: Checkout runtime repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Clone extensions repo
        run: |
          git clone "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/DisplayXR/displayxr-extensions.git" extensions-repo

      - name: Copy headers
        run: |
          mkdir -p extensions-repo/include/openxr
          # Prune stale XR_DXR_*.h so header DELETIONS in the runtime propagate
          # to the mirror (cp alone only adds/overwrites). The XR_EXT_*.h prune
          # is kept PERMANENTLY: it cleaned the mirror of the pre-rename
          # XR_EXT_* set on the first post-rename sync and is idempotent — do
          # not remove it (every XR_EXT_*.h ever in the mirror was
          # DisplayXR-authored). Hand-maintained headers in the mirror
          # (openxr.h, XR_MNDX_*.h, …) are left alone.
          rm -f extensions-repo/include/openxr/XR_EXT_*.h
          rm -f extensions-repo/include/openxr/XR_DXR_*.h
          cp src/external/openxr_includes/openxr/XR_DXR_*.h extensions-repo/include/openxr/
          echo "Copied headers:"
          ls -la extensions-repo/include/openxr/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate README + extensions.json
        # The README used to be a frozen heredoc right here, which is how it
        # came to document 5 of the 16 published extensions and stayed that way
        # (displayxr-extensions#2). It is now DERIVED: the set from the headers
        # above, the per-extension notes from docs/specs/extensions/index.json,
        # and lint.yml fails any PR whose header has no note. extensions.json is
        # the same table machine-readable — displayxr-website merges its longer
        # editorial prose onto it by name, so an extension cannot go missing
        # from displayxr.org/extensions either.
        run: python3 scripts/gen_extensions_index.py --out extensions-repo

      - name: Commit and push if changed
        working-directory: extensions-repo
        run: |
          git config user.name "DisplayXR Bot"
          git config user.email "noreply@displayxr.org"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Auto-publish extension headers from displayxr-runtime

          Source commit: ${{ github.sha }}"
            git push
            echo "Published updated headers"
          fi
