# Catch third-party SDK pins that have rotted -- BEFORE a release train hits them.
#
# On 2026-08-17 LunarG deleted the installer for Vulkan SDK 1.3.283.0. Six repos
# pinned it; all six lost their Windows CI mid-release-train, and re-running
# could not help. Nothing was watching, so the first symptom was a broken release.
#
# The check has two halves and BOTH are load-bearing:
#   1. the download URL still resolves, and
#   2. the archive still unpacks a USABLE SDK (Include/ + Lib/, not just Bin/).
# From SDK 1.4.313.0 onward LunarG repackaged the Windows installer so the
# humbletim/install-vulkan-sdk action's naive `7z x` yields Bin/ only. That step
# then still reports GREEN (it only runs `glslangValidator --version`) and the
# build dies much later at find_package(Vulkan). A URL-only canary would happily
# green-light a pin that cannot build -- which is exactly the trap that makes
# `version: latest` the wrong fix rather than the easy one.
#
# Manifest: downstream-pins.json      Spec: docs/specs/runtime/downstream-pin-bump.md
name: pin-rot-canary

on:
  schedule:
    # Weekly, Monday 06:00 UTC -- pins rot on a scale of months, and a failure
    # opens a durable issue rather than needing a fast catch.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pin-rot-canary
  cancel-in-progress: true

env:
  ISSUE_TITLE: 'pin-rot canary: a pinned third-party SDK has rotted'

jobs:
  canary:
    if: github.repository == 'DisplayXR/displayxr-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install 7z
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Check every pinned SDK
        id: check
        run: |
          set -uo pipefail
          : > report.md
          FAILED=0

          # Read each repo's LIVE pin from its default branch, then de-duplicate
          # by version: the repos normally share one, and downloading a ~200 MB
          # SDK once per repo would be pure waste.
          declare -A USERS
          while read -r repo file; do
            RAW="https://raw.githubusercontent.com/DisplayXR/${repo}/HEAD/${file}"
            VER=$(curl -fsSL "$RAW" 2>/dev/null | grep -oP '^\s*version:\s*\K[0-9][0-9.]*' | head -1 || true)
            if [ -z "$VER" ]; then
              echo "- ${repo}: **could not read a Vulkan SDK pin** from ${file}" >> report.md
              FAILED=1
              continue
            fi
            USERS[$VER]="${USERS[$VER]:-} $repo"
          done < <(jq -r '.sdk_pins[] | select(.kind=="lunarg_vulkan") | "\(.repo) \(.file)"' downstream-pins.json)

          for VER in "${!USERS[@]}"; do
            URL="https://sdk.lunarg.com/sdk/download/${VER}/windows/vulkan_sdk.exe"
            REPOS=$(echo "${USERS[$VER]}" | xargs -n1 | sort | paste -sd', ')
            echo "::group::Vulkan SDK $VER"

            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I -L "$URL" || echo 000)
            if [ "$CODE" != "200" ]; then
              echo "- **Vulkan SDK ${VER} is GONE** (HTTP ${CODE}) - pinned by: ${REPOS}" >> report.md
              echo "  ${URL}" >> report.md
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # Half two: it downloads -- but does it still contain a usable SDK?
            if ! curl -fsSL -o sdk.exe "$URL"; then
              echo "- **Vulkan SDK ${VER} failed to download** despite a 200 - pinned by: ${REPOS}" >> report.md
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            LIST=$(7z l sdk.exe 2>/dev/null || true)
            HAS_INC=$(echo "$LIST" | grep -ciE '(^|[ /\])Include([/\]|$)' || true)
            HAS_LIB=$(echo "$LIST" | grep -ciE '(^|[ /\])Lib([/\]|$)' || true)
            rm -f sdk.exe
            if [ "$HAS_INC" -eq 0 ] || [ "$HAS_LIB" -eq 0 ]; then
              echo "- **Vulkan SDK ${VER} downloads but unpacks NO headers/libs** (Include=${HAS_INC} Lib=${HAS_LIB}) - pinned by: ${REPOS}" >> report.md
              echo "  The repackaged-installer trap: CI would still report green (the action only runs glslangValidator --version) and then fail at find_package(Vulkan)." >> report.md
              FAILED=1
            else
              echo "  OK: ${VER} resolves and unpacks Include/ + Lib/ (${REPOS})"
            fi
            echo "::endgroup::"
          done

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          {
            echo "### pin-rot canary"
            if [ "$FAILED" = "0" ]; then
              echo "All pinned SDKs resolve and unpack a complete SDK."
            else
              cat report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One durable issue, not one per run: a rotted pin stays rotted for weeks,
      # and a weekly cron would otherwise file a duplicate every Monday.
      - name: File or update the tracking issue
        if: steps.check.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE="$RUNNER_TEMP/issue.md"
          cp report.md "$ISSUE"
          # Plain echo lines: a heredoc delimiter would have to sit at column 0,
          # which a YAML block scalar cannot contain.
          {
            echo ""
            echo "Detected by the pin-rot canary."
            echo ""
            echo "**To fix:** pick a newer version from https://vulkan.lunarg.com/sdk/versions/windows.json"
            echo "and verify BOTH that it downloads AND that '7z l' lists Include/ and Lib/."
            echo "Do NOT simply pin 'latest' -- that is the exact trap this canary exists to"
            echo "catch: from 1.4.313.0 onward the installer unpacks Bin/ only, CI still"
            echo "reports green, and the build dies later at find_package(Vulkan)."
            echo ""
            echo "Then update each repo listed above, and downstream-pins.json if the set of"
            echo "pinning repos changed. The durable fix is to drop the LunarG action for"
            echo "vcpkg, as this repo already has (runtime#1029)."
            echo ""
            echo "Run: https://github.com/DisplayXR/displayxr-runtime/actions/runs/${GITHUB_RUN_ID}"
          } >> "$ISSUE"

          EXISTING=$(gh issue list --repo DisplayXR/displayxr-runtime --state open --search "\"$ISSUE_TITLE\" in:title" --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo DisplayXR/displayxr-runtime --body-file "$ISSUE"
            echo "::warning::Updated existing tracking issue #${EXISTING}"
          else
            gh issue create --repo DisplayXR/displayxr-runtime --title "$ISSUE_TITLE" --body-file "$ISSUE"
          fi

      - name: Fail the run so the schedule surfaces it
        if: steps.check.outputs.failed == '1'
        run: exit 1
