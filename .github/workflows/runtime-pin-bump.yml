# Repin downstream repos onto a new runtime release -- gated per track.
#
# The mirror image of versions-bump.yml. That one runs when a SIBLING releases
# and records the new version here; this one runs when THIS repo releases and
# pushes the new tag out to every repo that pins the runtime in its sources.
# Before this existed, build-windows.yml's ABI-gate failure message simply told
# a human to go bump DXR_RUNTIME_GIT_TAG by hand.
#
# It opens PRs -- never direct commits. versions.json may be direct-committed
# because it RECORDS a pin; a source pin change alters what compiles, so the
# downstream repo's own CI has to gate it and a human merges. A bump that breaks
# a plug-in therefore sits as a red PR and harms nothing.
#
# Each track's policy is DATA in downstream-pins.json (`bump_when`), not logic
# here: `abi` repins when the plug-in ABI changed, `features` when a DP feature
# macro / vtable slot / the ABI changed in the track's headers, `manual` never.
# Dry-run any pair of tags locally with:
#   python3 scripts/downstream_pin_bump.py verdict --from vA --to vB --repo R --track T
#
# Manifest: downstream-pins.json      Spec: docs/specs/runtime/downstream-pin-bump.md
name: runtime-pin-bump

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Runtime tag to pin downstream (vX.Y.Z)'
        required: true
      repo:
        description: 'Limit to one repo (optional, e.g. displayxr-leia-plugin)'
        required: false
      dry_run:
        description: 'Decide and log only -- open no PRs'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize so two tags in quick succession cannot race the same downstream branch.
  group: runtime-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'DisplayXR/displayxr-runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            DRY="${{ inputs.dry_run }}"
            ONLY="${{ inputs.repo }}"
          else
            TAG="${GITHUB_REF_NAME}"
            DRY=false
            ONLY=""
          fi
          # Strict, matching the auto-bump convention elsewhere: only canonical
          # release tags propagate. Anything else (rc, nightly, retag) is skipped
          # deliberately rather than pinned downstream.
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::'$TAG' is not a canonical vX.Y.Z tag -- nothing to propagate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "dry=$DRY"   >> "$GITHUB_OUTPUT"
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.t.outputs.skip != 'true'

      # The gate. Skips are the common, correct outcome: most releases touch
      # neither the plug-in ABI nor the DP feature surface, and repinning would
      # only raise each plug-in's runtime floor. Pinned tags that are not in
      # this depth-1 checkout are read from raw.githubusercontent.com. See the
      # spec's "Bump policy" section.
      - name: Decide which repos need a repin
        if: steps.t.outputs.skip != 'true'
        id: decide
        run: |
          ARGS="--new-tag ${{ steps.t.outputs.tag }} --json decisions.json"
          if [ -n "${{ steps.t.outputs.only }}" ]; then
            ARGS="$ARGS --repo ${{ steps.t.outputs.only }}"
          fi
          python3 scripts/downstream_pin_bump.py decide $ARGS
          {
            echo "### Downstream pin decisions for ${{ steps.t.outputs.tag }}"
            jq -r '.[] | "- **\(.action)** \(.repo)/\(.track) (`\(.policy)`) - \(.reason)"' decisions.json
          } >> "$GITHUB_STEP_SUMMARY"
          echo "n=$(jq '[.[] | select(.action=="bump")] | length' decisions.json)" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        if: steps.t.outputs.skip != 'true' && steps.decide.outputs.n != '0' && steps.t.outputs.dry != 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DISPLAYXR_APP_ID }}
          private-key: ${{ secrets.DISPLAYXR_APP_PRIVATE_KEY }}
          owner: DisplayXR

      - name: Open repin PRs
        if: steps.t.outputs.skip != 'true' && steps.decide.outputs.n != '0' && steps.t.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          git config --global user.name  'displayxr-publish-bot[bot]'
          git config --global user.email 'displayxr-publish-bot[bot]@users.noreply.github.com'

          jq -c '.[] | select(.action=="bump")' decisions.json > bumps.jsonl
          while read -r d; do
            REPO=$(echo "$d"  | jq -r .repo)
            TRACK=$(echo "$d" | jq -r .track)
            CUR=$(echo "$d"   | jq -r .current_tag)
            TITLE=$(echo "$d" | jq -r .pr_title)
            # Tag AND track in the branch name: a fixed name strands a stale PR
            # and silently attaches the next run to it, and two tracks of one
            # repo bumping on the same tag must not overwrite each other.
            BRANCH="chore/runtime-pin-${TAG}-${TRACK}"
            WORK="$RUNNER_TEMP/$REPO-$TRACK"
            MSG="$RUNNER_TEMP/msg-${REPO}-${TRACK}.txt"
            BODY="$RUNNER_TEMP/body-${REPO}-${TRACK}.md"

            echo "::group::$REPO/$TRACK  $CUR -> $TAG"
            rm -rf "$WORK"
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/DisplayXR/${REPO}.git" "$WORK"
            git -C "$WORK" checkout -b "$BRANCH"

            # Writes every location of the track, or fails without touching any:
            # a half-bumped repo trips its own Rule-5 drift check.
            python3 scripts/downstream_pin_bump.py rewrite --new-tag "$TAG" --repo "$REPO" --track "$TRACK" --dir "$WORK"

            if git -C "$WORK" diff --quiet; then
              echo "no textual change -- skipping"
              echo "::endgroup::"
              continue
            fi

            # Title, triggers and policy rationale all come from the decision
            # (scripts/downstream_pin_bump.py pr_text), so the PR says exactly
            # which macro / slot / ABI change caused it.
            {
              echo "$TITLE"
              echo ""
              echo "$d" | jq -r '.triggers[] | "- " + .'
              echo ""
              echo "Auto-opened by displayxr-runtime's runtime-pin-bump.yml (bump_when=$(echo "$d" | jq -r .policy))."
            } > "$MSG"
            echo "$d" | jq -r .pr_body > "$BODY"
            git -C "$WORK" commit -aF "$MSG"
            git -C "$WORK" push -u origin "$BRANCH" --force-with-lease

            # --body-file, not --body: gh mangles backticks in an inline body.
            gh pr create --repo "DisplayXR/${REPO}" --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY" || echo "::warning::PR creation failed for $REPO/$TRACK (may already exist)"
            echo "::endgroup::"
          done < bumps.jsonl

      - name: Note dry run
        if: steps.t.outputs.dry == 'true'
        run: echo "::notice::dry_run -- decisions logged above, no PRs opened."
