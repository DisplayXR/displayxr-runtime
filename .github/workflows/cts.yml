name: OpenXR CTS

# Tiered OpenXR Conformance Test Suite runs against the freshly-built DisplayXR
# runtime + the sim-display plug-in (hardware-free), using the Khronos
# conformance_cli pinned to the loader version.
#
#  - pull_request (only when runtime / compositor / CTS-harness paths change) -> SMOKE subset, d3d11 only
#  - nightly cron on main                                                     -> FULL non-interactive suite, ALL Windows arms
#  - v* tag                                                                   -> FULL suite, ALL Windows arms (release gate)
#  - workflow_dispatch                                                        -> on-demand (choose graphics incl. `all` + scope)
#
# Shape (#1523): ONE build job produces the runtime + the CTS binaries, then a
# `run` matrix fans out over the graphics plugins reusing that single build —
# five arms must not mean five builds. A `summary` job aggregates every arm's
# result XML into one table and is the lane's real gate.
#
# The runtime is registered for the (elevated) Khronos loader via HKLM
# ActiveRuntime — XR_RUNTIME_JSON is ignored when elevated. scripts/run_cts.ps1
# owns that registration + the conformance API-layer registration, and restores
# both in a finally. See docs/roadmap/cts-windows-handoff.md.

on:
  pull_request:
    paths:
      - 'src/xrt/state_trackers/oxr/**'
      - 'src/xrt/compositor/**'
      - 'src/xrt/auxiliary/**'
      - 'src/xrt/drivers/sim_display/**'
      # Input path (#823/#830): providers + the qwerty fallback + the loaders/
      # builders in targets/common all feed the action system CTS exercises.
      - 'src/xrt/drivers/sim_input/**'
      - 'src/xrt/drivers/net_input/**'
      - 'src/xrt/drivers/ultraleap/**'
      - 'src/xrt/drivers/qwerty/**'
      - 'src/xrt/targets/common/**'
      - 'src/xrt/include/**'
      - 'scripts/run_cts.ps1'
      - 'scripts/fetch_build_cts.bat'
      - 'scripts/fetch_mesa_rasterizers.ps1'
      - 'scripts/cts_quarantine_software_tier.txt'
      - '.github/workflows/cts.yml'
  push:
    tags:
      - 'v*'
  schedule:
    # 07:00 UTC nightly — full suite on main.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      graphics:
        description: 'Graphics plugin (all = fan out over every Windows plugin)'
        type: choice
        default: d3d11
        options: [d3d11, d3d12, opengl, vulkan, vulkan2, all]
      scope:
        description: 'Test scope'
        type: choice
        default: smoke
        options: [smoke, full]
      software_gfx:
        description: 'Mesa llvmpipe/lavapipe (auto = on for opengl/vulkan/vulkan2)'
        type: choice
        default: auto
        options: [auto, "on", "off"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # KILL SWITCH for the software-rasterizer tier (#1525). Set to 0 and every
  # arm runs against whatever the runner natively provides — i.e. WARP for
  # d3d11/d3d12 and nothing at all for opengl/vulkan/vulkan2. Nothing else in
  # the lane has to change.
  DXR_CTS_SOFTWARE_ICD: '1'
  # Mesa pin for llvmpipe (OpenGL) + lavapipe (Vulkan). Exact version + SHA256,
  # never "latest" — see scripts/fetch_mesa_rasterizers.ps1 for provenance and
  # for why lavapipe rather than SwiftShader.
  DXR_MESA_VERSION: '26.1.8'
  DXR_MESA_SHA256: '4c6d32e653e0ff9ad07796e40c0bcfabf2764d849e3ce4f3b1590112c87e42f9'

jobs:
  # ---------------------------------------------------------------------------
  # Decide scope + spec + which graphics arms to fan out over. Free Linux job so
  # the Windows minutes go to the work that needs Windows.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.p.outputs.scope }}
      spec: ${{ steps.p.outputs.spec }}
      timeout: ${{ steps.p.outputs.timeout }}
      arms: ${{ steps.p.outputs.arms }}
      matrix: ${{ steps.p.outputs.matrix }}
      experimental: ${{ steps.p.outputs.experimental }}
    steps:
      - name: Resolve run parameters
        id: p
        shell: bash
        run: |
          set -euo pipefail

          # Every graphics plugin the CTS can drive on Windows. `vulkan` and
          # `vulkan2` are SEPARATE plugins (XR_KHR_vulkan_enable vs _enable2) and
          # we advertise both, so both are owed a submission run (#1523).
          ALL_ARMS="d3d11 d3d12 opengl vulkan vulkan2"

          # ===== THE EXPERIMENTAL FLAG — ONE LINE GATES AN ARM =====
          # An arm named here runs with continue-on-error and is EXCLUDED FROM
          # THE GATE (still reported, with real counts, in the summary table).
          # Removing a name is all it takes to make that arm gate.
          EXPERIMENTAL="vulkan vulkan2"
          # =========================================================
          # WHY opengl IS NO LONGER HERE (#1523). #1525 provisioned the
          # software rasterizers, and once #1540 (qwerty use-after-free) and
          # #1549 (comp_gl NULL layer slots) landed, the full non-interactive
          # GL suite ran to completion on llvmpipe for the first time — run
          # 35433846568, 27515 assertions / 1 failure / 0 errors / 42 skipped.
          # The one failure was Timed_Pipelined_Frame_Submission's 108.6%
          # frame-timing overhead against the CTS's 50% cap, which is a
          # property of a CPU rasterizer on a 2-vCPU runner and not of the
          # runtime (the same arm on a real GPU has no unexpected failures).
          # It is quarantined BY NAME on the software tier only —
          # scripts/cts_quarantine_software_tier.txt — so opengl now gates on
          # everything else. The old note here said "~493 assertions before
          # SIGSEGV (#1522)"; that crash is fixed and that number is stale.
          #
          # vulkan / vulkan2 stay here, for a blocker that MOVED. They used to
          # run 1442 and stop at vkCreateDevice (the runtime required the
          # Win32 external memory/semaphore/fence trio of every app); #1539
          # made that trio optional-if-present, so both arms now create the
          # device, PASS Swapchains, and stop at a SIGSEGV in SessionState
          # (#1542) — a separate crash, the Vulkan sibling of the GL one that
          # #1522 fixed, with its own fix in flight as #1550. A crash is not a nameable set of tests, so
          # it can never be a quarantine entry; these two flip out of this
          # string after #1550 and a full run, not before. See
          # docs/roadmap/cts-windows-handoff.md § Software-rasterizer tier.

          # Which arms get Mesa llvmpipe/lavapipe. Exactly the ones that cannot
          # START without one: the runner's only OpenGL is GDI generic 1.1 and
          # it has no Vulkan ICD. d3d11/d3d12 keep running on WARP untouched.
          SOFTWARE_ARMS="opengl vulkan vulkan2"
          sw_input="auto"

          scope="smoke"
          arms="d3d11"   # PR lane: one fast arm.
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              scope="${{ inputs.scope }}"
              g="${{ inputs.graphics }}"
              if [ "$g" = "all" ]; then arms="$ALL_ARMS"; else arms="$g"; fi
              if [ -n "${{ inputs.software_gfx }}" ]; then sw_input="${{ inputs.software_gfx }}"; fi
              ;;
            schedule|push)
              # schedule = nightly on main; push = a v* tag (see `on:` above).
              scope="full"
              arms="$ALL_ARMS"
              ;;
          esac

          # Smoke = a fast, representative slice; full = the whole non-interactive
          # subset. Interactive (HMD/controller) categories are out of scope here
          # and are tracked as a separate manual procedure (#1523 part 4).
          # The smoke slice includes the non-interactive [actions] tests
          # (create/destroy sets+actions, suggest bindings, attach,
          # StateQueryFunctionsAndHaptics, action-space creation) — the action
          # system became a first-class regression surface with the
          # input-provider channel (#823).
          #
          # The full lane runs the whole non-interactive suite with nothing
          # excluded by name. If a by-name exclusion is ever needed again —
          # Catch2 spec syntax: patterns inside ONE filter are ANDed (every
          # m_required matches, no m_forbidden matches); a COMMA starts a second
          # filter and filters are OR'd, so append "~name" WITHOUT a comma or it
          # excludes nothing.
          if [ "$scope" = "full" ]; then
            spec="exclude:[interactive]"
            timeout="900"
          else
            spec="Swapchains,SessionState,ValidateEnvironment,validApiLayer,XR_KHR_visibility_mask,XR_KHR_composition_layer_cylinder,multithreading,[actions]~[interactive]"
            timeout="420"
          fi

          # Build the matrix as include[] so each arm carries its own
          # `experimental` flag for continue-on-error and its own `software`
          # flag for the Mesa provisioning steps.
          inc=""
          for a in $arms; do
            exp="false"
            for e in $EXPERIMENTAL; do
              if [ "$a" = "$e" ]; then exp="true"; fi
            done
            sw="false"
            if [ "${DXR_CTS_SOFTWARE_ICD:-1}" != "0" ]; then
              if [ "$sw_input" = "on" ]; then
                sw="true"
              elif [ "$sw_input" = "auto" ]; then
                for s in $SOFTWARE_ARMS; do
                  if [ "$a" = "$s" ]; then sw="true"; fi
                done
              fi
            fi
            inc="${inc}{\"graphics\":\"${a}\",\"experimental\":${exp},\"software\":${sw}},"
          done
          matrix="{\"include\":[${inc%,}]}"

          {
            echo "scope=$scope"
            echo "spec=$spec"
            echo "timeout=$timeout"
            echo "arms=$arms"
            echo "experimental=$EXPERIMENTAL"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

          echo "scope=$scope timeout=$timeout"
          echo "arms=$arms  (experimental: $EXPERIMENTAL)"
          echo "spec=$spec"
          echo "matrix=$matrix"

  # ---------------------------------------------------------------------------
  # ONE build for every arm: runtime + sim-display plug-in + the Khronos CTS.
  # The runtime tree ships to the run arms as an artifact; the CTS tree rides the
  # existing actions/cache (the run arms restore the very cache this job warms).
  # ---------------------------------------------------------------------------
  build:
    name: Build runtime + CTS
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true

      - name: Restore from cache and setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '5d90b0d5d0317336e65662f2bf0d671b0902c632'
          vcpkgJsonGlob: 'vcpkg.json'

      # No Vulkan SDK download — loader/headers + glslangValidator come from vcpkg
      # (vulkan-loader, vulkan-headers, glslang in vcpkg.json). Avoids the aging
      # LunarG URL that 404s on a cold cache.

      - name: Provision glslangValidator from vcpkg onto PATH
        shell: pwsh
        run: |
          # SPIR-V.cmake's find_program(glslangValidator) was satisfied by the
          # LunarG SDK on PATH. vcpkg's glslang ships the same tool under
          # <root>/x64-windows/tools/glslang/, but only after the toolchain
          # installs it during Generate. Eagerly materialize the deps, locate
          # the tool, and prepend its dir to PATH before Generate.
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          $tool = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Include glslangValidator.exe,glslang.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '[\\/]tools[\\/]' } | Select-Object -First 1
          if (-not $tool) { throw "glslang tool not found under the vcpkg install tree" }
          Add-Content -Path $env:GITHUB_PATH -Value $tool.Directory.FullName
          Write-Host "glslang tool on PATH: $($tool.FullName)"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenXR loader
        run: |
          $openxrVersion = "1.1.63"
          $openxrUrl = "https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-$openxrVersion/openxr_loader_windows-$openxrVersion.zip"
          Invoke-WebRequest -Uri $openxrUrl -OutFile openxr_loader.zip
          Expand-Archive -Path openxr_loader.zip -DestinationPath openxr_sdk -Force

      # Mirror build-windows.yml so the CTS runtime self-reports the real tag
      # version instead of the stale in-tree CMakeLists VERSION (which read
      # v1.6.0 in CTS logs — cosmetic, but misleading when triaging a failing
      # release-gate run). CI is authoritative for the source-tree VERSION
      # (PR #353); this keeps the conformance build consistent with the release
      # build it gates.
      - name: Sync CMake VERSION from latest vX.Y.Z tag
        shell: pwsh
        run: |
          # actions/checkout's default fetch-depth is 1 and skips tags; pull
          # in just the tag refs (no extra commit history) so describe works.
          git fetch --depth=1 origin '+refs/tags/*:refs/tags/*' 2>$null

          $tag = (git describe --tags --abbrev=0 --match 'v[0-9]*' 2>$null)
          if (-not $tag) {
            Write-Host "No vX.Y.Z tag reachable — leaving CMakeLists.txt unchanged"
            exit 0
          }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "Latest tag '$tag' is not vX.Y.Z — leaving CMakeLists.txt unchanged"
            exit 0
          }
          $ver = $Matches[1]
          Write-Host "Patching CMakeLists.txt VERSION to $ver (from tag $tag, ref=$env:GITHUB_REF)"
          # Line-by-line rewrite avoids .NET regex's `$1`-followed-by-digit
          # parser ambiguity (e.g. `$1.2.4` → it tries `$11` first).
          $out = Get-Content CMakeLists.txt | ForEach-Object {
            if ($_ -match '^(\s*)VERSION\s+\d+\.\d+\.\d+(\s*)$') {
              "$($Matches[1])VERSION $ver$($Matches[2])"
            } else {
              $_
            }
          }
          Set-Content -Path CMakeLists.txt -Value $out -Encoding UTF8
          Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+\d+\.\d+\.\d+\s*$' | Select-Object -First 1

      - name: Generate + build runtime
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_FEATURES=gui `
            -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON `
            -DCMAKE_INSTALL_PREFIX=_package `
            -DXRT_FEATURE_SERVICE=ON `
            -DXRT_FEATURE_HYBRID_MODE=ON `
            -DOpenXR_ROOT="${{ github.workspace }}/openxr_sdk"
          cmake --build build --config Release --target install

      # The CTS's find_package(Vulkan) is what gates XR_USE_GRAPHICS_API_VULKAN,
      # and therefore whether conformance_cli has a `vulkan` / `vulkan2` plugin
      # at all. There is no Vulkan SDK on a hosted runner, so before #1525 the
      # CTS configure logged "-- Could NOT find Vulkan" and two of the five
      # Windows arms could not start. Point VULKAN_SDK at the SAME vcpkg
      # loader+headers the runtime links (see the note above about not
      # downloading the LunarG SDK); FindVulkan's <VULKAN_SDK>\Include + \Lib
      # resolve case-insensitively against vcpkg's include\ + lib\.
      - name: Resolve VULKAN_SDK for the CTS build from vcpkg
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "vulkan-1.lib" -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '[\\/]vcpkg_installed[\\/]x64-windows[\\/]lib[\\/]' } |
                 Select-Object -First 1
          if (-not $lib) { throw "vulkan-1.lib not found in any vcpkg_installed tree — the CTS would build without Vulkan" }
          $sdk = Split-Path (Split-Path $lib.FullName)    # <...>/x64-windows
          foreach ($p in @("$sdk\include\vulkan\vulkan.h", "$sdk\bin\vulkan-1.dll")) {
            if (-not (Test-Path $p)) { throw "expected $p under the resolved VULKAN_SDK ($sdk)" }
          }
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "VULKAN_SDK=$sdk"

      # Build the Khronos conformance_cli + conformance_test (+ the two CTS API
      # layers) pinned to the loader version. Cached on the harness script hash —
      # the `run` arms restore THIS cache rather than rebuilding (see below).
      # The `-vk` suffix is a deliberate one-shot cache break: every cache
      # written before #1525 holds a conformance_cli with NO vulkan/vulkan2
      # plugin, and the key would otherwise still hit.
      - name: Cache CTS build
        id: cts-cache
        uses: actions/cache@v5
        with:
          path: build-cts
          key: cts-${{ runner.os }}-${{ hashFiles('scripts/fetch_build_cts.bat') }}-1.1.63-vk

      - name: Build CTS
        if: steps.cts-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\fetch_build_cts.bat

      # Hand the run arms everything they need to EXECUTE without a toolchain:
      # the build tree (the dev manifest at build\Release\openxr_displayxr-dev.json
      # points at an ABSOLUTE path inside it — stable because every hosted Windows
      # runner uses the same D:\a\<repo>\<repo> workspace), the installed
      # _package (sim-display plug-in), and the Khronos loader drop. Object files
      # / import libs / PDBs are stripped — nothing links downstream.
      - name: Package the build tree for the run arms
        shell: pwsh
        run: |
          tar -cf cts-build-tree.tar `
            --exclude='*.obj' --exclude='*.o' --exclude='*.lib' --exclude='*.pdb' `
            --exclude='*.ilk' --exclude='*.exp' --exclude='CMakeFiles' `
            build _package openxr_sdk
          if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
          $mb = [math]::Round((Get-Item cts-build-tree.tar).Length / 1MB, 1)
          Write-Host "cts-build-tree.tar = $mb MB"

      - name: Upload build tree
        uses: actions/upload-artifact@v6
        with:
          name: cts-build-tree
          path: cts-build-tree.tar
          retention-days: 1
          if-no-files-found: error
          # See the note on the per-arm upload below: without this, a re-run
          # leaves the previous attempt's artifact in place under the same name.
          overwrite: true

  # ---------------------------------------------------------------------------
  # One arm per graphics plugin, all reusing the single build above.
  # ---------------------------------------------------------------------------
  run:
    name: CTS ${{ matrix.graphics }}
    needs: [plan, build]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Experimental arms (see the flag in `plan`) report but never fail the lane.
    continue-on-error: ${{ matrix.experimental }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Per-arm tag -> %TEMP%\cts_ci_<graphics>.xml + cts_ci_<graphics>_console.log.
      # Every arm used to write cts_ci.xml, so a matrix would have been five files
      # with one name and no submission package (#1523).
      CTS_TAG: ci_${{ matrix.graphics }}
    steps:
      # Sources only — nothing is compiled here. No submodules, no LFS: the
      # binaries arrive as an artifact and the CTS tree from the cache.
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download build tree
        uses: actions/download-artifact@v6
        with:
          name: cts-build-tree

      - name: Unpack build tree
        shell: pwsh
        run: |
          tar -xf cts-build-tree.tar
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed ($LASTEXITCODE)" }
          $manifest = "build\Release\openxr_displayxr-dev.json"
          if (-not (Test-Path $manifest)) { throw "dev runtime manifest missing after unpack: $manifest" }
          Get-Content $manifest | Write-Host

      # Same key as the build job's actions/cache — that job either hit it or
      # populated it, so by the time this runs it always exists. Fail loudly
      # rather than silently rebuilding the CTS five times over.
      - name: Restore CTS build
        uses: actions/cache/restore@v5
        with:
          path: build-cts
          key: cts-${{ runner.os }}-${{ hashFiles('scripts/fetch_build_cts.bat') }}-1.1.63-vk
          fail-on-cache-miss: true

      # Register the freshly-built sim-display plug-in for DP discovery, exactly
      # as build-windows.yml's self-test gate does.
      - name: Register sim-display plug-in
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE "_package\bin\plugins\DisplayXR-SimDisplay.dll"
          if (-not (Test-Path $plugin)) {
            $plugin = (Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build" -Recurse -Filter "DisplayXR-SimDisplay.dll" | Select-Object -First 1).FullName
          }
          if (-not $plugin) { throw "DisplayXR-SimDisplay.dll not found" }
          $key = "HKLM\Software\DisplayXR\DisplayProcessors\sim-display"
          reg add $key /v Binary /t REG_SZ /d "$plugin" /f | Out-Null
          reg add $key /v ProbeOrder /t REG_DWORD /d 200 /f | Out-Null
          reg add $key /v DisplayName /t REG_SZ /d "Simulated 3D Display" /f | Out-Null
          Write-Host "Registered sim-display plug-in: $plugin"

      # --- software rasterizers (#1525) ------------------------------------
      # Only the arms that cannot start without one (matrix.software, set in
      # `plan`). Cached on the pinned Mesa version alone: a pin bump is a new
      # key, and the archive is checksum-verified on restore anyway.
      - name: Cache Mesa software rasterizers
        if: matrix.software
        uses: actions/cache@v5
        with:
          path: mesa-sw-gfx
          key: mesa-${{ runner.os }}-${{ env.DXR_MESA_VERSION }}

      - name: Provision Mesa llvmpipe + lavapipe
        if: matrix.software
        shell: pwsh
        run: |
          # opengl32.dll must sit in the *application* directory to win over
          # System32; stage it beside conformance_cli.exe (the process image)
          # and also beside the runtime DLL + the sim-display plug-in, because
          # either may be loaded with LOAD_WITH_ALTERED_SEARCH_PATH, which
          # substitutes the loaded module's own directory for the app dir.
          $ctsExe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build-cts" -Recurse -Filter conformance_cli.exe -File |
                    Select-Object -First 1
          if (-not $ctsExe) { throw "conformance_cli.exe not found under build-cts" }
          $stage = @(
            $ctsExe.DirectoryName,
            "$env:GITHUB_WORKSPACE\build\Release",
            "$env:GITHUB_WORKSPACE\_package\bin\plugins"
          )
          & "$env:GITHUB_WORKSPACE\scripts\fetch_mesa_rasterizers.ps1" `
            -Version "$env:DXR_MESA_VERSION" `
            -Sha256 "$env:DXR_MESA_SHA256" `
            -CacheDir "$env:GITHUB_WORKSPACE\mesa-sw-gfx" `
            -StageTo $stage `
            -GithubEnv

      - name: Run CTS (${{ needs.plan.outputs.scope }} / ${{ matrix.graphics }})
        shell: pwsh
        run: |
          $quarantine = ""
          if ("${{ matrix.software }}" -eq "true") {
            # ONLY the software tier gets a quarantine list; every other tier
            # runs with an empty exclusion set by construction (#1525).
            $quarantine = "$env:GITHUB_WORKSPACE\scripts\cts_quarantine_software_tier.txt"
          }
          & "$env:GITHUB_WORKSPACE\scripts\run_cts.ps1" `
            -TestSpec "${{ needs.plan.outputs.spec }}" `
            -Graphics "${{ matrix.graphics }}" `
            -QuarantineList $quarantine `
            -ConformanceLayer `
            -TimeoutSec ${{ needs.plan.outputs.timeout }} `
            -Tag "$env:CTS_TAG"

      - name: Evaluate results
        shell: pwsh
        run: |
          $xml = "$env:TEMP\cts_$($env:CTS_TAG).xml"
          if (-not (Test-Path $xml)) { throw "CTS produced no result XML — the run likely crashed before writing results." }
          # Check completeness BEFORE parsing: a crashed run leaves a truncated
          # XML, and the [xml] cast on it dies with an opaque MetadataError
          # (masked the real story for weeks — #830). Surface the last test the
          # console log reached instead.
          if (-not (Select-String -Path $xml -Pattern '</testsuites>' -Quiet)) {
            $log = "$env:TEMP\cts_$($env:CTS_TAG)_console.log"
            $lastTest = "(no console log)"
            if (Test-Path $log) {
              $m = Select-String -Path $log -Pattern '^-{10,}$' -Context 0,1 | Select-Object -Last 1
              if ($m -and $m.Context.PostContext) { $lastTest = $m.Context.PostContext[0].Trim() }
              Write-Host "--- console log tail ---"
              Get-Content $log -Tail 15 | Write-Host
            }
            throw "CTS crashed before writing complete results (XML truncated). Last test reached: $lastTest"
          }
          [xml]$doc = Get-Content $xml
          $suite = $doc.testsuites.testsuite
          if (-not $suite) { $suite = $doc.testsuite }
          # Count BOTH schema buckets: assertion failures land in failures=,
          # but a test that dies on an exception (e.g. XrResult throw) lands in
          # errors= — the gate only read failures for weeks, so 8/14 smoke
          # tests were red while the job stayed green (#830).
          $failures = [int]$suite.failures
          $errors = [int]$suite.errors
          $tests = [int]$suite.tests
          $skipped = [int]$suite.skipped
          Write-Host "CTS: $tests assertions, $failures failures, $errors errors, $skipped skipped"
          if (($failures + $errors) -gt 0) {
            Write-Host "::error::CTS reported $failures failing assertions + $errors errored test cases"
            $doc.SelectNodes('//testcase[failure]') | ForEach-Object { Write-Host "  FAIL:  $($_.name)" }
            $doc.SelectNodes('//testcase[error]')   | ForEach-Object { Write-Host "  ERROR: $($_.name)" }
            exit 1
          }
          Write-Host "CTS passed."

      # Surface the frame-pacing numbers Timed_Pipelined_Frame_Submission prints
      # so we can trend the runner's effective frame timing instead of only
      # learning about it when the hard 50%-overhead assertion trips. The
      # overhead factor is (avg frame time / predicted display period) - 1; the
      # CTS hard-fails at >= 50%. We warn at >= 40% as an early signal that the
      # hosted runner's timer/scheduling jitter is creeping toward the cliff
      # (see #589 for why this test is timer-granularity sensitive on Windows).
      #
      # EXPECT "No ... metrics in console log" ON THE SOFTWARE TIER: the test is
      # quarantined by name there (#1523), so it prints nothing to scrape. That
      # line is the honest reading, not a scrape regression — the percentage
      # comes back on any tier that does not pass the quarantine list (the PR
      # lane's WARP arms, and the real-GPU tier #1526).
      - name: Report frame-timing metrics
        if: always()
        shell: pwsh
        run: |
          # The timing block is on conformance_cli's STDOUT, not in the Catch2
          # console-reporter file — scraping the reporter file found nothing on
          # every run since this step was written (verified against main @
          # v2.17.1, run 35401166847: "No Timed_Pipelined_Frame_Submission
          # metrics in console log"). run_cts.ps1 now captures stdout to
          # cts_<tag>_stdout.log; fall back to the reporter file so an older
          # run_cts.ps1 still produces the old (empty) behaviour rather than an
          # error.
          $log = "$env:TEMP\cts_$($env:CTS_TAG)_stdout.log"
          if (-not (Test-Path $log)) { $log = "$env:TEMP\cts_$($env:CTS_TAG)_console.log" }
          if (-not (Test-Path $log)) { Write-Host "No CTS stdout/console log to scrape metrics from."; exit 0 }
          Write-Host "scraping frame-timing metrics from: $log"
          $lines = Get-Content $log |
            Select-String -Pattern 'Average (xrWaitFrame|time spent|predicted|xrBeginFrame)|Overhead score'
          if (-not $lines) { Write-Host "No Timed_Pipelined_Frame_Submission metrics in console log."; exit 0 }
          "## CTS frame-timing — ${{ matrix.graphics }} (Timed_Pipelined_Frame_Submission)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines | ForEach-Object { $_.Line.Trim() | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY | Write-Host }
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $oh = ($lines | Where-Object { $_.Line -match 'Overhead score\s*:\s*([-0-9.]+)%' } | Select-Object -First 1)
          if ($oh -and $oh.Line -match 'Overhead score\s*:\s*([-0-9.]+)%') {
            $pct = [double]$Matches[1]
            if ($pct -ge 40.0) {
              Write-Host "::warning::CTS frame overhead ${pct}% is within 10pts of the 50% hard-fail (timer/scheduling jitter — see #589)"
            } else {
              Write-Host "CTS frame overhead ${pct}% — healthy margin under the 50% cap."
            }
          }

      # run_cts.ps1 writes to the pwsh process's $env:TEMP
      # (C:\Users\runneradmin\...), which is NOT ${{ runner.temp }} (D:\a\_temp)
      # on hosted Windows runners — the old direct upload silently found
      # nothing every run (#830). Stage into the workspace instead.
      - name: Stage CTS results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cts-results | Out-Null
          foreach ($f in @("cts_$($env:CTS_TAG).xml", "cts_$($env:CTS_TAG)_console.log", "cts_$($env:CTS_TAG)_stdout.log",
                           "cts_$($env:CTS_TAG)_graphics_identity.txt")) {
            $src = Join-Path $env:TEMP $f
            if (Test-Path $src) { Copy-Item $src cts-results\ }
          }
          # The runtime's own log is where the renderer/device identity and the
          # adapter-resolver decisions live; without it a red arm has to be
          # re-run locally to learn anything (#1525).
          $rtLogs = Join-Path $env:LOCALAPPDATA "DisplayXR"
          if (Test-Path $rtLogs) {
            Get-ChildItem -Path $rtLogs -Filter "DisplayXR_conformance_cli*.log" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 3 |
              ForEach-Object { Copy-Item $_.FullName cts-results\ }
          }
          Get-ChildItem cts-results | ForEach-Object { Write-Host "staged: $($_.Name) ($($_.Length) bytes)" }

      # One artifact per arm, named so the set can be dropped into a Khronos
      # submission package unmodified: cts-results-<graphics>/cts_ci_<graphics>.xml.
      - name: Upload CTS results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cts-results-${{ matrix.graphics }}
          path: cts-results/
          if-no-files-found: warn
          # Artifacts are per-RUN, not per-attempt. Without overwrite, re-running
          # a failed arm adds a SECOND artifact under the same name and the
          # summary's download resolves the OLD one — a fresh green arm was
          # gated red off attempt 1's XML (run 35406623715), and the same
          # mechanism would just as happily report a stale green over a real red.
          overwrite: true

      # Today this arm restores the CTS tree with actions/cache/RESTORE, which
      # never saves, so Mesa cannot leak into the shared cache from here. Keep
      # the cleanup anyway: that guarantee should not depend on which cache
      # action a future edit reaches for. If the run job ever saves again, a
      # Mesa opengl32.dll left beside conformance_cli.exe would be restored
      # into the d3d11/d3d12 arms, which never asked for software rendering —
      # a silent result change with no build failure to notice (#1525).
      - name: Unstage Mesa from the CTS build tree
        if: always() && matrix.software
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\fetch_mesa_rasterizers.ps1" `
            -CacheDir "$env:GITHUB_WORKSPACE\mesa-sw-gfx" -Unstage

  # ---------------------------------------------------------------------------
  # The lane's gate. Every arm's XML in one table; fails if any NON-experimental
  # arm was red or produced nothing at all.
  # ---------------------------------------------------------------------------
  summary:
    name: CTS summary
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download every arm's results
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: cts-results-*
          path: all-results

      - name: Build the matrix table and gate
        shell: bash
        env:
          ARMS: ${{ needs.plan.outputs.arms }}
          EXPERIMENTAL: ${{ needs.plan.outputs.experimental }}
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          python3 - <<'PY'
          import os, sys, glob
          import xml.etree.ElementTree as ET

          arms = os.environ.get("ARMS", "").split()
          experimental = set(os.environ.get("EXPERIMENTAL", "").split())
          scope = os.environ.get("SCOPE", "?")

          rows, failed = [], []
          for arm in arms:
              # Depth-agnostic on purpose: actions/download-artifact only creates
              # a per-artifact subdirectory when MORE THAN ONE artifact matches
              # the pattern, so a single-arm lane (the PR's d3d11) lands the XML
              # directly in all-results/ while a fan-out nests it under
              # all-results/cts-results-<arm>/. The filename carries the arm, so
              # matching on it is unambiguous either way.
              hits = glob.glob(f"all-results/**/cts_ci_{arm}.xml", recursive=True)
              exp = arm in experimental
              if not hits:
                  rows.append((arm, "—", "—", "—", "MISSING (no result XML)", exp))
                  if not exp:
                      failed.append(f"{arm}: produced no result XML")
                  continue
              try:
                  root = ET.parse(hits[0]).getroot()
              except ET.ParseError as e:
                  rows.append((arm, "—", "—", "—", f"TRUNCATED ({e})", exp))
                  if not exp:
                      failed.append(f"{arm}: result XML is truncated/unparseable")
                  continue
              suite = root.find("testsuite") if root.tag == "testsuites" else root
              if suite is None:
                  suite = root
              tests = int(suite.get("tests", 0))
              failures = int(suite.get("failures", 0))
              errors = int(suite.get("errors", 0))
              bad = failures + errors
              status = "PASS" if bad == 0 else f"FAIL ({bad} red)"
              rows.append((arm, tests, failures, errors, status, exp))
              if bad and not exp:
                  failed.append(f"{arm}: {failures} failures + {errors} errors")

          lines = [f"## OpenXR CTS matrix — scope `{scope}`", "",
                   "| arm | tests | failures | errors | status |",
                   "|---|---:|---:|---:|---|"]
          for arm, tests, failures, errors, status, exp in rows:
              label = f"`{arm}`" + (" _(experimental, #1542)_" if exp else "")
              lines.append(f"| {label} | {tests} | {failures} | {errors} | {status} |")
          lines += ["",
                    "`opengl` runs against Mesa **llvmpipe** on the hosted runner (#1525) and **is gated**",
                    "(#1523), with `Timed_Pipelined_Frame_Submission` quarantined by name on the software",
                    "tier only — its 108.6% frame-timing overhead is the CPU rasterizer, not the runtime",
                    "(scripts/cts_quarantine_software_tier.txt).",
                    "",
                    "Experimental arms (`vulkan` / `vulkan2`) run against **lavapipe**, report real counts,",
                    "and are not gated: they now get past `vkCreateDevice` (#1539) and PASS `Swapchains`,",
                    "but SIGSEGV in `SessionState` (#1542) — the Vulkan sibling of the GL crash that",
                    "#1522 fixed, with its own fix in flight as #1550.",
                    "See docs/roadmap/cts-windows-handoff.md."]
          out = "\n".join(lines) + "\n"
          print(out)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a") as f:
                  f.write(out)

          if not arms:
              print("::error::plan produced no arms — nothing ran")
              sys.exit(1)
          if failed:
              for f in failed:
                  print(f"::error::CTS arm red — {f}")
              sys.exit(1)
          print("All gated CTS arms green.")
          PY
