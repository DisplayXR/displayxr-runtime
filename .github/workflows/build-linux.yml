name: Build Linux

# Linux CI (docs/roadmap/linux-support.md, issue #660) — PROMOTED to a
# PR-triggered required check (#660 CI-promotion task): runs on every PR like
# build-windows.yml / build-macos.yml, with the same DetectChanges docs_only
# short-circuit so doc-only PRs report success in seconds without building.
# Required contexts (main-protection ruleset): Selftest, Service, Package,
# Linux Packaging.
#
# Selftest job (Phase 0/1): configure + build the runtime + displayxr-cli +
# the sim_display plug-in, run `displayxr-cli selftest` (the hardware-free gate
# that exercises plug-in discovery + the display-processor path with no GPU,
# window, or OpenXR loader), and compile the Phase 1b bring-up test app.
#
# Service job (Phase 2, #660): the same build with XRT_FEATURE_SERVICE=ON —
# compiles displayxr-service + the IPC-client runtime (client VK compositor,
# ipc_client/ipc_server, comp_multi). CI has no display, so build-green is the
# Phase 2 gate; the IPC round-trip is hardware work (Phase 1b).
#
# Package job (#705): build in the OLDEST supported container (ubuntu:22.04,
# #1656), produce the tarball, install from it, and gate on selftest resolving
# everything from the installed XDG paths, plus the headless displayxr-service
# smoke (#1744) on the installed service.
#
# Newest job (#1656): the "still compiles on the newest release" coverage the
# Package job used to provide before it moved to 22.04 — build + selftest in an
# ubuntu:26.04 container, no packaging.
#
# Deb job (#781 Phase 3, #1656): build the runtime .deb
# (scripts/package_deb_linux.sh) on every PR, in an ubuntu:22.04 container so
# the shipped binaries carry the oldest supported release's glibc floor. Since
# #1744 it is the HYBRID runtime + displayxr-service + its socket-activated
# systemd user units (the .deb used to be in-process only, so no installed box
# could weave). DebInstall then installs it into pristine 22.04 / 24.04 / 26.04
# containers and runs it there — selftest AND the headless service smoke; DebRelease attaches displayxr-runtime_<ver>_amd64.deb to a v*
# GitHub Release — the asset the Linux meta-bundle (displayxr-installer)
# fetches — only after that passes. Deb / DebInstall are not required contexts
# themselves (DebInstall is a matrix, so its context names move when the
# supported-release list changes); the LinuxPackaging aggregator below carries
# the stable required context "Linux Packaging" on their behalf.

on:
  workflow_dispatch: {}
  pull_request: {}
  # Release tags: the Deb job attaches displayxr-runtime_<ver>_amd64.deb to the
  # GitHub Release (the Linux meta-bundle fetches this asset — #781 Phase 3).
  # Tags only, never plain pushes to main (repo policy: CI on PR + tags).
  push:
    tags:
      - "v*"

# The Deb job needs write access to create/attach release assets on tags.
permissions:
  contents: write

# Cancel any in-progress run for the same PR (or branch) when a new
# push comes in. Only the latest commit's CI completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full clone — the diff below uses pull_request.base.sha, which can
          # be older than the merge commit's first parent. Shallow clones miss
          # those refs and the diff fails with "fatal: bad object".
          fetch-depth: 0
      - id: filter
        run: |
          # Same docs_only rule as build-windows.yml: heavy jobs still RUN (to
          # report the required status) but skip their expensive steps.
          # workflow_dispatch always builds.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Detected non-PR trigger — docs_only=false"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected docs_only=$(grep ^docs_only= "$GITHUB_OUTPUT" | cut -d= -f2)"

  Selftest:
    needs: DetectChanges
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — reporting success without building."

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          submodules: recursive

      - name: Install dependencies
        # GL/EGL dev libs flip XRT_HAVE_OPENGL/XRT_HAVE_EGL ON so CI configures
        # like a real desktop (aux_ogl + GL client bindings get compiled) and
        # enforces the comp_gl platform gate — comp_gl has no Linux branch, so
        # un-gating it would fail this build (#709). Once GL is found, the OpenXR
        # SDK build (--apps loader provisioning) additionally links
        # Xrandr/Xxf86vm (gfxwrapper) and includes xcb/glx.h (loader
        # XR_USE_PLATFORM_XCB path) — hence the last three packages.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev libwayland-dev \
            libdbus-1-dev \
            libgl-dev libglvnd-dev libegl1-mesa-dev libxrandr-dev libxxf86vm-dev libxcb-glx0-dev

      - name: Build + headless selftest + test app
        # --apps also builds the OpenXR loader (from source) + the test apps:
        # cube_hosted_legacy_vk_linux (Phase 1b hosted bring-up vehicle) and
        # cube_handle_vk_linux (Phase 3 handle class — app-owned X11 window via
        # XR_DXR_xlib_window_binding). CI has no display, so the apps aren't
        # run here; compile+link green is the gate.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: ./scripts/build_linux.sh --apps

  # Packaging gate (#705): produce the tarball, run its own install.sh
  # (user-level), and prove the installed tree works end-to-end — selftest
  # resolving the runtime + plug-in purely from the installed XDG paths (no
  # XRT_PLUGIN_SEARCH_PATH).
  #
  # Built in the OLDEST supported container (#1656), like the Deb job: the
  # tarball is a relocatable binary drop with no dependency metadata at all, so
  # a newer build host's glibc floor is even less visible there than in a .deb —
  # install.sh would happily unpack a tree that cannot dlopen. package_linux.sh
  # records the floor in the tarball's GLIBC_FLOOR file and install.sh refuses a
  # host below it. (Building on the NEXT LTS moved to the Newest job below, so
  # that toolchain coverage is kept.)
  Package:
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — reporting success without building."

      - name: Install dependencies
        # Container runs as root — no sudo binary; hosted-runner parity shim.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          SUDO=""; [ "$(id -u)" != 0 ] && SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y \
            build-essential cmake ninja-build pkg-config git ca-certificates python3 \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev libwayland-dev \
            libdbus-1-dev \
            libgl-dev libglvnd-dev libegl1-mesa-dev libxrandr-dev libxxf86vm-dev libxcb-glx0-dev

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          submodules: recursive
          fetch-depth: 0 # git describe needs tags for the tarball version

      - name: Build + package
        # --hybrid (#1744): the shipped configuration — in-process runtime for
        # ordinary apps, IPC to displayxr-service for present-owners.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/build_linux.sh --hybrid --no-test
          ./scripts/package_linux.sh --no-build

      - name: Install from tarball + selftest from installed paths
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          export HOME="${HOME:-/root}"
          tar -C /tmp -xzf dist/displayxr-runtime-linux-*.tar.gz
          cd /tmp/displayxr-runtime-linux-*/
          ./install.sh
          # The real gate: NO XRT_PLUGIN_SEARCH_PATH — discovery must come
          # from the installed XDG DisplayProcessors root.
          unset XRT_PLUGIN_SEARCH_PATH
          "$HOME/.local/share/displayxr/bin/displayxr-cli" info
          "$HOME/.local/share/displayxr/bin/displayxr-cli" selftest
          # #1744: the installed service runs detached, answers IPC, stops on
          # SIGTERM, recovers a stale socket, and socket-activates.
          "$GITHUB_WORKSPACE/scripts/smoke_service_linux.sh" --bin-dir "$HOME/.local/share/displayxr/bin"
          # install.sh wrote the socket-activated unit pair (no user manager in
          # the container, so it is written but not enabled).
          test -f "$HOME/.config/systemd/user/displayxr.socket"
          grep -qx "ExecStart=$HOME/.local/share/displayxr/bin/displayxr-service" \
            "$HOME/.config/systemd/user/displayxr.service"
          ./uninstall.sh
          test ! -f "$HOME/.config/systemd/user/displayxr.socket"
          # Uninstall must leave no ActiveRuntime behind.
          test ! -f "$HOME/.config/openxr/1/active_runtime.json"

      - name: Upload tarball artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: displayxr-runtime-linux-tarball
          path: dist/displayxr-runtime-linux-*.tar.gz
          if-no-files-found: error

  # Newest-toolchain gate (#1656): the Package job used to build in the NEXT-LTS
  # container and moved to 22.04 so the tarball it produces is portable, so the
  # "does the tree still compile on the newest release" coverage lives here.
  # Build + headless selftest only — no packaging.
  Newest:
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — reporting success without building."

      - name: Install dependencies
        # Container runs as root — no sudo binary; hosted-runner parity shim.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates python3 \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev libwayland-dev \
            libdbus-1-dev \
            libgl-dev libglvnd-dev libegl1-mesa-dev libxrandr-dev libxxf86vm-dev libxcb-glx0-dev

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          submodules: recursive

      - name: Build service + IPC-client runtime + headless selftest
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/build_linux.sh --service

  Service:
    needs: DetectChanges
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — reporting success without building."

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          submodules: recursive

      - name: Install dependencies
        # GL/EGL (+Xrandr/Xxf86vm) dev libs: same rationale as the Selftest
        # job (#709).
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev libwayland-dev \
            libdbus-1-dev \
            libgl-dev libglvnd-dev libegl1-mesa-dev libxrandr-dev libxxf86vm-dev libxcb-glx0-dev

      - name: Build service + IPC-client runtime (headless selftest)
        # XRT_FEATURE_SERVICE=ON: displayxr-service + the IPC-client runtime
        # (client VK compositor + ipc_client/ipc_server + comp_multi). The
        # selftest still runs (displayxr-cli links target_instance_no_comp,
        # independent of service mode). Build-green only — no display on CI.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: ./scripts/build_linux.sh --service

  # Build the ONE runtime .deb — the CI-published asset the Linux meta-bundle
  # fetches (#781 Phase 3). Runs on every PR too so a broken
  # package_deb_linux.sh is caught before release; DebRelease below attaches it
  # to a v* release once DebInstall has proved it.
  #
  # PORTABLE BY CONSTRUCTION (#1656): the same .deb must install and run on
  # Ubuntu 22.04, 24.04 and 26.04, so it is built on the OLDEST — an
  # ubuntu:22.04 container (glibc 2.35 / GCC 11 floor). v2.19.1 was built on
  # ubuntu-latest (24.04), needed GLIBC_2.38 + GLIBCXX_3.4.31, and declared an
  # unversioned `libc6`, so apt installed it on 22.04 and every app then failed
  # at dlopen(). package_deb_linux.sh derives versioned Depends with
  # dpkg-shlibdeps, refuses a DT_NEEDED outside its cross-release STABLE_SONAMES
  # list, and — with DXR_DEB_MAX_GLIBC — refuses a glibc floor above 22.04's.
  #
  # NB: deliberately does NOT install the GL/EGL dev libs — NOT because they
  # would break the build (comp_gl is gated `(WIN32 OR APPLE) AND
  # XRT_HAVE_OPENGL` in src/xrt/compositor/CMakeLists.txt, so on Linux GL only
  # reaches the sim_display GL DP + aux_ogl), but because Linux has no GL
  # compositor at all: flipping XRT_HAVE_OPENGL/XRT_HAVE_EGL on would only add
  # unusable code and extra runtime Depends to the shipped .deb. (The
  # Selftest/Service jobs install them on purpose — they exist to keep the
  # platform gate itself honest, #709.) The vendor Leia plug-in .deb is NOT
  # built here: Track B needs the commercial SR SDK, so it is produced on an
  # SR-equipped box, not public CI.
  Deb:
    needs: DetectChanges
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DXR_DEB_MAX_GLIBC: "2.35" # Ubuntu 22.04 — the oldest supported release
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — skipping .deb build."

      - name: Install dependencies
        # Bare image, root: installed BEFORE checkout so actions/checkout finds
        # git (else it falls back to a tarball with no tags and git describe
        # cannot version the .deb). python3: the build's code generators.
        # libwayland-dev + libdbus-1-dev are REQUIRED here (unlike GL/EGL above):
        # they gate XRT_HAVE_WAYLAND/XRT_HAVE_DBUS, so without them the released
        # .deb would ship a runtime with no Wayland present path
        # (XR_DXR_wayland_surface_binding unadvertised — package_deb_linux.sh
        # refuses that via check_linux_runtime_wayland.sh) and no #817 wl_geom
        # window-geometry provider. Cost at runtime: libdbus-1-3 only (present on
        # every GNOME/KDE desktop). libwayland-dev is build-time ONLY: nothing
        # references a wl_* symbol (the app's wl_display*/wl_surface* go straight
        # into VkWaylandSurfaceCreateInfoKHR), so --as-needed drops
        # -lwayland-client and libwayland-client0 never enters Depends. (No
        # wayland-protocols: the runtime generates no protocol code; the vendored
        # protocol XML lives in displayxr-common's displayxr::linux_window, test-app only.)
        # libxrandr-dev is REQUIRED too: with x11+xrandr absent, pkg_check_modules
        # leaves XRT_HAVE_XLIB_XRANDR OFF and the released .deb ships with no
        # DXR_LINUX_DIRECT_SCANOUT present path (adds libxrandr2 + libx11-6 to the
        # derived Depends). Keep in lockstep with scripts/test_deb_linux.sh.
        # 22.04's apt cmake is 3.22.1 = CMakeLists' floor, so no pinned CMake.
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            python3 file binutils \
            libvulkan-dev glslang-tools \
            libeigen3-dev libcjson-dev libudev-dev \
            libxcb1-dev libxcb-randr0-dev libx11-dev libx11-xcb-dev libwayland-dev \
            libdbus-1-dev \
            libxrandr-dev \
            dpkg-dev fakeroot
          cmake --version | head -1

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          submodules: recursive
          fetch-depth: 0 # git describe needs tags for the .deb version

      - name: Build runtime .deb (clean Release build)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/package_deb_linux.sh
          echo "built:"; ls -lh dist/displayxr-runtime_*_amd64.deb

      - name: Upload .deb artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: displayxr-runtime-deb
          path: dist/displayxr-runtime_*_amd64.deb
          if-no-files-found: error

  # Install the .deb from the Deb job into a PRISTINE container of every
  # supported release, without Recommends, and run it there
  # (scripts/verify_deb_install_linux.sh): apt must resolve Depends from that
  # release's archive, `ldd -r` must be clean on every shipped ELF, every
  # Depends/Recommends/Suggests name must exist there, `displayxr-cli
  # selftest` must pass env-free on the packaged sim-display, and (#1744)
  # displayxr-service + its systemd user units must be installed and pass
  # scripts/smoke_service_linux.sh — detached start, IPC handshake, SIGTERM,
  # stale socket, socket activation + exit-when-idle (no systemd in the
  # container: the sd_listen_fds hand-off is emulated). The Package job's
  # tarball is checked for the same glibc / libstdc++ floor.
  DebInstall:
    name: DebInstall (Ubuntu ${{ matrix.release }})
    needs: [DetectChanges, Deb, Package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["22.04", "24.04", "26.04"]
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — no .deb to verify."

      - uses: actions/checkout@v5
        if: needs.DetectChanges.outputs.docs_only != 'true'

      - uses: actions/download-artifact@v6
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          name: displayxr-runtime-deb
          path: dist

      - uses: actions/download-artifact@v6
        if: needs.DetectChanges.outputs.docs_only != 'true'
        with:
          name: displayxr-runtime-linux-tarball
          path: dist

      - name: apt install + ldd -r + selftest in clean ubuntu:${{ matrix.release }}
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          docker run --rm -v "$PWD:/w" -w /w "ubuntu:${{ matrix.release }}" \
            ./scripts/verify_deb_install_linux.sh \
              dist/displayxr-runtime_*_amd64.deb dist/displayxr-runtime-linux-*.tar.gz

  # Single stable required context for the whole Linux packaging lane.
  #
  # Why an aggregator rather than requiring the legs directly: DebInstall is a
  # matrix, so its contexts are "DebInstall (Ubuntu 22.04)", "… 24.04",
  # "… 26.04" — names that change the moment a release is added or dropped, and
  # a ruleset still demanding a context no job produces blocks every PR forever.
  # This job's name is fixed, so the matrix can grow or shrink freely.
  #
  # The gap it closes: DebInstall installs the built .deb into pristine
  # containers of every supported release and runs it there, and DebRelease
  # depends on it — so it already gates the release asset. But nothing gated
  # MERGING with it red, which is how #1656 (a .deb built on a newer host,
  # declaring an unversioned libc6, that apt happily installed on 22.04 and that
  # then failed at every dlopen) reached a release.
  #
  # Doc-only PRs: Deb / Package / DebInstall all RUN and report success on the
  # docs_only path (they short-circuit per-step, the same pattern as Runtime in
  # build-windows.yml), so this job's needs are satisfied and it reports success
  # in seconds without asserting anything. It must never be the thing that
  # leaves a doc PR permanently unmergeable.
  #
  # `if: always()` is load-bearing: without it a failed leg would SKIP this job,
  # and a skipped check counts as neutral/green for a required context — the
  # aggregator would silently stop gating exactly when it matters. Running
  # unconditionally and asserting on needs.*.result is what makes it a gate.
  LinuxPackaging:
    name: Linux Packaging
    needs: [DetectChanges, Deb, Package, DebInstall]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only short-circuit
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Doc-only change — packaging legs short-circuited; reporting success without asserting."

      - name: Assert every packaging leg succeeded
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          # DetectChanges is included on purpose: if it failed, docs_only is ''
          # (!= 'true'), so we land here — and must fail rather than green-light
          # a run whose change classification never happened.
          RESULT_DETECTCHANGES: ${{ needs.DetectChanges.result }}
          RESULT_DEB: ${{ needs.Deb.result }}
          RESULT_PACKAGE: ${{ needs.Package.result }}
          # Matrix job: 'success' only when every leg succeeded (fail-fast is
          # off, so one red release still surfaces here).
          RESULT_DEBINSTALL: ${{ needs.DebInstall.result }}
        run: |
          set -u
          rc=0
          for leg in DETECTCHANGES DEB PACKAGE DEBINSTALL; do
            var="RESULT_${leg}"
            result="${!var}"
            printf '%-14s %s\n' "$leg" "${result:-<missing>}"
            # Anything that is not an outright success fails the gate —
            # including 'skipped', which on the non-docs_only path can only
            # mean a leg was bypassed by a condition it should not have been.
            [ "$result" = "success" ] || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::Linux packaging lane is not green — see the leg results above."
            exit 1
          fi
          echo "All Linux packaging legs succeeded."

  # Attach the .deb to the GitHub Release on a v* tag — only once DebInstall
  # has proved it on every supported release.
  DebRelease:
    needs: [DetectChanges, Deb, DebInstall]
    if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: displayxr-runtime-deb
          path: dist

      - name: Attach .deb to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/displayxr-runtime_*_amd64.deb
          fail_on_unmatched_files: true
