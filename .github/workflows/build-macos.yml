name: Build macOS

# Verifies that the runtime + sim_display driver compile cleanly on
# macOS, and (post-#277) also builds + publishes
# `DisplayXR-Installer-${VERSION}.pkg` so /release can attach it to GitHub Releases
# alongside the Windows `DisplayXRSetup-*.exe`. Two jobs:
#
#   - `Build` (kept minimal, intentionally) — fast compile check using
#     RelWithDebInfo + SERVICE/HYBRID flags. The historical workflow
#     also built every test app + the macOS installer + the 3DGS demo;
#     those add a lot of surface area for breakage. The compile check
#     is the stable contract this repo depends on for branch
#     protection. Test app builds beyond what the installer needs stay
#     out of scope — they were trimmed for a reason.
#
#   - `BuildInstaller` (new) — builds the runtime + sim-display plug-in
#     + at least one VK test app + the .pkg via
#     `scripts/build_macos.sh --installer`, asserts the payload
#     contains the plug-in registration (#274 regression guard), and
#     uploads the .pkg as a workflow artifact. Gated on `Build` so
#     compile failures fail fast.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `contents: write` is required for softprops/action-gh-release to
# create-or-update the GitHub Release for v* tag pushes (#290).
permissions:
  contents: write

jobs:
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full clone — the diff below uses pull_request.base.sha,
          # which can be older than the merge commit's first parent
          # (PR base lags main after a main push). Shallow clones miss
          # those refs and the diff fails with "fatal: bad object".
          # This job only does git plumbing, so the clone is cheap.
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # Empty diff = /release's empty "Release vX.Y.Z" marker commit on
          # main; the real build runs on the tag push (docs_only=false above).
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  Build:
    needs: DetectChanges
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # History + tags: the runtime versions itself from `git describe`
          # (cmake/DisplayXRVersion.cmake, #1790).
          fetch-depth: 0

      - name: Doc-only PR — skipping macOS build
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Skipping heavy steps; reporting success so branch protection's required-status-check on Build is satisfied."

      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          brew install cmake ninja eigen
          brew install glslang molten-vk vulkan-headers vulkan-loader
          BREW_PREFIX=$(brew --prefix)
          echo "VULKAN_SDK=$BREW_PREFIX" >> $GITHUB_ENV

      - name: Configure
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DXRT_FEATURE_SERVICE=ON \
            -DXRT_FEATURE_HYBRID_MODE=ON

      - name: Build
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build build

  BuildInstaller:
    # Sequential after Build so a compile failure fails fast and we
    # don't waste a second macos-14 runner on broken code. Both jobs
    # use macos-14; the duplicated configure/build is the cost of
    # keeping `Build` as a stable RelWithDebInfo+SERVICE+HYBRID compile
    # check while `BuildInstaller` exercises the Debug + plug-in path
    # that ships in the .pkg.
    needs: [DetectChanges, Build]
    runs-on: macos-14
    # GH_TOKEN exposes the workflow's GITHUB_TOKEN to the gh CLI AND to
    # softprops/action-gh-release (which prefers $GH_TOKEN over the
    # action's `token:` input when set). Without this, the action falls
    # back to a token path that hits "Bad credentials" against the
    # Releases API even with `permissions: contents: write` set at the
    # workflow level. Mirrors the GH_TOKEN env set in build-windows.yml.
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # History + tags: the runtime AND the .pkg are versioned from `git
          # describe` (cmake/DisplayXRVersion.cmake, #1790).
          fetch-depth: 0

      - name: Doc-only PR — skipping installer build
        if: needs.DetectChanges.outputs.docs_only == 'true'
        run: echo "Skipping; doc-only PRs don't change build inputs."

      - name: Install dependencies
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          brew install cmake ninja eigen
          brew install glslang molten-vk vulkan-headers vulkan-loader
          BREW_PREFIX=$(brew --prefix)
          echo "VULKAN_SDK=$BREW_PREFIX" >> $GITHUB_ENV

      # ── Developer ID signing + notarization (#280) ─────────────────────
      # Signs ONLY canonical-repo v* tag builds, and only when the org-level
      # secrets exist. Everything else (PRs, forks, main pushes, tag builds
      # before the secrets are provisioned) produces the same unsigned .pkg as
      # always and stays green. Signing never gates publishing: any failure
      # past this point ships the unsigned .pkg with a ::warning::.
      #
      # Org secrets (consumed by scripts/macos_sign_notarize.sh ci-keychain-setup):
      #   MACOS_APP_CERT_P12 / MACOS_INSTALLER_CERT_P12   base64 of each .p12
      #   MACOS_APP_CERT_PASSWORD / MACOS_INSTALLER_CERT_PASSWORD
      #   APPLE_TEAM_ID                                   both identities must match
      #   APPLE_NOTARY_KEY_P8                             raw AuthKey_*.p8 text
      #   APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER_ID    App Store Connect API key
      - name: macOS signing gate (#280)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        id: signgate
        run: |
          if [ "$GITHUB_REPOSITORY" != "DisplayXR/displayxr-runtime" ]; then
            echo "::notice::macOS signing skipped — $GITHUB_REPOSITORY is not the canonical repo; the .pkg ships unsigned."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "macOS signing skipped — not a v* tag build ($GITHUB_REF); the .pkg ships unsigned."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      # Secrets enter the environment ONLY in this step, and only on an
      # eligible tag build. The script never echoes them (no `set -x`).
      - name: Import signing identities into a temporary keychain
        if: needs.DetectChanges.outputs.docs_only != 'true' && steps.signgate.outputs.eligible == 'true'
        id: keychain
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if ! MISSING=$(./scripts/macos_sign_notarize.sh ci-secrets-check); then
            echo "::notice::macOS signing skipped — org secrets not provisioned: $MISSING. The .pkg ships unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Writes DXR_MACOS_{KEYCHAIN,APP_IDENTITY,INSTALLER_IDENTITY} and
          # DXR_NOTARY_KEY_{PATH,ID} / DXR_NOTARY_ISSUER into $GITHUB_ENV.
          if ./scripts/macos_sign_notarize.sh ci-keychain-setup --env-out "$GITHUB_ENV"; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS signing DISABLED — importing the signing identities failed (see log above). The .pkg ships UNSIGNED."
            ./scripts/macos_sign_notarize.sh ci-keychain-teardown || true
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi

      # With the keychain set up, build_installer.sh's sign-tree gives every
      # payload Mach-O its Developer ID + hardened-runtime signature as the LAST
      # step after all install_name_tool patching. DXR_MACOS_INSTALLER_IDENTITY
      # is withheld here so the product archive comes out unsigned; it is
      # signed + notarized in a separate step that can fall back to this
      # unsigned .pkg without rebuilding.
      - name: Build runtime + test app + installer
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          DXR_MACOS_SIGN_FALLBACK: adhoc
          DXR_MACOS_SIGN_STATUS_FILE: ${{ runner.temp }}/dxr-macos-sign-status
        run: env -u DXR_MACOS_INSTALLER_IDENTITY ./scripts/build_macos.sh --installer

      # #1790: the runtime inside the .pkg reports the checkout's version, and
      # the .pkg is named after it (exactly the tag on a v* push).
      - name: Runtime + .pkg carry the checkout's version (#1790)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(_package/DisplayXR-Installer-*.pkg)
          [ "${#pkgs[@]}" -eq 1 ] || { echo "::error::expected exactly one .pkg, found: ${pkgs[*]:-none}"; exit 1; }
          ./scripts/check_runtime_version.sh --build-dir build \
            --binary build/src/xrt/targets/openxr/openxr_displayxr.dylib \
            --package "${pkgs[0]}"

      - name: Assert .pkg payload includes plug-in + manifest (#274 regression guard)
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          SIGNED: ${{ steps.keychain.outputs.sign }}
        run: |
          set -euo pipefail
          # Filename is versioned post-PR #279
          # (DisplayXR-Installer-${VERSION}.pkg). Match by glob to stay
          # robust if the naming scheme evolves further.
          PKG=$(find _package -maxdepth 1 -name "DisplayXR-Installer*.pkg" -type f | head -1)
          if [ -z "$PKG" ] || [ ! -f "$PKG" ]; then
            echo "::error::DisplayXR-Installer*.pkg missing from _package/ — installer build did not produce expected artifact."
            ls -la _package/ || true
            exit 1
          fi
          echo "Found installer: $PKG"
          EXPAND_DIR=$(mktemp -d)
          pkgutil --expand "$PKG" "$EXPAND_DIR/expand"
          PAYLOAD="$EXPAND_DIR/expand/runtime.pkg/Payload"
          if [ ! -f "$PAYLOAD" ]; then
            echo "::error::runtime.pkg/Payload not found inside .pkg"
            exit 1
          fi
          # List the cpio.gz payload contents without extracting (faster
          # and avoids any permission/symlink surprises on the runner).
          gunzip -c "$PAYLOAD" | cpio -i -t > "$EXPAND_DIR/files" 2>/dev/null

          MISSING=0
          if ! grep -q 'DisplayProcessors/200-sim-display.json' "$EXPAND_DIR/files"; then
            echo "::error::200-sim-display.json missing from .pkg payload — vendor plug-in discovery would not find sim-display on a clean install (#274)."
            MISSING=1
          fi
          if ! grep -q 'lib/displayxr/plugins/DisplayXR-SimDisplay.dylib' "$EXPAND_DIR/files"; then
            echo "::error::DisplayXR-SimDisplay.dylib missing from .pkg payload — runtime would have no display processor on a clean install (#274)."
            MISSING=1
          fi
          # #61: the .pkg must ship the service binary + its auto-start
          # LaunchAgent, or the installed spatial shell has nothing to attach to
          # as an IPC client (blank window). build_macos.sh --installer builds
          # HYBRID, so the service is always expected here.
          if ! grep -q 'DisplayXR/bin/displayxr-service' "$EXPAND_DIR/files"; then
            echo "::error::displayxr-service missing from .pkg payload — the installed spatial shell could not attach as an IPC client (#61)."
            MISSING=1
          fi
          if ! grep -q 'LaunchAgents/com.displayxr.service.plist' "$EXPAND_DIR/files"; then
            echo "::error::com.displayxr.service.plist (service auto-start LaunchAgent) missing from .pkg payload (#61)."
            MISSING=1
          fi
          # #2264: the desktop-capture helper + its on-demand LaunchAgent, or a
          # transparent session on a weaving DP composes over black.
          if ! grep -q 'DisplayXR/bin/DisplayXRDesktopCapture.app/Contents/MacOS/DisplayXRDesktopCapture' "$EXPAND_DIR/files"; then
            echo "::error::DisplayXRDesktopCapture.app missing from .pkg payload — transparent sessions on a weaving DP would get no desktop backdrop (#2264)."
            MISSING=1
          fi
          if ! grep -q 'LaunchAgents/com.displayxr.desktop-capture.plist' "$EXPAND_DIR/files"; then
            echo "::error::com.displayxr.desktop-capture.plist (helper LaunchAgent) missing from .pkg payload (#2264)."
            MISSING=1
          fi
          # displayxr-cli: the only installed way on macOS to run selftest /
          # status or calibrate a camera (2.57.2 shipped without it).
          if ! grep -q 'DisplayXR/bin/displayxr-cli$' "$EXPAND_DIR/files"; then
            echo "::error::displayxr-cli missing from .pkg payload — no installed selftest/status/calibration on macOS."
            MISSING=1
          fi
          # The tracking host opens the camera for a camera-based provider: under
          # the hardened runtime it needs the camera entitlement and the
          # NSCameraUsageDescription the prompt shows, or the camera never opens.
          # Entitlements are applied only by a Developer ID signature (sign-tree's
          # ad-hoc path adds none), so that half is checked on signed builds only.
          (cd "$EXPAND_DIR" && gunzip -c "$PAYLOAD" | cpio -i -d --quiet '*DisplayXR/bin/displayxr-tracking-host' 2>/dev/null) || true
          HOST="$EXPAND_DIR/Library/Application Support/DisplayXR/bin/displayxr-tracking-host"
          if [ ! -f "$HOST" ]; then
            echo "::error::could not extract displayxr-tracking-host from the payload to check its signature."
            MISSING=1
          else
            if [ "$SIGNED" = "true" ] && ! codesign -d --entitlements - --xml "$HOST" 2>/dev/null | grep -q 'com.apple.security.device.camera'; then
              echo "::error::displayxr-tracking-host lacks com.apple.security.device.camera — a camera tracking provider cannot open the camera."
              MISSING=1
            fi
            if ! codesign -dv "$HOST" 2>&1 | grep -q 'Info.plist entries='; then
              echo "::error::displayxr-tracking-host has no bound Info.plist (NSCameraUsageDescription)."
              MISSING=1
            fi
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "Payload listing:"
            cat "$EXPAND_DIR/files"
            exit 1
          fi
          echo "PASS: .pkg payload contains plug-in + manifest + service + LaunchAgent + cli; tracking-host camera-ready."

      - name: Sign, notarize and staple the .pkg (#280)
        if: needs.DetectChanges.outputs.docs_only != 'true' && steps.keychain.outputs.sign == 'true'
        id: notarize
        timeout-minutes: 45
        env:
          DXR_MACOS_SIGN_STATUS_FILE: ${{ runner.temp }}/dxr-macos-sign-status
        run: |
          set -uo pipefail
          PKG=$(find _package -maxdepth 1 -name "DisplayXR-Installer-*.pkg" -type f | head -1)
          [ -n "$PKG" ] || { echo "::error::no DisplayXR-Installer-*.pkg in _package/"; exit 1; }
          if grep -q adhoc-fallback "$DXR_MACOS_SIGN_STATUS_FILE" 2>/dev/null; then
            echo "::warning::macOS .pkg ships UNSIGNED — Developer ID signing of the payload failed and fell back to ad-hoc (see the build step)."
            echo "result=unsigned (payload signing fell back to ad-hoc)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$PKG" "$RUNNER_TEMP/unsigned.pkg"
          # finalize-pkg = productsign → notarytool submit --wait (30 min cap)
          # → stapler staple; verify-pkg = pkgutil --check-signature +
          # stapler validate + spctl --assess --type install "Notarized Developer ID".
          if ./scripts/macos_sign_notarize.sh finalize-pkg "$PKG" \
             && ./scripts/macos_sign_notarize.sh verify-pkg "$PKG"; then
            echo "::notice::$(basename "$PKG") is Developer ID signed, notarized and stapled."
            echo "result=signed + notarized + stapled" >> "$GITHUB_OUTPUT"
          else
            # Signing never gates publishing (docs/specs/runtime/release-signing.md).
            echo "::warning::macOS .pkg ships UNSIGNED — productsign / notarization / stapling failed (see log above). Re-run this job to retry."
            cp -f "$RUNNER_TEMP/unsigned.pkg" "$PKG"
            echo "result=unsigned (sign/notarize failed)" >> "$GITHUB_OUTPUT"
          fi

      - name: Signature summary
        if: needs.DetectChanges.outputs.docs_only != 'true'
        env:
          RESULT: ${{ steps.notarize.outputs.result || 'unsigned (signing not enabled for this build)' }}
        run: |
          PKG=$(find _package -maxdepth 1 -name "DisplayXR-Installer-*.pkg" -type f | head -1)
          echo "macOS installer: $(basename "$PKG") — $RESULT"
          { echo "### macOS installer signature"; echo; echo "\`$(basename "$PKG")\`: **$RESULT**"; echo; echo '```'
            pkgutil --check-signature "$PKG" 2>&1 | head -8 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        if: needs.DetectChanges.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          retention-days: 3
          name: DisplayXR-Installer-macOS
          if-no-files-found: error
          # Glob — filename is `DisplayXR-Installer-${VERSION}.pkg`
          # post-PR #279 (versioned filename, parallel to Windows'
          # DisplayXRSetup-X.Y.Z.NNN.exe).
          path: _package/DisplayXR-Installer-*.pkg

      # Attach the .pkg to the v* GitHub release (#290). The action
      # create-or-updates the release: first workflow to complete on
      # the tag creates it; subsequent ones append their artifacts. The
      # filename is already versioned (DisplayXR-Installer-X.Y.Z.pkg)
      # per PR #279.
      - name: Attach macOS installer to GitHub release on tag
        if: needs.DetectChanges.outputs.docs_only != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: _package/DisplayXR-Installer-*.pkg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # Always delete the temporary keychain + key files, whatever happened.
      - name: Delete temporary signing keychain
        if: always()
        run: |
          if [ -x scripts/macos_sign_notarize.sh ]; then
            ./scripts/macos_sign_notarize.sh ci-keychain-teardown
          fi
