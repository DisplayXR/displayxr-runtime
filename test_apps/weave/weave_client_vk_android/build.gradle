// weave_client_vk_android — the reference XR_DXR_weave PRESENT-OWNER on Android
// (#1036). Owns its own SurfaceView + Vulkan swapchain, hands the runtime
// pre-weave SBS pixels in an AHardwareBuffer, presents the woven result itself.
//
// Unlike the cube apps it needs no CNSDK Java glue: the vendor display processor
// runs inside the runtime service (out-of-process), never in this process.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.displayxr.weave_client_vk_android'
    compileSdk project.sharedCompileSdk
    buildToolsVersion = buildToolsVersion

    ndkVersion "${ndk_version}"

    // prefab pulls libopenxr_loader.so + headers out of the loader .aar.
    buildFeatures {
        prefab true
    }

    defaultConfig {
        applicationId 'com.displayxr.weave_client_vk_android'
        minSdkVersion project.sharedMinSdk
        targetSdkVersion project.sharedTargetSdk
        versionCode 1
        versionName "0.1"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=${project.sharedMinSdk}",
                    "-DANDROID_STL=c++_shared"
            }
        }

        //noinspection ChromeOsAbiSupport
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "${cmake_version}"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.41'
}
