// XR_DXR_stereo_camera consumer probe for Android (stereo-camera-android §12.3):
// a CAMERA_CONSUMER-only XrInstance that enumerates, opens a stream, and reports
// rate / latency / row alignment / disparity sign. No session, no rendering.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.displayxr.camera_probe_android'
    compileSdk project.sharedCompileSdk
    buildToolsVersion = buildToolsVersion
    ndkVersion "${ndk_version}"
    buildFeatures { prefab true }
    defaultConfig {
        applicationId 'com.displayxr.camera_probe_android'
        minSdkVersion project.sharedMinSdk
        targetSdkVersion project.sharedTargetSdk
        versionCode 1
        versionName "0.1"
        externalNativeBuild {
            cmake { arguments "-DANDROID_PLATFORM=${project.sharedMinSdk}", "-DANDROID_STL=c++_shared" }
        }
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true; jniDebuggable true }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt"; version "${cmake_version}" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
