//
// workspace_controller_android — the smallest Android workspace controller
// (#1006, ADR-036 D4). It claims the CONTROLLER class (XR_DXR_spatial_workspace),
// activates the workspace overlay mode, lends the runtime its own fullscreen
// surface as the shared output, and places every connected IPC client side by
// side. No rendering of its own. Test vehicle for the Android overlay mode.
//
// It is verified by the runtime only when signed with the RUNTIME's certificate
// (both built on the same box with the same debug keystore), or when
// `adb shell setprop debug.xrt.DXR_ALLOW_UNVERIFIED_CONTROLLER 1` is set.

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.displayxr.workspace_controller_android'
    compileSdk project.sharedCompileSdk
    buildToolsVersion = buildToolsVersion

    ndkVersion "${ndk_version}"

    buildFeatures {
        prefab true
    }

    defaultConfig {
        applicationId 'com.displayxr.workspace_controller_android'
        minSdkVersion project.sharedMinSdk
        targetSdkVersion project.sharedTargetSdk
        versionCode 1
        versionName "0.1"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=${project.sharedMinSdk}",
                    "-DANDROID_STL=c++_shared"
            }
        }

        //noinspection ChromeOsAbiSupport
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "${cmake_version}"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
